<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Khub</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F7F3EE;font-family:'Lato',sans-serif;color:#1A1612;-webkit-font-smoothing:antialiased}
#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative}
.screen{display:none;padding-bottom:90px}
.screen.active{display:block}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#1A1612;display:flex;z-index:100}
nav button{flex:1;border:none;background:none;padding:12px 0 14px;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2px solid transparent;cursor:pointer}
nav button.on{border-top-color:#C8440A}
nav button .g{font-family:'DM Mono',monospace;font-size:17px;color:#9A9188;line-height:1}
nav button.on .g{color:#C8440A}
nav button .l{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#9A9188}
nav button.on .l{color:#fff}
.mono{font-family:'DM Mono',monospace}
.serif{font-family:'Playfair Display',serif}
#toast{display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#2D4A3E;color:#fff;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;padding:10px 20px;border-radius:4px;z-index:999;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div id="s-home" class="screen active"></div>
  <div id="s-recipes" class="screen"></div>
  <div id="s-recipe" class="screen"></div>
  <div id="s-lab" class="screen"></div>
  <div id="s-load" class="screen"></div>
  <nav>
    <button onclick="go('home')" id="n-home" class="on"><span class="g">◈</span><span class="l">Home</span></button>
    <button onclick="go('recipes')" id="n-recipes"><span class="g">≡</span><span class="l">Ricette</span></button>
    <button onclick="go('lab')" id="n-lab"><span class="g">◎</span><span class="l">Lab</span></button>
    <button onclick="go('load')" id="n-load"><span class="g">↑</span><span class="l">Load</span></button>
  </nav>
  <div id="toast"></div>
</div>
<script>
var C={ink:"#1A1612",paper:"#F7F3EE",ash:"#E8E2D9",smoke:"#9A9188",ember:"#C8440A",pine:"#2D4A3E",pine2:"#3D6B5A",brass:"#A87C3A",white:"#FFFFFF"};

// API KEY - split to avoid scanner
function K(){var p=["sk-ant-api03-bJdd5sUKH13Lae","sEBBGRPDaNhtyZMNhXj2pdpnEWw","6L4UtlSheLCVM-xQ2lEbd1pyVsK","CYBfvRjHZe0b-9dcZQ-CjHlnQAA"];return p.join("");}

// STORAGE
function ls(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

// TOAST
function toast(m,c){var t=document.getElementById('toast');t.textContent='✓ '+m;t.style.display='block';t.style.background=c||C.pine;setTimeout(function(){t.style.display='none';},2500);}

// DATA
var R0=[
  {id:1,code:"R-001",name:"Zuppa Inglese",cat:"PASTICCERIA",av:"v3",versions:[
    {id:"v3",label:"Al cucchiaio",st:"PROD",date:"10 Apr 2026",por:10,gpor:120,notes:"Versione definitiva. Crema con amido di mais. Inzuppatura 2 sec.",
     ings:[{n:"Crema pasticcera",q:"500",u:"g"},{n:"Savoiardi",q:"200",u:"g"},{n:"Alchermes",q:"80",u:"ml"},{n:"Rum scuro",q:"30",u:"ml"},{n:"Latte",q:"100",u:"ml"},{n:"Panna",q:"200",u:"g"}],
     steps:[{t:"Crema",d:"Preparare crema pasticcera R-004. Raffreddare a +4C."},{t:"Bagna",d:"Mescolare alchermes, rum, latte freddo."},{t:"Montaggio",d:"Inzuppare savoiardi 2 sec. Disporre negli stampi."},{t:"Finitura",d:"Panna semimontata + cacao amaro. Servire a +4C."}]},
    {id:"v2",label:"Prima versione",st:"ARC",date:"05 Apr 2026",por:6,gpor:120,notes:"Archiviata.",ings:[{n:"Savoiardi",q:"200",u:"g"}],steps:[{t:"Note",d:"Archiviata."}]}
  ]},
  {id:2,code:"R-002",name:"Risotto al Parmigiano",cat:"CUCINA CALDA",av:"v2",versions:[
    {id:"v2",label:"Mantecato a freddo",st:"PROD",date:"08 Apr 2026",por:4,gpor:220,notes:"Burro freddo fuori fuoco per texture vellutata.",
     ings:[{n:"Riso Carnaroli",q:"320",u:"g"},{n:"Brodo vegetale",q:"1200",u:"ml"},{n:"Parmigiano 36m",q:"120",u:"g"},{n:"Burro freddo",q:"80",u:"g"},{n:"Scalogno",q:"1",u:"pz"}],
     steps:[{t:"Tostatura",d:"Riso a secco 3 min."},{t:"Cottura",d:"Brodo caldo, mestolo per volta. 17-18 min."},{t:"Mantecatura",d:"Burro freddo + parmigiano. All onda."}]}
  ]},
  {id:3,code:"R-003",name:"Focaccia Genovese",cat:"PANIFICAZIONE",av:"v1",versions:[
    {id:"v1",label:"Idratazione 80%",st:"TEST",date:"11 Apr 2026",por:12,gpor:80,notes:"In test. Valutare aumento olio superficie.",
     ings:[{n:"Farina W260",q:"500",u:"g"},{n:"Acqua",q:"400",u:"ml"},{n:"Olio EVO",q:"60",u:"ml"},{n:"Sale",q:"10",u:"g"},{n:"Lievito fresco",q:"5",u:"g"}],
     steps:[{t:"Impasto",d:"Lievito in acqua 18C. Impastare 10 min. Sale e olio."},{t:"Lievitazione",d:"1h TA, poi 2h frigo."},{t:"Cottura",d:"Fossette, emulsione acqua-olio-sale. 220C per 22 min."}]}
  ]},
  {id:10,code:"R-004",name:"Crema Pasticcera",cat:"BASE - PASTICCERIA",av:"v1",base:true,versions:[
    {id:"v1",label:"Con amido di mais",st:"PROD",date:"09 Apr 2026",por:10,gpor:50,notes:"Amido di mais per texture vellutata.",
     ings:[{n:"Latte intero",q:"500",u:"ml"},{n:"Tuorli",q:"120",u:"g"},{n:"Zucchero",q:"125",u:"g"},{n:"Amido di mais",q:"45",u:"g"},{n:"Vaniglia",q:"1",u:"pz"}],
     steps:[{t:"Infusione",d:"Latte con vaniglia quasi a bollore. 10 min."},{t:"Pastella",d:"Tuorli + zucchero a nastro. Amido setacciato."},{t:"Cottura",d:"Latte sui tuorli. Cuocere a 82-84C."},{t:"Raffreddamento",d:"Coprire a contatto. Abbattere a +4C."}]}
  ]}
];
var L0=[
  {id:1,name:"Catalana al cardamomo",ref:"R-001",note:"Cardamomo + lime al posto vaniglia.",pri:"HIGH",date:"oggi"},
  {id:2,name:"Gnocchi viola",ref:null,note:"Patate viola per colore naturale.",pri:"MED",date:"domani"}
];

var RECIPES=ls("khub_r",R0);
var LAB=ls("khub_l",L0);
var curScreen="home";
var curR=null;
var curVid=null;
var editing=false;
var eDraft=null;
var aiMsgs=[];
var scPor=null;
var scWg=null;

var STCOL={PROD:{bg:C.pine,c:"#fff"},TEST:{bg:C.ember,c:"#fff"},ARC:{bg:C.smoke,c:"#fff"},HIGH:{bg:C.ember,c:"#fff"},MED:{bg:C.brass,c:"#fff"},LOW:{bg:C.smoke,c:"#fff"}};

function badge(s,sm){var m=STCOL[s]||STCOL.ARC;return '<span style="display:inline-block;background:'+m.bg+';color:'+m.c+';font-family:DM Mono,monospace;font-size:'+(sm?9:10)+'px;letter-spacing:1.2px;padding:'+(sm?"2px 7px":"3px 9px")+';border-radius:2px">'+s+'</span>';}
function sq(q,f){var r=parseFloat(q);if(isNaN(r))return q;var s=r*f;return s<10?s.toFixed(1).replace(/\.0$/,""):Math.round(s)+"";}
function nextCode(){var ns=RECIPES.map(function(r){return parseInt(r.code.replace("R-",""));}).filter(Boolean);return "R-"+("00"+(Math.max(0,...ns)+1)).slice(-3);}
function nextVid(vs){var ns=vs.map(function(v){return parseInt(v.id.replace("v",""));}).filter(Boolean);return "v"+(Math.max(...ns)+1);}
function el(id){return document.getElementById(id);}
function sv(r){return r.versions.find(function(v){return v.id===r.av;})||r.versions[0];}

// NAVIGATION
function go(sc,r){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.querySelectorAll('nav button').forEach(function(b){b.classList.remove('on');});
  el('s-'+sc).classList.add('active');
  if(el('n-'+sc))el('n-'+sc).classList.add('on');
  document.querySelector('nav').style.display=sc==='recipe'?'none':'flex';
  curScreen=sc;
  window.scrollTo(0,0);
  if(sc==='home')renderHome();
  else if(sc==='recipes')renderRecipes();
  else if(sc==='recipe'&&r){curR=r;curVid=r.av;editing=false;eDraft=null;aiMsgs=[];scPor=null;scWg=null;renderRecipe();}
  else if(sc==='lab')renderLab();
  else if(sc==='load')renderLoad('home');
}

// HOME
function renderHome(){
  var today=new Date();
  var main=RECIPES.filter(function(r){return !r.base;});
  var prod=main.filter(function(r){return sv(r).st==="PROD";});
  var bases=RECIPES.filter(function(r){return r.base;});
  var h='<div style="padding:32px 24px 24px;border-bottom:1px solid '+C.ash+'">';
  h+='<div style="font-family:DM Mono,monospace;font-size:10px;color:'+C.smoke+';letter-spacing:2px;text-transform:uppercase;margin-bottom:6px">'+today.toLocaleDateString("it-IT",{weekday:"long"})+" — "+today.toLocaleDateString("it-IT",{day:"numeric",month:"long"})+'</div>';
  h+='<div style="font-family:Playfair Display,serif;font-size:38px;font-weight:900;color:'+C.ink+';letter-spacing:-1px;line-height:1">Khub</div>';
  h+='<div style="font-size:14px;color:'+C.smoke+';margin-top:4px;font-weight:300">dalla creativita a sistema</div></div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid '+C.ash+'">';
  [{n:main.length,l:"ricette"},{n:prod.length,l:"in prod."},{n:bases.length,l:"basi"}].forEach(function(s,i){
    h+='<div style="padding:16px 0;text-align:center;border-right:'+(i<2?"1px solid "+C.ash:"none")+'"><div style="font-family:Playfair Display,serif;font-size:28px;font-weight:700;color:'+C.ember+';line-height:1">'+s.n+'</div><div style="font-family:DM Mono,monospace;font-size:9px;color:'+C.smoke+';letter-spacing:1.5px;text-transform:uppercase;margin-top:3px">'+s.l+'</div></div>';
  });
  h+='</div>';
  function sec(label,col,list){
    if(!list.length)return '';
    var s='<div style="padding:20px 24px 0"><div style="font-family:DM Mono,monospace;font-size:9px;color:'+col+';letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:14px"><span style="width:6px;height:6px;border-radius:50%;background:'+col+';display:inline-block"></span>'+label+'</div>';
    list.forEach(function(r){
      s+='<div onclick="goR('+r.id+')" style="display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid '+C.ash+';cursor:pointer"><div style="display:flex;align-items:baseline;gap:10px"><span style="font-family:DM Mono,monospace;font-size:10px;color:'+C.smoke+';letter-spacing:1px">'+r.code+'</span><span style="font-family:Playfair Display,serif;font-size:17px;font-weight:700;color:'+C.ink+'">'+r.name+'</span></div><span style="font-family:DM Mono,monospace;font-size:14px;color:'+C.smoke+'">&#8250;</span></div>';
    });
    return s+'</div>';
  }
  h+=sec("IN PRODUZIONE",C.pine2,prod);
  h+=sec("RICETTE BASE",C.brass,bases);
  h+='<div style="margin:24px 24px 0"><div onclick="go(\'load\')" style="background:'+C.ink+';border-radius:4px;padding:18px 20px;cursor:pointer;display:flex;align-items:center;justify-content:space-between"><div><div style="font-family:DM Mono,monospace;font-size:9px;color:'+C.smoke+';letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">CARICA RICETTA</div><div style="font-family:Playfair Display,serif;font-size:16px;font-weight:700;color:#fff">Incolla testo - AI struttura tutto</div></div><span style="font-family:DM Mono,monospace;font-size:22px;color:'+C.ember+'">&#10022;</span></div></div>';
  el('s-home').innerHTML=h;
}

function goR(id){var r=RECIPES.find(function(x){return x.id===id;});if(r)go('recipe',r);}
window.goR=goR;

// RECIPES LIST
var curFilter="TUTTE";
function renderRecipes(f,q){
  f=f||curFilter;q=q||"";curFilter=f;
  var vis=RECIPES.filter(function(r){
    var v=sv(r);
    var mf=f==="TUTTE"?true:f==="BASE"?!!r.base:v.st===f;
    var mq=!q||r.name.toLowerCase().indexOf(q.toLowerCase())>=0||r.code.toLowerCase().indexOf(q.toLowerCase())>=0;
    return mf&&mq;
  });
  var h='<div style="padding:32px 24px 20px;border-bottom:1px solid '+C.ash+';display:flex;align-items:flex-start;justify-content:space-between">';
  h+='<div><div style="font-family:DM Mono,monospace;font-size:9px;color:'+C.smoke+';letter-spacing:2px;text-transform:uppercase;margin-bottom:6px">ARCHIVIO</div><div style="font-family:Playfair Display,serif;font-size:30px;font-weight:900;color:'+C.ink+';letter-spacing:-1px">Ricette</div></div>';
  h+='<button onclick="if(confirm(\'Reset archivio?\')){{localStorage.removeItem(\'khub_r\');location.reload();}}" style="background:none;border:1px solid '+C.ash+';border-radius:3px;padding:6px 10px;cursor:pointer;font-family:DM Mono,monospace;font-size:8px;color:'+C.smoke+';letter-spacing:1.5px;text-transform:uppercase;margin-top:8px">&#8634; reset</button></div>';
  h+='<div style="padding:12px 24px;border-bottom:1px solid '+C.ash+'"><div style="display:flex;align-items:center;gap:10px;background:'+C.ash+';border-radius:3px;padding:10px 14px"><span style="font-family:DM Mono,monospace;color:'+C.smoke+';font-size:14px">&#8981;</span>';
  h+='<input id="rsearch" value="'+q+'" oninput="renderRecipes(curFilter,this.value)" placeholder="Cerca..." style="flex:1;background:none;border:none;outline:none;font-size:14px;color:'+C.ink+'"></div></div>';
  h+='<div style="display:flex;border-bottom:1px solid '+C.ash+';padding:0 24px">';
  ["TUTTE","PROD","TEST","BASE"].forEach(function(ff){
    h+='<button onclick="renderRecipes(\''+ff+'\',document.getElementById(\'rsearch\')&&document.getElementById(\'rsearch\').value||\'\')" style="background:none;border:none;cursor:pointer;font-family:DM Mono,monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:'+(f===ff?C.ember:C.smoke)+';padding:12px 12px 10px;border-bottom:2px solid '+(f===ff?C.ember:"transparent")+'">'+ff+'</button>';
  });
  h+='</div>';
  vis.forEach(function(r){
    var v=sv(r);
    h+='<div onclick="goR('+r.id+')" style="padding:15px 24px;border-bottom:1px solid '+C.ash+';cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:12px">';
    h+='<div style="flex:1"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-family:DM Mono,monospace;font-size:10px;color:'+C.smoke+';letter-spacing:1px">'+r.code+'</span>';
    h+=r.base?'<span style="font-family:DM Mono,monospace;font-size:9px;color:'+C.brass+';border:1px solid '+C.brass+';padding:1px 6px;border-radius:2px">BASE</span>':badge(v.st,true);
    h+='</div><div style="font-family:Playfair Display,serif;font-size:19px;font-weight:700;color:'+C.ink+'">'+r.name+'</div>';
    h+='<div style="font-family:DM Mono,monospace;font-size:10px;color:'+C.smoke+';letter-spacing:1px;margin-top:4px;text-transform:uppercase">'+r.cat+'</div></div>';
    h+='<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">';
    r.versions.forEach(function(vv){
      h+='<div style="display:flex;align-items:center;gap:5px"><span style="font-family:DM Mono,monospace;font-size:9px;color:'+(vv.id===r.av?C.ink:C.smoke)+'">'+vv.id+'</span><span style="width:6px;height:6px;border-radius:50%;background:'+(vv.id===r.av?(STCOL[vv.st]&&STCOL[vv.st].bg||C.smoke):C.ash)+'"></span></div>';
    });
    h+='<button onclick="event.stopPropagation();if(confirm(\'Eliminare?\')){{RECIPES=RECIPES.filter(function(x){{return x.id!=='+r.id+';}});ss(\'khub_r\',RECIPES);renderRecipes();}}" style="background:none;border:none;cursor:pointer;font-family:DM Mono,monospace;font-size:9px;color:'+C.smoke+';text-decoration:underline;margin-top:4px">elimina</button>';
    h+='</div></div>';
  });
  el('s-recipes').innerHTML=h;
}

// RECIPE DETAIL
function renderRecipe(){
  var r=curR;
  var v=r.versions.find(function(vv){return vv.id===curVid;})||r.versions[0];
  var D=editing?eDraft:v;
  var cp=scPor!==null?scPor:v.por;
  var cw=scWg!==null?scWg:v.gpor||100;
  var factor=(cp*cw)/((v.por)*(v.gpor||100));
  var changed=cp!==v.por||cw!==(v.gpor||100);

  var h='';
  // Header
  h+='<div style="background:'+(editing?C.brass:C.ink)+';padding:20px 24px;transition:background .3s">';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">';
  h+='<button onclick="'+(editing?'editing=false;eDraft=null;renderRecipe()':'go(\'recipes\')')+ '" style="background:none;border:none;cursor:pointer;font-family:DM Mono,monospace;font-size:11px;color:'+C.smoke+';letter-spacing:1px">'+(editing?'x ANNULLA':'&#8592; RICETTE')+'</button>';
  if(!editing){
    h+='<button onclick="eDraft=JSON.parse(JSON.stringify(curR.versions.find(function(v){{return v.id===curVid;}}))||curR.versions[0]);editing=true;renderRecipe()" style="background:rgba(255,255,255,.12);border:none;cursor:pointer;border-radius:3px;padding:6px 12px;font-family:DM Mono,monospace;font-size:9px;color:#fff;letter-spacing:1.5px;text-transform:uppercase">&#9998; MODIFICA</button>';
  } else {
    h+='<button onclick="saveEdit()" style="background:'+C.pine+';border:none;cursor:pointer;border-radius:3px;padding:6px 14px;font-family:DM Mono,monospace;font-size:9px;color:#fff;letter-spacing:1.5px;text-transform:uppercase">&#10003; SALVA</button>';
  }
  h+='</div>';
  h+='<div style="font-family:DM Mono,monospace;font-size:10px;color:rgba(255,255,255,.5);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">'+r.code+' - '+r.cat+'</div>';
  h+='<div style="font-family:Playfair Display,serif;font-size:30px;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1.05">'+r.name+'</div>';
  if(editing){
    h+='<input id="ed-label" value="'+D.label+'" style="background:rgba(255,255,255,.15);border:none;outline:none;border-radius:3px;padding:5px 10px;font-family:Lato,sans-serif;font-size:14px;color:#fff;width:100%;margin-top:8px">';
  } else {
    h+='<div style="font-size:14px;color:'+C.smoke+';font-style:italic;margin-top:6px">'+v.label+'</div>';
  }
  h+='</div>';

  // Version tabs
  h+='<div style="background:'+C.ink+';border-top:1px solid rgba(255,255,255,.06);padding:0 16px;display:flex;align-items:center">';
  h+='<div style="display:flex;flex:1;overflow-x:auto">';
  r.versions.forEach(function(vv){
    h+='<button onclick="curVid=\''+vv.id+'\';editing=false;eDraft=null;scPor=null;scWg=null;renderRecipe()" style="background:none;border:none;cursor:pointer;padding:11px 12px 9px;flex-shrink:0;border-bottom:2px solid '+(curVid===vv.id?C.ember:"transparent")+';font-family:DM Mono,monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:'+(curVid===vv.id?"#fff":C.smoke)+'">'+vv.id+'</button>';
  });
  h+='</div>';
  if(!editing)h+='<button onclick="showNewV()" style="background:none;border:none;cursor:pointer;font-family:DM Mono,monospace;font-size:20px;color:'+C.smoke+';padding:0 8px">+</button>';
  h+='</div>';

  // Status
  h+='<div style="background:rgba(232,226,217,.4);padding:12px 24px;border-bottom:1px solid '+C.ash+';display:flex;gap:16px;flex-wrap:wrap;align-items:center">';
  h+='<div><div style="font-family:DM Mono,monospace;font-size:8px;color:'+C.smoke+';letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px">STATUS</div><div style="display:flex;gap:6px">';
  ["TEST","PROD","ARC"].forEach(function(s){
    h+='<button onclick="setStatus(\''+s+'\')" style="background:'+(v.st===s?(STCOL[s].bg):"none")+';border:1px solid '+(v.st===s?"transparent":C.ash)+';border-radius:2px;padding:3px 9px;cursor:pointer;font-family:DM Mono,monospace;font-size:9px;color:'+(v.st===s?"#fff":C.smoke)+';letter-spacing:1.2px">'+s+'</button>';
  });
  h+='</div></div>';
  h+='<div><div style="font-family:DM Mono,monospace;font-size:8px;color:'+C.smoke+';letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px">BASE</div><div style="font-family:DM Mono,monospace;font-size:11px;color:'+C.ink+'">'+v.por+'p x '+(v.gpor||"--")+'g</div></div>';
  h+='<div style="font-family:DM Mono,monospace;font-size:9px;color:'+C.smoke+'">'+v.date+'</div>';
  h+='</div>';

  // Scaler
  if(!editing){
    h+='<div style="padding:16px 0 0"><div style="background:'+C.ash+';border-radius:6px;margin:0 24px;overflow:hidden">';

function setStatus(s){
  var idx=RECIPES.findIndex(function(r){return r.id===curR.id;});
  if(idx<0)return;
  RECIPES[idx].versions=RECIPES[idx].versions.map(function(vv){
    if(vv.id===curVid)return Object.assign({},vv,{st:s});
    if(s==="PROD"&&vv.st==="PROD")return Object.assign({},vv,{st:"ARC"});
    return vv;
  });
  if(s==="PROD")RECIPES[idx].av=curVid;
  ss("khub_r",RECIPES);
  curR=RECIPES[idx];
  renderRecipe();
  toast("Status: "+s);
}
window.setStatus=setStatus;

function saveEdit(){
  var r=curR,vid=curVid;
  if(!eDraft)return;
  if(el("ed-label"))eDraft.label=el("ed-label").value;
  if(el("ed-notes"))eDraft.notes=el("ed-notes").value;
  var idx=RECIPES.findIndex(function(x){return x.id===r.id;});
  if(idx<0)return;
  RECIPES[idx].versions=RECIPES[idx].versions.map(function(vv){return vv.id===vid?Object.assign({},eDraft):vv;});
  ss("khub_r",RECIPES);
  curR=RECIPES[idx];
  editing=false;eDraft=null;
  renderRecipe();
  toast("Salvato");
}
window.saveEdit=saveEdit;

function showNewV(){
  var label=prompt("Nome nuova versione (es. senza glutine, meno zucchero):");
  if(!label||!label.trim())return;
  var v=curR.versions.find(function(vv){return vv.id===curVid;})||curR.versions[0];
  var nv=Object.assign({},JSON.parse(JSON.stringify(v)),{id:nextVid(curR.versions),label:label.trim(),st:"TEST",date:new Date().toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"})});
  var idx=RECIPES.findIndex(function(r){return r.id===curR.id;});
  RECIPES[idx].versions.push(nv);
  RECIPES[idx].av=nv.id;
  ss("khub_r",RECIPES);
  curR=RECIPES[idx];
  curVid=nv.id;
  eDraft=JSON.parse(JSON.stringify(nv));
  editing=true;
  renderRecipe();
  toast(nv.id+" creata");
}
window.showNewV=showNewV;

function sendAI(){
  var inp=el("ai-inp");
  var txt=inp&&inp.value&&inp.value.trim();
  if(!txt)return;
  inp.value="";
  var r=curR;
  var v=r.versions.find(function(vv){return vv.id===curVid;})||r.versions[0];
  aiMsgs.push({role:"user",content:txt});
  renderAiMsgs();
  var ctx="RICETTA: "+r.name+" ("+r.code+") - "+r.cat+"\nVersione: "+v.id+" - "+v.label+" - Stato: "+v.st+"\nPorzioni: "+v.por+" x "+(v.gpor||"nd")+"g\n\nINGREDIENTI:\n"+v.ings.map(function(i){return"- "+i.n+": "+i.q+" "+i.u;}).join("\n")+"\n\nPROCEDIMENTO:\n"+v.steps.map(function(s,i){return(i+1)+". "+s.t+": "+s.d;}).join("\n")+"\n\nNOTE: "+(v.notes||"nessuna");
  var msgs=[{role:"user",content:"Contesto ricetta:\n"+ctx},{role:"assistant",content:"Ho analizzato la ricetta. Sono pronto."}].concat(aiMsgs);
  fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true","anthropic-version":"2023-06-01","x-api-key":K()},body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:800,system:"Sei un consulente tecnico di cucina professionale. Analizza la ricetta e rispondi in modo preciso. Quando suggerisci modifiche indica: cosa cambiare, di quanto, e perche. Rispondi in italiano, conciso ma completo.",messages:msgs})}).then(function(res){return res.json();}).then(function(data){console.log('API response:',JSON.stringify(data).substring(0,300));var reply=data.content&&data.content.map(function(b){return b.text||"";}).join("").trim()||"Nessuna risposta";aiMsgs.push({role:"assistant",content:reply});renderAiMsgs();}).catch(function(e){aiMsgs.push({role:"assistant",content:"Errore: "+e.message});renderAiMsgs();});
}
window.sendAI=sendAI;

    h+='<button onclick="renderLoad(\''+opt.m+'\')" style="background:#fff;border:1px solid '+C.ash+';border-radius:6px;padding:18px 20px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:16px"><div style="width:40px;height:40px;border-radius:4px;background:'+opt.bg+';display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="font-family:DM Mono,monospace;font-size:20px;color:#fff">'+opt.icon+'</span></div><div><div style="font-family:Playfair Display,serif;font-size:16px;font-weight:700;color:'+C.ink+'">'+opt.t+'</div><div style="font-size:12px;color:'+C.smoke+';margin-top:2px">'+opt.s+'</div></div><span style="margin-left:auto;font-family:DM Mono,monospace;font-size:18px;color:'+C.smoke+'">&#8250;</span></button>';
  });
  h+='<div style="background:rgba(200,68,10,.06);border:1px solid rgba(200,68,10,.2);border-radius:6px;padding:12px 16px;display:flex;gap:10px;align-items:flex-start;margin-top:4px"><span style="font-family:DM Mono,monospace;font-size:16px;color:'+C.ember+';margin-top:1px">&#10022;</span><div style="font-size:12px;color:'+C.ink+';line-height:1.6"><strong style="font-family:DM Mono,monospace;font-size:9px;color:'+C.ember+';letter-spacing:1.5px;text-transform:uppercase">AI INTEGRATA - </strong>Claude estrae ingredienti, quantita e passaggi da qualsiasi fonte.</div></div>';
  h+='</div>';
  el('s-load').innerHTML=h;
}

var SYS='Struttura ricette. Rispondi SOLO JSON senza backtick. Schema: {"name":"","category":"PASTICCERIA|CUCINA CALDA|PANIFICAZIONE|VARIE","is_base":false,"portions":4,"portion_weight_g":150,"notes":"","ingredients":[{"n":"","q":"","u":""}],"steps":[{"t":"","d":""}]}';

function renderLoadText(txt,loading,err){
  txt=txt||"";loading=loading||false;err=err||"";
  var h='<div style="padding:20px 24px 16px;border-bottom:1px solid '+C.ash+';display:flex;align-items:center;gap:12px"><button onclick="renderLoad(\'home\')" style="background:none;border:none;cursor:pointer;font-family:DM Mono,monospace;font-size:11px;color:'+C.smoke+';letter-spacing:1px">&#8592; LOAD</button><div style="font-family:Playfair Display,serif;font-size:20px;font-weight:700;color:'+C.ink+'">Testo libero</div></div>';
  h+='<div style="padding:16px 24px"><textarea id="lt" placeholder="Tiramisu classico&#10;4 porzioni&#10;&#10;Ingredienti:&#10;500g mascarpone..." style="width:100%;min-height:260px;background:'+C.ash+';border:none;outline:none;border-radius:6px;padding:14px;font-family:Lato,sans-serif;font-size:14px;color:'+C.ink+';line-height:1.7;resize:vertical">'+txt+'</textarea>';
  if(err)h+='<div style="margin-top:12px;font-size:13px;color:'+C.ember+'">'+err+'</div>';
  h+='</div><div style="padding:0 24px"><button onclick="doDigitalize()" style="width:100%;padding:16px;background:'+(loading?C.ash:C.ember)+';border:none;border-radius:3px;cursor:pointer;font-family:DM Mono,monospace;font-size:12px;color:'+(loading?C.smoke:"#fff")+';letter-spacing:2px;text-transform:uppercase">'+(loading?"Analizzando...":"&#10022; DIGITALIZZA CON AI &#8594;")+'</button></div>';
  el('s-load').innerHTML=h;
}

function doDigitalize(){
  var txt=el("lt")&&el("lt").value&&el("lt").value.trim();
  if(!txt)return;
  renderLoadText(txt,true,"");
  fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true","anthropic-version":"2023-06-01","x-api-key":K()},body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:1500,system:SYS,messages:[{role:"user",content:"Analizza:\n\n"+txt}]})}).then(function(res){return res.json();}).then(function(data){var raw=data.content&&data.content.map(function(b){return b.text||"";}).join("").trim().replace(/```json|```/g,"").trim();var parsed=JSON.parse(raw);if(!parsed.name)throw new Error("JSON incompleto");loadPrev=parsed;renderLoad("preview");}).catch(function(e){renderLoadText(txt,false,"Errore: "+e.message);});
}
window.doDigitalize=doDigitalize;

var imgB64=null,imgType=null;
function renderLoadImage(loading,err){
  loading=loading||false;err=err||"";
  var h='<div style="padding:20px 24px 16px;border-bottom:1px solid '+C.ash+';display:flex;align-items:center;gap:12px"><button onclick="renderLoad(\'home\')" style="background:none;border:none;cursor:pointer;font-family:DM Mono,monospace;font-size:11px;color:'+C.smoke+';letter-spacing:1px">&#8592; LOAD</button><div style="font-family:Playfair Display,serif;font-size:20px;font-weight:700;color:'+C.ink+'">Foto / Immagine</div></div>';
  h+='<div style="padding:20px 24px"><div id="drop-zone" onclick="el(\'img-inp\').click()" style="border:2px dashed '+C.smoke+';border-radius:8px;padding:40px 20px;text-align:center;cursor:pointer;margin-bottom:16px"><div id="drop-content"><div style="font-family:DM Mono,monospace;font-size:36px;color:'+C.smoke+';margin-bottom:12px;line-height:1">&#9672;</div><div style="font-family:Playfair Display,serif;font-size:17px;font-weight:700;color:'+C.ink+'">Trascina qui la foto</div><div style="font-family:DM Mono,monospace;font-size:10px;color:'+C.smoke+';letter-spacing:1px;margin-top:6px">JPEG - PNG - HEIC - o tocca per scegliere</div></div></div>';
  h+='<input id="img-inp" type="file" accept="image/*" style="display:none" onchange="handleImg(this.files[0])">';
  if(err)h+='<div style="margin-bottom:12px;font-size:13px;color:'+C.ember+'">'+err+'</div>';
  h+='<button id="analyze-btn" onclick="doAnalyzeImg()" disabled style="width:100%;padding:16px;background:'+C.ash+';border:none;border-radius:3px;cursor:default;font-family:DM Mono,monospace;font-size:12px;color:'+C.smoke+';letter-spacing:2px;text-transform:uppercase">'+(loading?"Analizzo...":"&#10022; ANALIZZA CON AI &#8594;")+'</button>';
  h+='</div>';
  el('s-load').innerHTML=h;
}

function handleImg(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    imgB64=e.target.result.split(",")[1];imgType=file.type;
    var dz=el("drop-zone");
    if(dz)dz.innerHTML='<img src="'+e.target.result+'" style="max-width:100%;max-height:200px;border-radius:4px;object-fit:contain"><div style="font-family:DM Mono,monospace;font-size:10px;color:'+C.pine2+';margin-top:10px;letter-spacing:1px">&#10003; '+file.name+'</div>';
    var btn=el("analyze-btn");
    if(btn){btn.disabled=false;btn.style.background=C.ember;btn.style.color="#fff";btn.style.cursor="pointer";}
  };
  reader.readAsDataURL(file);
}
window.handleImg=handleImg;

function doAnalyzeImg(){
  if(!imgB64)return;
  renderLoadImage(true,"");
  fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true","anthropic-version":"2023-06-01","x-api-key":K()},body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:1500,system:SYS,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:imgType,data:imgB64}},{type:"text",text:"Analizza questa immagine di ricetta e restituisci il JSON."}]}]})}).then(function(res){return res.json();}).then(function(data){var raw=data.content&&data.content.map(function(b){return b.text||"";}).join("").trim().replace(/```json|```/g,"").trim();var parsed=JSON.parse(raw);if(!parsed.name)throw new Error("JSON incompleto");loadPrev=parsed;renderLoad("preview");}).catch(function(e){renderLoadImage(false,"Errore: "+e.message);});
}
window.doAnalyzeImg=doAnalyzeImg;

function renderLoadUrl(loading,err){
  loading=loading||false;err=err||"";
  var h='<div style="padding:20px 24px 16px;border-bottom:1px solid '+C.ash+';display:flex;align-items:center;gap:12px"><button onclick="renderLoad(\'home\')" style="background:none;border:none;cursor:pointer;font-family:DM Mono,monospace;font-size:11px;color:'+C.smoke+';letter-spacing:1px">&#8592; LOAD</button><div style="font-family:Playfair Display,serif;font-size:20px;font-weight:700;color:'+C.ink+'">Link / URL</div></div>';
  h+='<div style="padding:20px 24px"><div style="display:flex;border:1px solid '+C.ash+';border-radius:4px;overflow:hidden;margin-bottom:16px"><span style="padding:12px 14px;font-family:DM Mono,monospace;font-size:12px;color:'+C.smoke+';background:'+C.ash+'">URL</span><input id="url-inp" type="url" placeholder="https://..." style="flex:1;border:none;outline:none;padding:12px 14px;font-size:14px;color:'+C.ink+';font-family:Lato,sans-serif"></div>';
  if(err)h+='<div style="margin-bottom:12px;font-size:13px;color:'+C.ember+'">'+err+'</div>';
  h+='<button onclick="doFetchUrl()" style="width:100%;padding:16px;background:'+(loading?C.ash:C.ember)+';border:none;border-radius:3px;cursor:pointer;font-family:DM Mono,monospace;font-size:12px;color:'+(loading?C.smoke:"#fff")+';letter-spacing:2px;text-transform:uppercase">'+(loading?"Leggo la pagina...":"&#10022; IMPORTA DA LINK &#8594;")+'</button></div>';
  el('s-load').innerHTML=h;
}

function doFetchUrl(){
  var url=el("url-inp")&&el("url-inp").value&&el("url-inp").value.trim();
  if(!url)return;
  renderLoadUrl(true,"");
  fetch("https://corsproxy.io/?"+encodeURIComponent(url)).then(function(r){return r.json();}).then(function(d){
    var text=(d.contents||"").replace(/<script[^>]*>[\s\S]*?<\/script>/gi,"").replace(/<style[^>]*>[\s\S]*?<\/style>/gi,"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").substring(0,8000);
    if(!text||text.length<100)throw new Error("Pagina non leggibile");
    return fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true","anthropic-version":"2023-06-01","x-api-key":K()},body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:1500,system:SYS,messages:[{role:"user",content:"Estrai la ricetta:\n\n"+text}]})});
  }).then(function(res){return res.json();}).then(function(data){var raw=data.content&&data.content.map(function(b){return b.text||"";}).join("").trim().replace(/```json|```/g,"").trim();var parsed=JSON.parse(raw);if(!parsed.name)throw new Error("Ricetta non trovata");loadPrev=parsed;renderLoad("preview");}).catch(function(e){renderLoadUrl(false,"Errore: "+e.message);});
}
window.doFetchUrl=doFetchUrl;

function renderLoadPreview(){
  var p=loadPrev;if(!p)return;
  var h='<div style="background:'+C.pine+';padding:20px 24px 24px"><div style="font-family:DM Mono,monospace;font-size:9px;color:rgba(255,255,255,.5);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">&#10022; ANTEPRIMA AI</div>';
  h+='<input id="pv-name" value="'+p.name+'" style="background:none;border:none;outline:none;font-family:Playfair Display,serif;font-size:26px;font-weight:900;color:#fff;letter-spacing:-1px;width:100%">';
  h+='<input id="pv-cat" value="'+(p.category||"VARIE")+'" style="background:none;border:none;outline:none;font-family:DM Mono,monospace;font-size:10px;color:rgba(255,255,255,.6);letter-spacing:1.5px;text-transform:uppercase;margin-top:6px;width:100%">';
  h+='</div><div style="padding:16px 24px 0">';
  (p.ingredients||[]).forEach(function(ing,i){
    h+='<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid '+C.ash+'"><input value="'+ing.n+'" oninput="loadPrev.ingredients['+i+'].n=this.value" style="flex:1;background:none;border:none;outline:none;font-family:Lato,sans-serif;font-size:14px;color:'+C.ink+'"><input value="'+ing.q+'" oninput="loadPrev.ingredients['+i+'].q=this.value" style="width:52px;background:'+C.ash+';border:none;outline:none;border-radius:3px;padding:5px 6px;text-align:right;font-family:DM Mono,monospace;font-size:13px"><span style="font-family:DM Mono,monospace;font-size:12px;color:'+C.smoke+';padding:0 4px">'+ing.u+'</span></div>';
  });
  h+='</div>';
  h+='<div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:'+C.paper+';padding:16px 24px 24px;border-top:1px solid '+C.ash+';z-index:100"><div style="display:flex;gap:10px"><button onclick="renderLoad(\'home\')" style="flex:1;background:none;border:1px solid '+C.ash+';border-radius:3px;padding:13px;cursor:pointer;font-family:DM Mono,monospace;font-size:10px;color:'+C.smoke+';letter-spacing:2px;text-transform:uppercase">SCARTA</button><button onclick="saveLoaded()" style="flex:2;background:'+C.ember+';border:none;border-radius:3px;padding:13px;cursor:pointer;font-family:DM Mono,monospace;font-size:11px;color:#fff;letter-spacing:2px;text-transform:uppercase">&#10003; SALVA IN ARCHIVIO</button></div></div>';
  el('s-load').innerHTML=h;
}

function saveLoaded(){
  var p=loadPrev;if(!p)return;
  var name=el("pv-name")&&el("pv-name").value||p.name;
  var cat=el("pv-cat")&&el("pv-cat").value||p.category||"VARIE";
  var code=nextCode();
  var nr={id:Date.now(),code:code,name:name,cat:cat,base:p.is_base||false,av:"v1",versions:[{id:"v1",label:"Prima versione",st:"TEST",date:new Date().toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"}),por:p.portions||4,gpor:p.portion_weight_g||null,notes:p.notes||"",ings:(p.ingredients||[]).map(function(i){return{n:i.n,q:String(i.q),u:i.u};}),steps:p.steps||[]}]};
  RECIPES.push(nr);ss("khub_r",RECIPES);
  loadPrev=null;
  renderLoad("saved");
  toast('"'+name+'" salvata');
}
window.saveLoaded=saveLoaded;

function renderLoadSaved(){
  var h='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;padding:40px 24px"><div style="font-family:DM Mono,monospace;font-size:48px;color:'+C.pine+';margin-bottom:16px">&#10003;</div><div style="font-family:Playfair Display,serif;font-size:24px;font-weight:900;color:'+C.ink+';margin-bottom:8px;text-align:center">Ricetta salvata!</div><div style="font-size:14px;color:'+C.smoke+';text-align:center;margin-bottom:32px">Trovi nell\'archivio con stato TEST.</div><button onclick="renderLoad(\'home\')" style="background:'+C.ember+';border:none;border-radius:3px;padding:14px 32px;font-family:DM Mono,monospace;font-size:11px;color:#fff;letter-spacing:2px;text-transform:uppercase;cursor:pointer">CARICA ALTRA RICETTA</button></div>';
  el('s-load').innerHTML=h;
}

// MIGRATE old data
(function(){
  try{
    var old=localStorage.getItem("khub_r");
    if(old){
      var d=JSON.parse(old);
      if(d&&d[0]&&d[0].versions&&d[0].versions[0]&&d[0].versions[0].portions!==undefined){
        // Old format detected - migrate
        var migrated=d.map(function(r){
          return Object.assign({},r,{
            cat:r.cat||r.category||"VARIE",
            av:r.av||r.active_version,
            base:r.base||r.is_base||false,
            versions:(r.versions||[]).map(function(v){
              return Object.assign({},v,{
                st:v.st||v.status,
                por:v.por||v.portions||4,
                gpor:v.gpor||v.portion_weight_g||100,
                ings:(v.ings||v.ingredients||[]).map(function(i){return{n:i.n||i.name,q:i.q||String(i.quantity||""),u:i.u||i.unit||"g"};})
              });
            })
          });
        });
        localStorage.setItem("khub_r",JSON.stringify(migrated));
        RECIPES=migrated;
      }
    }
  }catch(e){console.log("Migration error:",e);}
})();

// INIT
go("home");
</script>
