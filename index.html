<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khub — dalla creatività a sistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#F7F3EE;font-family:'Lato',sans-serif;color:#1A1612;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#E8E2D9}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.fu{animation:fadeUp .3s ease both}
.pi{animation:popIn .22s ease both}
button{cursor:pointer;font-family:'Lato',sans-serif}
button:active{transform:scale(.97)}
input,textarea{font-family:'Lato',sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:#F7F3EE;position:relative}
.screen{padding-bottom:90px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#1A1612;display:flex;z-index:200}
.nav button{flex:1;border:none;background:none;padding:12px 0 14px;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2px solid transparent;transition:border-color .2s}
.nav button.active{border-top-color:#C8440A}
.nav .glyph{font-family:'DM Mono',monospace;font-size:17px;line-height:1;color:#9A9188}
.nav button.active .glyph{color:#C8440A}
.nav .label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#9A9188}
.nav button.active .label{color:#fff}
</style>
</head>
<body>
<div id="app">
  <div id="screen-home" class="screen"></div>
  <div id="screen-recipes" class="screen" style="display:none"></div>
  <div id="screen-recipe" class="screen" style="display:none"></div>
  <div id="screen-lab" class="screen" style="display:none"></div>
  <div id="screen-load" class="screen" style="display:none"></div>
  <nav class="nav" id="main-nav">
    <button onclick="go('home')" id="nav-home" class="active"><span class="glyph">◈</span><span class="label">Home</span></button>
    <button onclick="go('recipes')" id="nav-recipes"><span class="glyph">≡</span><span class="label">Ricette</span></button>
    <button onclick="go('lab')" id="nav-lab"><span class="glyph">◎</span><span class="label">Lab</span></button>
    <button onclick="go('load')" id="nav-load"><span class="glyph">↑</span><span class="label">Load</span></button>
  </nav>
  <div id="toast" style="display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#2D4A3E;color:#fff;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;padding:10px 20px;border-radius:4px;z-index:999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.2)"></div>
</div>

<script>
// ── TOKENS ──────────────────────────────────────────
const C={ink:"#1A1612",paper:"#F7F3EE",ash:"#E8E2D9",smoke:"#9A9188",ember:"#C8440A",pine:"#2D4A3E",pine2:"#3D6B5A",brass:"#A87C3A",white:"#FFFFFF"};

// ── PERSISTENCE ──────────────────────────────────────
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

// ── DATA ─────────────────────────────────────────────
const RECIPES_DEFAULT=[
  {id:1,code:"R-001",name:"Zuppa Inglese",category:"PASTICCERIA",active_version:"v3",versions:[
    {id:"v3",label:"Al cucchiaio",status:"PROD",date:"10 Apr 2026",portions:10,portion_weight_g:120,notes:"Versione definitiva. Crema con amido di mais. Inzuppatura rapida 2 sec.",
     ingredients:[{n:"Crema pasticcera",q:"500",u:"g"},{n:"Savoiardi",q:"200",u:"g"},{n:"Alchermes",q:"80",u:"ml"},{n:"Rum scuro",q:"30",u:"ml"},{n:"Latte intero",q:"100",u:"ml"},{n:"Panna semimontata",q:"200",u:"g"}],
     steps:[{t:"Crema base",d:"Preparare crema pasticcera (R-004). Raffreddare in abbattitore a +4°C."},{t:"Bagna",d:"Miscelare alchermes, rum e latte freddo. Usare a temperatura ambiente."},{t:"Montaggio",d:"Inzuppare savoiardi 2 secondi per lato. Disporre negli stampi individuali."},{t:"Strati",d:"Alternare biscotti/crema/biscotti/crema. Altezza totale 6-7cm."},{t:"Finitura",d:"Panna semimontata + cacao amaro. Servire a +4°C."}]},
    {id:"v2",label:"Con amido 20g",status:"ARC",date:"05 Apr 2026",portions:6,portion_weight_g:120,notes:"Amido 20g troppo rigido. Ridotto a 18g in v3.",
     ingredients:[{n:"Crema pasticcera",q:"500",u:"g"},{n:"Savoiardi",q:"200",u:"g"},{n:"Alchermes",q:"80",u:"ml"}],
     steps:[{t:"Note",d:"Stesso procedimento v3. Amido 20g troppo rigido."}]}
  ]},
  {id:2,code:"R-002",name:"Risotto al Parmigiano",category:"CUCINA CALDA",active_version:"v2",versions:[
    {id:"v2",label:"Mantecato a freddo",status:"PROD",date:"08 Apr 2026",portions:4,portion_weight_g:220,notes:"Burro freddo fuori fuoco. Texture più vellutata e stabile.",
     ingredients:[{n:"Riso Carnaroli",q:"320",u:"g"},{n:"Brodo vegetale",q:"1200",u:"ml"},{n:"Parmigiano 36m",q:"120",u:"g"},{n:"Burro freddo",q:"80",u:"g"},{n:"Scalogno",q:"1",u:"pz"},{n:"Vino bianco",q:"100",u:"ml"}],
     steps:[{t:"Tostatura",d:"Riso a secco 3 min fino a scricchiolio."},{t:"Base",d:"Scalogno tritato. Sfumare con vino freddo."},{t:"Cottura",d:"Brodo caldo mestolo per volta. 17-18 min."},{t:"Riposo",d:"Fuori fuoco 2 minuti."},{t:"Mantecatura",d:"Burro freddo + parmigiano. Servire all'onda."}]},
    {id:"v1",label:"Classico",status:"ARC",date:"02 Apr 2026",portions:4,portion_weight_g:220,notes:"Versione classica con burro a temperatura.",
     ingredients:[{n:"Riso Carnaroli",q:"320",u:"g"},{n:"Brodo",q:"1200",u:"ml"},{n:"Parmigiano",q:"100",u:"g"}],
     steps:[{t:"Note",d:"Versione classica. Sostituita da v2."}]}
  ]},
  {id:10,code:"R-004",name:"Crema Pasticcera",category:"BASE · PASTICCERIA",is_base:true,active_version:"v1",versions:[
    {id:"v1",label:"Con amido di mais",status:"PROD",date:"09 Apr 2026",portions:10,portion_weight_g:50,notes:"Amido di mais per texture vellutata e resistenza al taglio.",
     ingredients:[{n:"Latte intero",q:"500",u:"ml"},{n:"Tuorli",q:"120",u:"g"},{n:"Zucchero",q:"125",u:"g"},{n:"Amido di mais",q:"45",u:"g"},{n:"Vaniglia",q:"1",u:"pz"},{n:"Limone",q:"1",u:"pz"}],
     steps:[{t:"Infusione",d:"Latte con vaniglia e limone quasi a bollore. Infusione 10 min."},{t:"Pastella",d:"Tuorli + zucchero a nastro. Aggiungere amido setacciato."},{t:"Cottura",d:"Latte caldo a filo sui tuorli. Cuocere a 82-84°C mescolando."},{t:"Raffreddamento",d:"Coprire a contatto. Abbattere a +4°C entro 30 min."}]}
  ]},
  {id:3,code:"R-003",name:"Focaccia Genovese",category:"PANIFICAZIONE",active_version:"v1",versions:[
    {id:"v1",label:"Idratazione 80%",status:"TEST",date:"11 Apr 2026",portions:12,portion_weight_g:80,notes:"In test. Valutare aumento olio superficie e salamoia.",
     ingredients:[{n:"Farina W260",q:"500",u:"g"},{n:"Acqua",q:"400",u:"ml"},{n:"Olio EVO",q:"60",u:"ml"},{n:"Sale",q:"10",u:"g"},{n:"Lievito fresco",q:"5",u:"g"}],
     steps:[{t:"Impasto",d:"Lievito in acqua 18°C. Impastare 10 min. Aggiungere sale e olio."},{t:"Puntatura",d:"1h temperatura ambiente, poi 2h frigo."},{t:"Lievitazione",d:"Stendere in teglia unta. 1h a 24°C."},{t:"Cottura",d:"Fossette, emulsione acqua-olio-sale. 220°C per 20-22 min."}]}
  ]},
];
const LAB_DEFAULT=[
  {id:1,name:"Catalana al cardamomo",ref:"R-001",note:"Cardamomo + lime al posto della vaniglia.",priority:"HIGH",created:"oggi"},
  {id:2,name:"Gnocchi viola",ref:null,note:"Patate viola per colore naturale.",priority:"MED",created:"domani"},
  {id:3,name:"Tiramisù matcha",ref:null,note:"Matcha + mascarpone + biscuit al tè.",priority:"LOW",created:"—"},
];

let RECIPES=load("khub_r",RECIPES_DEFAULT);
let LAB=load("khub_l",LAB_DEFAULT);
let currentScreen="home";
let currentRecipe=null;
let currentVersionId=null;
let editingDraft=null;

// ── HELPERS ──────────────────────────────────────────
const ST={PROD:{bg:C.pine,c:"#fff"},TEST:{bg:C.ember,c:"#fff"},ARC:{bg:C.smoke,c:"#fff"},HIGH:{bg:C.ember,c:"#fff"},MED:{bg:C.brass,c:"#fff"},LOW:{bg:C.smoke,c:"#fff"}};

function scaleQ(q,f){const r=parseFloat(q);if(isNaN(r))return q;const s=r*f;return s<10?s.toFixed(1).replace(/\.0$/,""):Math.round(s).toString();}
function nextCode(){const ns=RECIPES.map(r=>parseInt(r.code.replace("R-",""))).filter(Boolean);return"R-"+String(Math.max(0,...ns)+1).padStart(3,"0");}
function nextVId(versions){const ns=versions.map(v=>parseInt(v.id.replace("v",""))).filter(Boolean);return"v"+(Math.max(...ns)+1);}
function badge(s,sm){const m=ST[s]||ST.ARC;return `<span style="display:inline-block;background:${m.bg};color:${m.c};font-family:'DM Mono',monospace;font-size:${sm?9:10}px;letter-spacing:1.2px;padding:${sm?"2px 7px":"3px 9px"};border-radius:2px">${s}</span>`;}
function showToast(msg,color){const t=document.getElementById("toast");t.textContent="✓ "+msg;t.style.display="block";t.style.background=color||C.pine;setTimeout(()=>t.style.display="none",2500);}
function saveRecipes(){save("khub_r",RECIPES);}
function saveLab(){save("khub_l",LAB);}
function el(id){return document.getElementById(id);}

// ── NAVIGATION ────────────────────────────────────────
function go(screen,recipe){
  ["home","recipes","recipe","lab","load"].forEach(s=>{
    const sc=el("screen-"+s);
    if(sc)sc.style.display=s===screen?"block":"none";
  });
  document.querySelectorAll(".nav button").forEach(b=>{b.classList.remove("active");});
  const navBtn=el("nav-"+screen);
  if(navBtn)navBtn.classList.add("active");
  el("main-nav").style.display=screen==="recipe"?"none":"flex";
  currentScreen=screen;
  window.scrollTo(0,0);
  if(screen==="home")renderHome();
  else if(screen==="recipes")renderRecipes();
  else if(screen==="recipe"&&recipe){currentRecipe=recipe;currentVersionId=recipe.active_version;editingDraft=null;renderRecipe();}
  else if(screen==="lab")renderLab();
  else if(screen==="load")renderLoad();
}

// ── HOME ──────────────────────────────────────────────
function renderHome(){
  const today=new Date();
  const main=RECIPES.filter(r=>!r.is_base);
  const prod=main.filter(r=>r.versions.find(v=>v.id===r.active_version)?.status==="PROD");
  const test=main.filter(r=>r.versions.find(v=>v.id===r.active_version)?.status==="TEST");
  const bases=RECIPES.filter(r=>r.is_base);
  const dayName=today.toLocaleDateString("it-IT",{weekday:"long"});
  const dateStr=today.toLocaleDateString("it-IT",{day:"numeric",month:"long"});

  const recipeRow=(r)=>{
    const v=r.versions.find(v=>v.id===r.active_version);
    return `<div onclick="go('recipe',RECIPES.find(x=>x.id==${r.id}))" style="display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid ${C.ash};cursor:pointer">
      <div style="display:flex;align-items:baseline;gap:10px">
        <span style="font-family:'DM Mono',monospace;font-size:10px;color:${C.smoke};letter-spacing:1px">${r.code}</span>
        <span style="font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:${C.ink}">${r.name}</span>
      </div>
      <span style="font-family:'DM Mono',monospace;font-size:14px;color:${C.smoke}">›</span>
    </div>`;
  };

  const section=(label,color,list)=>list.length?`<div style="padding:20px 24px 0">
    <div style="font-family:'DM Mono',monospace;font-size:9px;color:${color};letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:14px">
      <span style="width:6px;height:6px;border-radius:50%;background:${color};display:inline-block"></span>${label}
    </div>
    ${list.map(r=>recipeRow(r)).join("")}
  </div>`:"";

  el("screen-home").innerHTML=`
  <div style="padding:32px 24px 24px;border-bottom:1px solid ${C.ash}">
    <div style="font-family:'DM Mono',monospace;font-size:10px;color:${C.smoke};letter-spacing:2px;text-transform:uppercase;margin-bottom:6px">${dayName} — ${dateStr}</div>
    <div style="font-family:'Playfair Display',serif;font-size:38px;font-weight:900;color:${C.ink};letter-spacing:-1px;line-height:1">Khub</div>
    <div style="font-family:'Lato',sans-serif;font-size:14px;color:${C.smoke};margin-top:4px;font-weight:300">dalla creatività a sistema</div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid ${C.ash}">
    ${[{n:main.length,l:"ricette"},{n:prod.length,l:"in prod."},{n:bases.length,l:"basi"}].map((s,i)=>`
    <div style="padding:16px 0;text-align:center;border-right:${i<2?`1px solid ${C.ash}`:"none"}">
      <div style="font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:${C.ember};line-height:1">${s.n}</div>
      <div style="font-family:'DM Mono',monospace;font-size:9px;color:${C.smoke};letter-spacing:1.5px;text-transform:uppercase;margin-top:3px">${s.l}</div>
    </div>`).join("")}
  </div>
  ${section("IN PRODUZIONE",C.pine2,prod)}
  ${test.length?section("IN TEST",C.ember,test):""}
  ${section("RICETTE BASE",C.brass,bases)}
  <div style="margin:24px 24px 0">
    <div onclick="go('load')" style="background:${C.ink};border-radius:4px;padding:18px 20px;cursor:pointer;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-family:'DM Mono',monospace;font-size:9px;color:${C.smoke};letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">CARICA RICETTA</div>
        <div style="font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:${C.white}">Incolla testo — AI struttura tutto</div>
      </div>
      <span style="font-family:'DM Mono',monospace;font-size:22px;color:${C.ember}">✦</span>
    </div>
  </div>`;
}

// ── RECIPES LIST ──────────────────────────────────────
function renderRecipes(filter,query){
  filter=filter||"TUTTE";query=query||"";
  const vis=RECIPES.filter(r=>{
    const v=r.versions.find(v=>v.id===r.active_version);
    const mf=filter==="TUTTE"?true:filter==="BASE"?!!r.is_base:v?.status===filter;
    const mq=r.name.toLowerCase().includes(query.toLowerCase())||r.code.toLowerCase().includes(query.toLowerCase());
    return mf&&mq;
  });
  el("screen-recipes").innerHTML=`
  <div style="padding:32px 24px 20px;border-bottom:1px solid ${C.ash};display:flex;align-items:flex-start;justify-content:space-between">
    <div>
      <div style="font-family:'DM Mono',monospace;font-size:9px;color:${C.smoke};letter-spacing:2px;text-transform:uppercase;margin-bottom:6px">ARCHIVIO</div>
      <div style="font-family:'Playfair Display',serif;font-size:30px;font-weight:900;color:${C.ink};letter-spacing:-1px">Ricette</div>
    </div>
    <button onclick="if(confirm('Ripristinare archivio originale?')){localStorage.removeItem('khub_r');location.reload();}" style="background:none;border:1px solid ${C.ash};border-radius:3px;padding:6px 10px;font-family:'DM Mono',monospace;font-size:8px;color:${C.smoke};letter-spacing:1.5px;text-transform:uppercase;margin-top:8px">↺ reset</button>
  </div>
  <div style="padding:12px 24px;border-bottom:1px solid ${C.ash}">
    <div style="display:flex;align-items:center;gap:10px;background:${C.ash};border-radius:3px;padding:10px 14px">
      <span style="font-family:'DM Mono',monospace;color:${C.smoke};font-size:14px">⌕</span>
      <input id="recipe-search" value="${query}" oninput="renderRecipes(currentFilter,this.value)" placeholder="Cerca nome, codice..." style="flex:1;background:none;border:none;outline:none;font-size:14px;color:${C.ink}">
    </div>
  </div>
  <div style="display:flex;border-bottom:1px solid ${C.ash};padding:0 24px" id="filter-tabs">
    ${["TUTTE","PROD","TEST","BASE"].map(f=>`<button onclick="currentFilter='${f}';renderRecipes('${f}',document.getElementById('recipe-search')?.value||'')" style="background:none;border:none;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:${filter===f?C.ember:C.smoke};padding:12px 12px 10px;border-bottom:2px solid ${filter===f?C.ember:"transparent"}">${f}</button>`).join("")}
  </div>
  <div>
    ${vis.map(r=>{
      const v=r.versions.find(v=>v.id===r.active_version);
      return `<div onclick="go('recipe',RECIPES.find(x=>x.id==${r.id}))" style="padding:15px 24px;border-bottom:1px solid ${C.ash};cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span style="font-family:'DM Mono',monospace;font-size:10px;color:${C.smoke};letter-spacing:1px">${r.code}</span>
            ${r.is_base?`<span style="font-family:'DM Mono',monospace;font-size:9px;color:${C.brass};border:1px solid ${C.brass};padding:1px 6px;border-radius:2px;letter-spacing:1px">BASE</span>`:badge(v?.status,true)}
          </div>
          <div style="font-family:'Playfair Display',serif;font-size:19px;font-weight:700;color:${C.ink};line-height:1.1">${r.name}</div>
          <div style="font-family:'DM Mono',monospace;font-size:10px;color:${C.smoke};letter-spacing:1px;margin-top:4px;text-transform:uppercase">${r.category} · ${v?.portions}p${v?.portion_weight_g?` · ${v.portion_weight_g}g/p`:""}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
          ${r.versions.map(vv=>`<div style="display:flex;align-items:center;gap:5px">
            <span style="font-family:'DM Mono',monospace;font-size:9px;color:${vv.id===r.active_version?C.ink:C.smoke}">${vv.id}</span>
            <span style="width:6px;height:6px;border-radius:50%;background:${vv.id===r.active_version?(ST[vv.status]?.bg||C.smoke):C.ash}"></span>
          </div>`).join("")}
          <button onclick="event.stopPropagation();if(confirm('Eliminare?')){RECIPES=RECIPES.filter(x=>x.id!==${r.id});saveRecipes();renderRecipes('${filter}','${query}');}" style="background:none;border:none;font-family:'DM Mono',monospace;font-size:9px;color:${C.smoke};text-decoration:underline;margin-top:4px">elimina</button>
        </div>
      </div>`;
    }).join("")}
  </div>`;
  window.currentFilter=filter;
}
window.currentFilter="TUTTE";

// ── RECIPE DETAIL ─────────────────────────────────────
function renderRecipe(){
  const recipe=currentRecipe;
  const vid=currentVersionId;
  const v=recipe.versions.find(vv=>vv.id===vid)||recipe.versions[0];
  const D=editingDraft||v;
  const editing=!!editingDraft;
  let scaledPortions=v.portions,scaledWeight=v.portion_weight_g||100;
  const factor=(scaledPortions*scaledWeight)/((v.portions)*(v.portion_weight_g||100));

  el("screen-recipe").innerHTML=`
  ${editing?`<div style="position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:${C.brass};padding:8px 24px;z-index:150;display:flex;justify-content:space-between;align-items:center">
    <span style="font-family:'DM Mono',monospace;font-size:10px;color:#fff;letter-spacing:1px">✎ MODALITÀ MODIFICA</span>
    <button onclick="editingDraft=null;renderRecipe()" style="background:none;border:none;font-family:'DM Mono',monospace;font-size:10px;color:#fff;letter-spacing:1px">× ANNULLA</button>
  </div>`:""}

  <!-- Header -->
  <div style="background:${editing?C.brass:C.ink};padding:${editing?"52px":"20px"} 24px 20px;transition:background .3s">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <button onclick="go('recipes')" style="background:none;border:none;font-family:'DM Mono',monospace;font-size:11px;color:${C.smoke};letter-spacing:1px">← RICETTE</button>
      ${!editing?`<button onclick="editingDraft=JSON.parse(JSON.stringify(RECIPES.find(r=>r.id===${recipe.id}).versions.find(v=>v.id==='${vid}')));renderRecipe()" style="background:rgba(255,255,255,.12);border:none;border-radius:3px;padding:6px 12px;font-family:'DM Mono',monospace;font-size:9px;color:#fff;letter-spacing:1.5px;text-transform:uppercase">✎ MODIFICA</button>`
      :`<button onclick="saveEdit()" style="background:${C.pine};border:none;border-radius:3px;padding:6px 14px;font-family:'DM Mono',monospace;font-size:9px;color:#fff;letter-spacing:1.5px;text-transform:uppercase">✓ SALVA</button>`}
    </div>
    <div style="font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.5);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">${recipe.code} · ${recipe.category}${recipe.is_base?` <span style="color:${C.brass};border:1px solid ${C.brass};padding:1px 6px;border-radius:2px;margin-left:8px">BASE</span>`:""}</div>
    <div style="font-family:'Playfair Display',serif;font-size:30px;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1.05">${recipe.name}</div>
    ${editing

window.showTab=function(tab){
  ["ingredienti","procedimento","note","AI"].forEach(t=>{
    const content=el("tab-content-"+t),btn=el("tab-"+t);
    if(content)content.style.display=t===tab?"block":"none";
    if(btn){btn.style.color=t===tab?C.ember:C.smoke;btn.style.borderBottom=t===tab?`2px solid ${C.ember}`:"2px solid transparent";}
  });
};

window.changePortions=function(d){const i=el("sc-portions");if(i){i.value=Math.max(1,parseInt(i.value)||1+d);updateScaler();}};
window.changeWeight=function(d){const i=el("sc-weight");if(i){i.value=Math.max(1,(parseInt(i.value)||1)+d);updateScaler();}};
window.updateScaler=function(){
  const v=currentRecipe?.versions.find(vv=>vv.id===currentVersionId)||currentRecipe?.versions[0];
  if(!v)return;
  const p=parseInt(el("sc-portions")?.value)||v.portions;
  const w=parseInt(el("sc-weight")?.value)||v.portion_weight_g||100;
  const f=(p*w)/((v.portions)*(v.portion_weight_g||100));
  const changed=p!==v.portions||w!==(v.portion_weight_g||100);
  const tv=el("scaler-total-val");
  const rs=el("scaler-reset");
  if(tv){tv.textContent=((p*w)/1000).toFixed(2)+" kg";tv.style.color=changed?C.ember:C.ink;}
  if(rs)rs.style.display=changed?"block":"none";
  // Update ingredient quantities
  const ingList=el("ingredients-list");
  if(ingList&&v.ingredients){
    const spans=ingList.querySelectorAll("[id^='qty-']");
    spans.forEach((span,i)=>{
      const ing=v.ingredients[i];
      if(ing){span.textContent=scaleQ(ing.q,f)+(ing.u?" "+ing.u:"");span.style.color=changed&&!isNaN(parseFloat(ing.q))?C.ember:C.ink;}
    });
  }
};
window.resetScaler=function(){
  const v=currentRecipe?.versions.find(vv=>vv.id===currentVersionId)||currentRecipe?.versions[0];
  if(!v)return;
  const pi=el("sc-portions"),wi=el("sc-weight");
  if(pi)pi.value=v.portions;
  if(wi)wi.value=v.portion_weight_g||100;
  updateScaler();
};
window.setVersionStatus=function(s){resetAiChat();
  const idx=RECIPES.findIndex(r=>r.id===currentRecipe.id);
  if(idx<0)return;
  RECIPES[idx].versions=RECIPES[idx].versions.map(vv=>vv.id===currentVersionId?{...vv,status:s}:s==="PROD"&&vv.status==="PROD"?{...vv,status:"ARC"}:vv);
  if(s==="PROD")RECIPES[idx].active_version=currentVersionId;
  saveRecipes();
  currentRecipe=RECIPES[idx];
  renderRecipe();
  showToast("→ "+s);
};
window.saveEdit=function(){
  const recipe=currentRecipe;
  const vid=currentVersionId;
  const draft=editingDraft;
  if(!draft)return;
  if(el("edit-label"))draft.label=el("edit-label").value;
  if(el("edit-notes"))draft.notes=el("edit-notes").value;
  const idx=RECIPES.findIndex(r=>r.id===recipe.id);
  if(idx<0)return;
  RECIPES[idx].versions=RECIPES[idx].versions.map(vv=>vv.id===vid?{...draft}:vv);
  saveRecipes();
  currentRecipe=RECIPES[idx];
  editingDraft=null;
  renderRecipe();
  showToast("Versione salvata");
};
window.showNewVersionModal=function(){
  const modal=document.createElement("div");
  modal.id="new-version-modal";
  modal.style.cssText=`position:fixed;inset:0;z-index:500;display:flex;align-items:flex-end;background:rgba(26,22,18,.6)`;
  modal.innerHTML=`<div style="position:relative;z-index:1;width:100%;max-width:430px;margin:0 auto;background:${C.paper};border-radius:16px 16px 0 0;padding:24px 24px 40px;animation:popIn .22s ease both">
    <div style="width:36px;height:4px;background:${C.ash};border-radius:2px;margin:0 auto 20px"></div>
    <div style="font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:${C.ink};margin-bottom:6px">Nuova versione</div>
    <div style="font-family:'Lato',sans-serif;font-size:13px;color:${C.smoke};margin-bottom:16px">Copia di <strong>${currentVersionId}</strong> con stato TEST.</div>
    <input id="new-version-label" placeholder="es. senza glutine, meno zucchero..." autofocus style="width:100%;background:${C.ash};border:none;outline:none;border-radius:4px;padding:13px 14px;font-size:15px;color:${C.ink};font-family:'Lato',sans-serif;margin-bottom:16px">
    <div style="display:flex;gap:10px">
      <button onclick="document.getElementById('new-version-modal').remove()" style="flex:1;background:none;border:1px solid ${C.ash};border-radius:3px;padding:12px;font-family:'DM Mono',monospace;font-size:10px;color:${C.smoke};letter-spacing:2px;text-transform:uppercase">ANNULLA</button>
      <button onclick="createNewVersion()" style="flex:2;background:${C.ember};border:none;border-radius:3px;padding:12px;font-family:'DM Mono',monospace;font-size:10px;color:#fff;letter-spacing:2px;text-transform:uppercase">CREA →</button>
    </div>
  </div>`;
  modal.onclick=e=>{if(e.target===modal)modal.remove();};
  document.body.appendChild(modal);
  setTimeout(()=>el("new-version-label")?.focus(),100);
};
window.createNewVersion=function(){
  const label=el("new-version-label")?.value?.trim();
  if(!label)return;
  const recipe=currentRecipe;
  const v=recipe.versions.find(vv=>vv.id===currentVersionId)||recipe.versions[0];
  const nv={...JSON.parse(JSON.stringify(v)),id:nextVId(recipe.versions),label,status:"TEST",date:new Date().toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"})};
  const idx=RECIPES.findIndex(r=>r.id===recipe.id);
  RECIPES[idx].versions=[...RECIPES[idx].versions,nv];
  saveRecipes();
  currentRecipe=RECIPES[idx];
  currentVersionId=nv.id;
  el("new-version-modal")?.remove();
  editingDraft=JSON.parse(JSON.stringify(nv));
  renderRecipe();
  showToast(nv.id+" creata");
};

let currentImageB64=null,currentImageType=null;
window.handleImageFile=function(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    currentImageB64=e.target.result.split(",")[1];
    currentImageType=file.type;
    const dz=el("drop-zone");
    if(dz){
      dz.innerHTML=`<img src="${e.target.result}" style="max-width:100%;max-height:200px;border-radius:4px;object-fit:contain">
      <div style="font-family:'DM Mono',monospace;font-size:10px;color:${C.pine2};margin-top:10px;letter-spacing:1px">✓ ${file.name}</div>`;
    }
    const btn=el("analyze-img-btn");
    if(btn){btn.disabled=false;btn.style.background=C.ember;btn.style.color="#fff";btn.textContent="✦ ANALIZZA CON AI →";}
  };
  reader.readAsDataURL(file);
};
window.handleImageDrop=function(e){
  e.preventDefault();
  const file=e.dataTransfer.files[0];
  if(file&&file.type.startsWith("image/"))handleImageFile(file);
};
window.analyzeImage=async function(){
  if(!currentImageB64)return;
  renderLoadImage(true,"");
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,system:SYS,
        messages:[{role:"user",content:[
          {type:"image",source:{type:"base64",media_type:currentImageType,data:currentImageB64}},
          {type:"text",text:"Analizza questa immagine di ricetta e restituisci il JSON strutturato."}
        ]}]})});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    const raw=data.content?.map(b=>b.text||"").join("").trim().replace(/```json|```/g,"").trim();
    const parsed=JSON.parse(raw);
    if(!parsed.name)throw new Error("JSON incompleto");
    loadPreview=parsed;loadMode="preview";renderLoad();
  }catch(e){renderLoadImage(false,"Errore: "+e.message);}
};

window.fetchUrl=async function(){
  const url=el("load-url")?.value?.trim();
  if(!url)return;
  renderLoadUrl(true,"");
  try{
    // Usa un proxy CORS-free per leggere la pagina, poi passa il testo a Claude
    const proxyUrl="https://api.allorigins.win/get?url="+encodeURIComponent(url);
    const pageRes=await fetch(proxyUrl);
    if(!pageRes.ok)throw new Error("Impossibile raggiungere la pagina");
    const pageData=await pageRes.json();
    const html=pageData.contents||"";
    // Strip HTML tags per ottenere testo pulito
    const text=html.replace(/<script[^>]*>[\s\S]*?<\/script>/gi,"")
                   .replace(/<style[^>]*>[\s\S]*?<\/style>/gi,"")
                   .replace(/<[^>]+>/g," ")
                   .replace(/\s+/g," ")
                   .substring(0,8000);
    if(!text||text.length<100)throw new Error("Pagina non leggibile o vuota");
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,system:SYS,
        messages:[{role:"user",content:"Estrai la ricetta da questo testo e restituisci il JSON:\n\n"+text}]})});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    const raw=data.content?.map(b=>b.text||"").join("").trim().replace(/```json|```/g,"").trim();
    const parsed=JSON.parse(raw);
    if(!parsed.name)throw new Error("Ricetta non trovata nella pagina");
    loadPreview=parsed;loadMode="preview";renderLoad();
  }catch(e){renderLoadUrl(false,"Errore: "+e.message+". Prova a copiare il testo manualmente.");}
};

  showToast(`"${name}" salvata`);
};
function renderLoadSaved(){
  el("screen-load").innerHTML=`
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;padding:40px 24px">
    <div style="font-family:'DM Mono',monospace;font-size:48px;color:${C.pine};margin-bottom:16px">✓</div>
    <div style="font-family:'Playfair Display',serif;font-size:24px;font-weight:900;color:${C.ink};margin-bottom:8px;text-align:center">Ricetta salvata!</div>
    <div style="font-family:'Lato',sans-serif;font-size:14px;color:${C.smoke};text-align:center;margin-bottom:32px">Nell'archivio con stato TEST.</div>
    <button onclick="loadMode='home';renderLoad()" style="background:${C.ember};border:none;border-radius:3px;padding:14px 32px;font-family:'DM Mono',monospace;font-size:11px;color:#fff;letter-spacing:2px;text-transform:uppercase">CARICA ALTRA RICETTA</button>
  </div>`;
}


// ── AI CONSULENTE ─────────────────────────────────────
const AI_CONSULT_SYS=`Sei un consulente tecnico di cucina professionale con profonda conoscenza di chimica alimentare, tecniche di cottura e pasticceria. Analizza la ricetta fornita nel contesto e rispondi in modo preciso e tecnico. Quando suggerisci modifiche, indica SEMPRE: 1) cosa cambiare esattamente (ingrediente, quantità, tecnica), 2) di quanto cambiarlo, 3) perché funziona chimicamente/tecnicamente. Sii conciso ma completo. Rispondi in italiano.`;
let aiMessages=[];

window.sendAiMessage=async function(){
  const input=el("ai-input");const text=input?.value?.trim();
  if(!text)return;
  input.value="";
  const recipe=currentRecipe;
  const v=recipe?.versions.find(vv=>vv.id===currentVersionId)||recipe?.versions[0];
  if(!v)return;

  // Aggiungi messaggio utente
  aiMessages.push({role:"user",content:text});
  renderAiMessages(false);

  // Costruisci contesto ricetta
  const recipeCtx=`RICETTA: ${recipe.name} (${recipe.code}) - ${recipe.category}
Versione: ${v.id} - ${v.label} - Stato: ${v.status}
Porzioni: ${v.portions} x ${v.portion_weight_g||"—"}g

INGREDIENTI:
${v.ingredients.map(i=>`- ${i.n}: ${i.q} ${i.u}`).join("\n")}

PROCEDIMENTO:
${v.steps.map((s,i)=>`${i+1}. ${s.t}: ${s.d}`).join("\n")}

NOTE: ${v.notes||"nessuna"}

${recipe.versions.length>1?`VERSIONI PRECEDENTI: ${recipe.versions.filter(vv=>vv.id!==v.id).map(vv=>`${vv.id}(${vv.status}): ${vv.notes||vv.label}`).join(" | ")}`:""}`;

  const btn=el("ai-send-btn");if(btn)btn.disabled=true;

  try{
    const messages=[
      {role:"user",content:"Contesto ricetta:
"+recipeCtx},
      {role:"assistant",content:"Ho analizzato la ricetta. Sono pronto a rispondere alle tue domande tecniche."},
      ...aiMessages
    ];
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,system:AI_CONSULT_SYS,messages})});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    const reply=data.content?.map(b=>b.text||"").join("").trim();
    aiMessages.push({role:"assistant",content:reply});
    renderAiMessages(false);
  }catch(e){
    aiMessages.push({role:"assistant",content:"Errore: "+e.message});
    renderAiMessages(false);
  }finally{
    if(btn)btn.disabled=false;
  }
};

function renderAiMessages(loading){
  const container=el("ai-messages");if(!container)return;
  container.innerHTML=aiMessages.map(m=>{
    const isUser=m.role==="user";
    return `<div style="display:flex;justify-content:${isUser?"flex-end":"flex-start"}">
      <div style="max-width:85%;padding:10px 14px;border-radius:${isUser?"12px 12px 2px 12px":"12px 12px 12px 2px"};background:${isUser?C.ember:C.white};border:${isUser?"none":`1px solid ${C.ash}`}">
        ${!isUser?`<div style="font-family:'DM Mono',monospace;font-size:8px;color:${C.ember};letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px">✦ AI CONSULENTE</div>`:""}
        <div style="font-family:'Lato',sans-serif;font-size:13px;color:${isUser?"#fff":C.ink};line-height:1.6;white-space:pre-wrap">${m.content}</div>
      </div>
    </div>`;
  }).join("")+(loading?`<div style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:${C.ash};border-radius:12px;width:fit-content"><span style="display:inline-block;animation:spin 1s linear infinite;font-family:'DM Mono',monospace">◌</span><span style="font-family:'DM Mono',monospace;font-size:11px;color:${C.smoke}">Consulente sta analizzando…</span></div>`:"");
  container.scrollTop=container.scrollHeight;
}

// Reset AI messages quando si cambia ricetta o versione
function resetAiChat(){aiMessages=[];}

// ── INIT ─────────────────────────────────────────────
go("home");
</script>
