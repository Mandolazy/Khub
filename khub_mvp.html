// M1 — PRIMO CONSULTO (MichelinAI 2.0)
// Sostituisce (D1) il vecchio Primo Consulto come UNICO Primo Consulto
// dell'app: MichelinAI non modifica mai autonomamente la Ricetta, produce
// solo una lettura testuale (mai persistita) e osservazioni strutturate
// come L2 unengaged (persistite, provenance_type='m1'). Lo chef decide
// sempre le modifiche. Avviene una sola volta per Ricetta/Bozza: la
// presenza di almeno un L2 con provenance_type='m1' determina "M1
// completato" — MAI variants.primo_consulto, che da qui in avanti non
// viene più scritto (i 22 record legacy restano nel DB, invariati).
// ══════════════════════════════════════════════════════════
function hasM1(v){return((v&&v.l2Items)||[]).some(x=>x.provenanceType==='m1');}

async function runM1(recipeId){
  const recipe=R(recipeId);
  const v=recipe&&curLab(recipe);
  if(!v)return; // M1 è disponibile solo su status='lab'
  if(hasM1(v))return; // M1 avviene una sola volta per Ricetta/Bozza
  if(S.m1Loading)return; // doppio clic / seconda chiamata mentre la prima è attiva
  const variantId=v.id; // catturato ORA: è la bozza a cui il risultato resterà legato
  const chiaveM1=recipeId+'|'+variantId;

  const snapshot={
    ingredients:(v.ingredients||[]).map(i=>({name:i.name,qty:i.qty,unit:i.unit})),
    steps:v.steps||[],
    portionsCount:v.portionsCount,gramsPerPortion:v.gramsPerPortion,
    note:v.note||'',
  };

  S.m1Loading=true;S.m1LoadingKey=chiaveM1;S.m1Error[variantId]=null;render();

  try{
    const payload={
      mode:'m1',
      recipe:{id:recipe.id,name:recipe.name,category:recipe.category},
      variant:{id:v.id,ingredients:snapshot.ingredients,steps:snapshot.steps,portionsCount:snapshot.portionsCount,gramsPerPortion:snapshot.gramsPerPortion,note:snapshot.note},
      intention:{initial:v.intentionInitial||null,current:v.intentionCurrent||null},
      criteria:{initial:v.criteriaInitial||null,current:v.criteriaCurrent||null},
      l3:(recipe.l3Items||[]).slice(0,20).map(x=>({distilledContent:x.distilledContent,contextConditions:x.contextConditions,knownLimits:x.knownLimits})),
    };
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await res.json().catch(()=>null);
    if(!res.ok||!data)throw new Error('Chiamata AI non riuscita');
    const text=(data.content||[]).map(c=>c.text||'').join('');
    if(!text.trim())throw new Error('Risposta AI vuota');
    const marker='===M1_OBSERVATIONS===';
    const idx=text.indexOf(marker);
    if(idx===-1)throw new Error('Blocco osservazioni mancante nella risposta');
    const userText=text.slice(0,idx).trim();
    if(!userText)throw new Error('Lettura del Primo Consulto vuota');
    let jsonPart=text.slice(idx+marker.length).trim();
    jsonPart=jsonPart.replace(/```json|```/g,'').trim();
    let parsed;
    try{parsed=JSON.parse(jsonPart);}catch(e){throw new Error('Blocco osservazioni non è JSON valido');}
    if(!parsed||!Array.isArray(parsed.observations))throw new Error('Formato osservazioni non valido');
    const validObs=parsed.observations.filter(o=>o&&typeof o.content==='string'&&o.content.trim());
    if(validObs.length===0)throw new Error('Nessuna osservazione valida prodotta');

    // Controllo avanzato (preservato): la bozza potrebbe essere cambiata
    // mentre si attendeva la risposta AI. Se è cambiata, il risultato va
    // scartato senza persistere alcun L2.
    const recipeOra=R(recipeId);
    const labOra=recipeOra&&curLab(recipeOra);
    if(!recipeOra||!labOra||labOra.id!==variantId){
      toast('La Scheda o la bozza sono cambiate nel frattempo: risultato del Primo Consulto scartato.','ti-alert-circle');
      S.m1Loading=false;S.m1LoadingKey=null;
      render();
      return;
    }

    const baseline=KhubBaseline.compute(snapshot);
    const newL2=validObs.map(o=>({
      id:'l2_'+uid(),
      operationalState:'unengaged',decisionState:'none',
      content:{label:(o.label&&String(o.label).trim())||o.content.trim().slice(0,60),text:o.content.trim()},
      evidence:null,provenanceType:'m1',sourceL2ItemId:null,
      baselineHash:baseline.baseline_hash,baselineContext:baseline.baseline_context,
    }));

    // Muta lo stato locale solo ora che parsing e validazione sono completi.
    upLab(recipeId,lab=>({...lab,l2Items:[...(lab.l2Items||[]),...newL2]}));
    const fresh=R(recipeId);
    const ok=await saveToSupabase(fresh);
    if(!ok){
      // Persistenza fallita: rollback locale — M1 NON è completato (gate 4).
      upLab(recipeId,lab=>({...lab,l2Items:(lab.l2Items||[]).filter(x=>!newL2.some(n=>n.id===x.id))}));
      throw new Error('Salvataggio delle osservazioni non riuscito');
    }
    S.m1Text[variantId]=userText;
    S.m1Loading=false;S.m1LoadingKey=null;
    toast('Primo Consulto completato','ti-sparkles');
  }catch(e){
    console.error('[M1] errore:',e);
    S.m1Loading=false;S.m1LoadingKey=null;
    S.m1Error[variantId]=e.message||'Errore nel Primo Consulto';
  }
  render();
}

// LEGACY (D1) — runPrimoConsulto() non è più collegato a nessun pulsante
// dell'interfaccia (sostituito da runM1() nel pannello "Primo Consulto") e
// non viene più invocato. Resta definito, invariato, solo come storico:
// non cancellato, non convertito. Le 22 righe già presenti in
// variants.primo_consulto restano leggibili (v.primoConsulto) ma non sono
// più usate per determinare alcuno stato cognitivo corrente.
async function runPrimoConsulto(recipeId){
  const recipe=R(recipeId);
  const v=curLab(recipe);
  if(S.primoConsultoLoading)return; // doppio clic / seconda chiamata mentre la prima è attiva
  if(!v||!v.ingredients||!v.ingredients.length){
    toast('Aggiungi almeno un ingrediente prima del Primo Consulto.','ti-alert-circle');
    return;
  }
  const variantId=v.id; // catturato ORA: è la bozza a cui il risultato resterà legato

  // Input da KHUB (Step 0) — passato come contesto, MAI ripetuto da MichelinAI
  const controlliKhub=checkDeterministicoLAB(v);
  const controlliText=controlliKhub.length
    ? controlliKhub.map(c=>'- ['+c.severity+'] '+c.message).join('\n')
    : 'Nessun problema formale rilevato.';

  const ingList=v.ingredients.map((i,idx)=>(idx+1)+'. '+i.name+': '+i.qty+i.unit).join('\n');
  const proc=(v.steps||[]).filter(s=>s&&s.trim()).join(' ');

  const prompt='Sei MichelinAI, il collega esperto che osserva la Scheda di una preparazione in KHUB. Stai facendo il Primo Consulto su questa ricetta, appena creata o ancora in sviluppo.\n\n'
    +'REGOLE FERME:\n'
    +'- Non valuti gusto, creatività, decisioni di menu, prezzo o food cost: se non è tecnico o gastronomico, non ne parli.\n'
    +'- I controlli formali (nomi, quantità, unità, procedimento assente) li ha già fatti KHUB: te li elenco sotto solo come contesto, NON ripeterli mai nelle tue osservazioni.\n'
    +'- Prima di includere un\'osservazione chiediti: se la persona la conoscesse, cambierebbe qualcosa nel suo modo di lavorare o nelle sue decisioni? Se no, non includerla. Poche osservazioni utili valgono più di molte generiche — un array vuoto va benissimo se la ricetta è semplice e ben scritta.\n'
    +'- Ogni osservazione deve avere una motivazione (reason): perché lo dici, non solo cosa dici.\n'
    +'- Scrivi ogni osservazione come parlerebbe un collega esperto: diretto, semplice, mai burocratico.\n'
    +'- Dichiara il livello di certezza con onestà: fatto_verificato solo per tecnica/scienza alimentare consolidata o dati espliciti nella Scheda; ipotesi o dati_insufficienti quando la Scheda è nuova e non hai storia su cui basarti. source deve essere scheda_corrente se il dato viene da questa ricetta, conoscenza_universale se viene da nozioni generali di cucina/scienza alimentare.\n\n'
    +'RICETTA: '+recipe.name+' ('+recipe.category+')\n'
    +'INGREDIENTI:\n'+ingList+'\n'
    +'PROCEDIMENTO:\n'+(proc||'non ancora scritto')+'\n\n'
    +'CONTROLLI GIÀ FATTI DA KHUB (contesto, non ripeterli):\n'+controlliText+'\n\n'
    +'Rispondi SOLO con JSON valido, niente testo fuori dal JSON:\n'
    +'{"observations":[{"category":"realizzabilita_tecnica|coerenza_preparazione|criticita|informazioni_mancanti|aspetti_da_approfondire|opportunita_miglioramento","observation":"testo breve in italiano","reason":"perché lo dici, breve, obbligatorio","source":"scheda_corrente|conoscenza_universale","confidence":"fatto_verificato|osservazione_ricorrente|ipotesi|dati_insufficienti"}]}\n'
    +'Massimo '+PRIMO_CONSULTO_MAX_OBS+' osservazioni.';

  S.primoConsultoLoading=true;
  S.primoConsultoLoadingKey=recipeId+'|'+variantId;
  render();

  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:900,
        messages:[{role:'user',content:prompt}]})});

    // 1. HTTP non riuscito
    if(!res.ok){
      throw new Error('HTTP '+res.status);
    }

    const data=await res.json();
    const text=(data.content||[]).map(c=>c.text||'').join('').replace(/```json|```/g,'').trim();

    // 2. Risposta vuota
    if(!text){
      throw new Error('risposta vuota');
    }

    // 3. JSON malformato — JSON.parse lancia da solo, catturato sotto
    const parsed=JSON.parse(text);

    // 4. Categorie/fonti/certezza non ammessi, campi mancanti — validazione esplicita
    //    con status, mai un array vuoto ambiguo tra "pulito" e "non affidabile"
    const validato=validatePrimoConsultoOutput(parsed);
    if(validato.status==='invalid'){
      throw new Error('output non affidabile: '+validato.scartate.join('; '));
    }

    // 5. Ricetta o bozza LAB non più disponibile (o cambiata) al termine della chiamata —
    //    ri-verifico DOPO l'attesa, non do per scontato che sia ancora la stessa
    const recipeOra=R(recipeId);
    const labOra=recipeOra&&curLab(recipeOra);
    if(!recipeOra||!labOra||labOra.id!==variantId){
      toast('La Scheda o la bozza sono cambiate nel frattempo: risultato del Primo Consulto scartato.','ti-alert-circle');
      S.primoConsultoLoading=false;
      S.primoConsultoLoadingKey=null;
      render();
      return;
    }

    S.primoConsultoLoading=false;
    S.primoConsultoLoadingKey=null;
    const risultato={createdAt:new Date().toLocaleString('it-IT'),observations:validato.observations};
    upLab(recipeId,v=>({...v,primoConsulto:risultato})); // scrive sulla bozza + autosave (render incluso)
    if(validato.observations.length===0){
      toast('Primo Consulto completato: nessuna osservazione rilevante.','ti-circle-check');
    }
    return;
  }catch(e){
    console.error('[Primo Consulto] errore:',e);
    toast('Errore durante il Primo Consulto. Riprova.','ti-alert-circle');
  }
  S.primoConsultoLoading=false;
  S.primoConsultoLoadingKey=null;
  render();
}

// ══════════════════════════════════════════════════════════
// "Chiedi a MichelinAI" — Step 3E.2: collegamento reale.
// Pipeline: buildPromptChiediMichelinAI -> callMichelinAI ->
// validateChiediMichelinAIOutput -> renderRispostaMichelinAI.
// Stesso pattern di sicurezza già usato da Primo Consulto/Interpretazione:
// blocco doppio invio, variantId catturato prima della chiamata, verifica
// che la bozza sia ancora la stessa al ritorno, cronologia aggiornata SOLO
// dopo un output valido.
// ══════════════════════════════════════════════════════════

// Pura, testabile offline: nessuna chiamata di rete qui dentro.
// Traduce contesto (Step 3D) + domanda + cronologia in testo, seguendo
// esattamente il prompt congelato in Step 3E.1.
function buildPromptChiediMichelinAI(contesto,domanda,cronologiaDomande){
  const fmtIng=ings=>(ings||[]).map((i,idx)=>{
    let riga=(idx+1)+'. '+i.nome+': '+i.quantita+' '+i.unita;
    if(i.mattoncino)riga+=' (mattoncino: preparazione validata usata come ingrediente)';
    if(i.resaStimata!=null)riga+=' — resa stimata '+i.resaStimata+'%';
    if(i.resaMisurata!=null)riga+=' — resa misurata '+i.resaMisurata+'%';
    return riga;
  }).join('\n');

  const origineStatoTesto={nessuna:'nessuna',disponibile:'disponibile',non_disponibile:'non disponibile'}[contesto.origine.stato]||contesto.origine.stato;

  let blocOrigine='\nORIGINE DELLA BOZZA: '+origineStatoTesto;
  if(contesto.origine.stato==='disponibile'){
    const o=contesto.origine;
    const aggiunti=o.confronto.dettaglio.filter(d=>d.tipo==='aggiunto').map(d=>d.ingName);
    const rimossi=o.confronto.dettaglio.filter(d=>d.tipo==='rimosso').map(d=>d.ingName);
    const modificati=o.confronto.dettaglio.filter(d=>d.tipo==='modificato').map(d=>d.ingName+' ('+d.campi.join(', ')+')');
    blocOrigine+='\nVERSIONE DI PARTENZA: '+(o.nome||'senza nome')+'\n'
      +'Ingredienti:\n'+fmtIng(o.ingredienti)+'\n'
      +'Procedimento: '+(o.procedimento||'non ancora scritto')+'\n'
      +'Confronto già calcolato da KHUB (contesto, non ricalcolarlo): '
      +'Aggiunti: '+(aggiunti.join(', ')||'nessuno')+'. '
      +'Rimossi: '+(rimossi.join(', ')||'nessuno')+'. '
      +'Modificati: '+(modificati.join(', ')||'nessuno')+'.';
  }

  let blocCronologia='';
  if(cronologiaDomande&&cronologiaDomande.length){
    blocCronologia='\n\nSe lo chef ha già fatto altre domande in questa sessione di lavoro su questa bozza, te le riporto qui SOLO per aiutarti a capire riferimenti linguistici come "ancora", "invece", "quello":\n'
      +cronologiaDomande.map((d,idx)=>(idx+1)+'. '+d).join('\n')
      +'\n\nLe domande precedenti servono esclusivamente ad aiutarti a interpretare riferimenti linguistici come "ancora", "invece", "quello". Non sono fatti, non sono conoscenza della Scheda e non sono una fonte tecnica. Basa il tuo giudizio sui dati reali della Scheda e, quando necessario, sulla conoscenza tecnica generale. Non assumere né ricostruire ciò che potresti aver risposto nelle interazioni precedenti.';
  }

  return 'Sei MichelinAI, il collega tecnico che accompagna questa Scheda per tutta la sua vita.\n\n'
    +'In questo momento lo chef ti sta facendo una domanda specifica mentre lavora su questa bozza in LAB. Non stai facendo un Primo Consulto (bonifica generale di una Scheda appena nata) né un\'Interpretazione delle modifiche (lettura di un confronto già calcolato): stai rispondendo esattamente a quello che ti è stato chiesto.\n\n'

    +'SCHEDA: '+contesto.nome+' ('+contesto.categoria+') — '+contesto.porzioni+' porzioni, '+contesto.portionSize+' '+contesto.portionUnit+'/porzione'+(contesto.pesoTotale!=null?', peso totale '+contesto.pesoTotale+' g':'')+'\n'
    +'INGREDIENTI:\n'+fmtIng(contesto.ingredienti)+'\n'

    +blocOrigine
    +blocCronologia+'\n\n'
    +'DOMANDA DELLO CHEF: '+domanda+'\n\n'
    +'Se la domanda è ipotetica ("cosa succede se sostituisco X con Y?"), rispondi con un giudizio qualitativo da collega esperto — non simulare numericamente uno scenario, non trattare la sostituzione come se fosse già avvenuta nella Scheda. È una conversazione, non un calcolo.\n\n'
    +'Rispondi ESCLUSIVAMENTE con JSON valido, nessun testo fuori dal JSON:\n'
    +'{"pertinente": true|false, "risposta": "testo diretto allo chef", "motivo": "obbligatorio se pertinente:true", "fonti": ["scheda_corrente"|"conoscenza_universale", ...], "certezza": "fatto_verificato|osservazione_ricorrente|ipotesi|dati_insufficienti"}\n'
    +'pertinente:false significa ESCLUSIVAMENTE "questa richiesta non appartiene al mio compito su questa Scheda" — MAI "non ho abbastanza dati". Se la domanda riguarda la Scheda ma i dati non bastano per una risposta affidabile, resta pertinente:true con certezza:"dati_insufficienti" e spiega cosa manca.';

// Unico punto che tocca la rete. Restituisce l'oggetto già JSON.parse-ato
// (può lanciare: HTTP non ok, risposta vuota, JSON malformato — catturati
// dal chiamante, mai qui dentro).
async function callMichelinAI(prompt){
  const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:700,messages:[{role:'user',content:prompt}]})});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const data=await res.json();
  const text=(data.content||[]).map(c=>c.text||'').join('').replace(/```json|```/g,'').trim();
  if(!text)throw new Error('risposta vuota');
  return JSON.parse(text); // JSON malformato: lancia da solo, catturato dal chiamante
}

const CHIEDI_MICHELINAI_FONTE_LABEL={scheda_corrente:'Scheda corrente',conoscenza_universale:'Conoscenza generale'};

async function chiediMichelinAI(recipeId){
  const inp=document.getElementById('mai-q-input');
  const domanda=inp?.value?.trim();
  if(!domanda)return; // stringa vuota o solo spazi: nessun invio
  if(S.michelinAILoading)return; // blocco doppio invio

  const recipe=R(recipeId);
  const v=recipe&&curLab(recipe);
  if(!v)return;
  const variantId=v.id; // catturato ORA: la risposta resta legata a questa bozza precisa

  const contesto=costruisciContestoSchedaLAB(recipeId);
  if(!contesto){toast('Impossibile leggere la Scheda in questo momento.','ti-alert-circle');return;}

  const cronologiaAttuale=S.michelinAICronologia[variantId]||[];
  const prompt=buildPromptChiediMichelinAI(contesto,domanda,cronologiaAttuale);

  S.michelinAILoading=true;
  S.michelinAILoadingKey=recipeId+'|'+variantId;
  S.michelinAIQuestion='';
  render();

  try{
    const parsed=await callMichelinAI(prompt);
    const validato=validateChiediMichelinAIOutput(parsed);
    if(validato.status==='invalid'){
      throw new Error('output non affidabile: '+validato.scartate.join('; '));
    }

    // Ri-verifico DOPO l'attesa: la bozza potrebbe essere cambiata nel frattempo
    const recipeOra=R(recipeId);
    const labOra=recipeOra&&curLab(recipeOra);
    if(!recipeOra||!labOra||labOra.id!==variantId){
      toast('La Scheda o la bozza sono cambiate nel frattempo: risposta scartata.','ti-alert-circle');
      S.michelinAILoading=false;S.michelinAILoadingKey=null;render();return;
    }

    S.michelinAILastQuestion=domanda;
    S.michelinAIRisposta=validato;
    // Cronologia aggiornata SOLO dopo un output valido, mai prima
    S.michelinAICronologia[variantId]=aggiungiDomandaACronologia(cronologiaAttuale,domanda);
  }catch(e){
    console.error('[Chiedi a MichelinAI] errore:',e);
    toast('Errore durante la risposta di MichelinAI. Riprova.','ti-alert-circle');
  }finally{
    S.michelinAILoading=false;S.michelinAILoadingKey=null;render();
  }
}

function voiceToIngredients(recipeId){

  fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},

function toggleRecording(recipeId){
  if(S.recording){
    if(S._speechRecognition){S._speechRecognition.stop();}
    S.recording=false;render();return;
  }
  var SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRec){
    toast("Registrazione vocale non supportata da questo browser","ti-microphone-off");
    return;
  }
  var rec=new SpeechRec();
  rec.lang="it-IT";
  rec.continuous=true;
  rec.interimResults=true;
  var finalText="";
  rec.onresult=function(e){
    var interim="";
    for(var i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal){finalText+=e.results[i][0].transcript+" ";}
      else{interim+=e.results[i][0].transcript;}
    }
    var preview=document.getElementById("voice-preview");
    if(preview)preview.textContent=(finalText+interim).trim();
  };
  rec.onerror=function(e){
    S.recording=false;S._speechRecognition=null;
    toast("Errore microfono: "+e.error,"ti-microphone-off");
    render();
  };
  rec.onend=function(){
    S.recording=false;S._speechRecognition=null;
    if(finalText.trim()){
      S.pendingVoiceText[recipeId]=finalText.trim();
    }
    render();
  };
  S._speechRecognition=rec;
  rec.start();
  S.recording=true;render();
}

function renderConfronto(recipe){
  const varianti=recipe.validatedVariants;

  const vB=S.confrontoB?varianti.find(v=>v.id===S.confrontoB):null;

  function cnum(x){return parseFloat(x)||0;}
  function pct(ing,ings){const tot=ings.reduce((s,i)=>s+cnum(i.qty),0);return tot>0?(cnum(ing.qty)/tot*100).toFixed(1)+'%':'–';}

  function colonna(v,cls){
    if(!v)return `<div class="confronto-col"><div class="confronto-col-header ${cls}" style="color:var(--mid)">Seleziona Ricetta attiva</div><div class="confronto-empty">Scegli una Ricetta attiva dal menu sopra</div></div>`;
    const tot=v.ingredients.reduce((s,i)=>s+cnum(i.qty),0);
    const isActiveV=v.active===true&&v.status!=='retired';
    return `<div class="confronto-col">
      <div class="confronto-col-header ${cls}">${v.name}${isActiveV?' ★':''}</div>
      ${v.ingredients.length===0?`<div class="confronto-empty">Nessun ingrediente</div>`:
        v.ingredients.map(ing=>{
          const altro=cls==='col-a'?vB:vA;
          const altroIng=altro?altro.ingredients.find(i=>i.name.toLowerCase()===ing.name.toLowerCase()):null;
          const isDiff=altro&&(!altroIng||Math.abs(cnum(altroIng.qty)-cnum(ing.qty))>0.01);
          return `<div class="confronto-ing-row${isDiff?' diff':''}">
            <div class="confronto-ing-name">${ing.name}</div>
            <div class="confronto-ing-qty">${ing.qty} ${ing.unit}</div>
            <div class="confronto-ing-pct">${pct(ing,v.ingredients)}</div>
          </div>`;
        }).join('')
      }
    </div>`;
  }

  return `
  <div class="confronto-header">
    <button onclick="S.view='ricetta-madre-v2';render()" style="background:rgba(255,255,255,0.15);border:none;color:white;border-radius:var(--r-sm);padding:5px 10px;font-family:inherit;font-size:12px;cursor:pointer;margin-bottom:12px"><i class="ti ti-arrow-left"></i> ${recipe.name}</button>

  <div class="confronto-selectors">

      ${varianti.map(v=>`<option value="${v.id}" ${S.confrontoA===v.id?'selected':''}>${v.name}${v.active&&v.status!=='retired'?' ★':''}</option>`).join('')}
    </select>
    <select class="confronto-select" onchange="S.confrontoB=this.value||null;render()">
      <option value="">— Ricetta attiva B —</option>
      ${varianti.map(v=>`<option value="${v.id}" ${S.confrontoB===v.id?'selected':''}>${v.name}${v.active&&v.status!=='retired'?' ★':''}</option>`).join('')}
    </select>
  </div>

  ${vA&&vB?`<div class="confronto-legend"><span><span class="confronto-legend-dot"></span>Ingrediente con quantità diversa</span></div>`:''}

  <div class="confronto-grid">
    ${colonna(vA,'col-a')}
    ${colonna(vB,'col-b')}
  </div>`;
}

// Ordina per data italiana gg/mm/aaaa (l'unico formato realmente disponibile
// oggi in validatedAt — non tocchiamo loadFromSupabase/schema per avere di
// più: precisione al giorno, dichiarata, non simulata).
function parseDataItaliana(str){
  if(!str)return null;
  const parti=str.split('/');
  if(parti.length!==3)return null;
  const g=parseInt(parti[0],10),m=parseInt(parti[1],10),a=parseInt(parti[2],10);
  if(!g||!m||!a)return null;
  return new Date(a,m-1,g).getTime();
}

                    <div style="font-size:11.5px;color:var(--dpop-grigio-dato);display:flex;justify-content:space-between;max-width:360px;padding-left:14px">
                      <span>${si.name}</span><span style="font-family:'IBM Plex Mono',monospace">${si.qty} ${si.unit}</span>
                    </div>`).join('')}
                </div>
              `:`<div style="font-size:11.5px;color:#c0392b;margin-top:3px;padding-left:14px"><i class="ti ti-alert-triangle"></i> Scheda o Ricetta collegata non più disponibile</div>`}
            </div>`;
          }).join('')}
        </div>
        <div style="font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--dpop-grigio-dato);margin-bottom:6px">Procedimento</div>
        ${(v.steps||[]).filter(s=>s&&s.trim()).length===0?`
          <div style="font-size:12px;color:var(--dpop-grigio-dato)">Nessun passaggio registrato.</div>
        `:`
          <ol style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">
            ${v.steps.filter(s=>s&&s.trim()).map(s=>`<li style="font-size:13px;color:var(--dpop-inchiostro-testo)">${s}</li>`).join('')}
          </ol>
        `}
      `}`;
  }

  // ═══ A. IDENTITÀ ═══
  const nRic=inLab.length+(recipe.validatedVariants||[]).length; // stessa convenzione già usata nell'ambiente Schede
  const nAtt=attive.length;
  const famiglieRicettaIds=S.variantFamilies['lab_'+recipe.id]||[];
  const famiglieRicettaNomi=famiglieRicettaIds.map(fid=>{const f=S.families.find(x=>x.id===fid);return f?f.name:'';}).filter(Boolean);

  const zonaIdentita=`
    <button class="si-back" onclick="S.view='home';render()"><i class="ti ti-arrow-left"></i> Schede</button>
    <div class="si-identita">
      <div class="si-nome">${recipe.name}</div>
      <div class="si-meta">${recipe.category}${recipe.department?' · '+recipe.department:''} — ${nRic} RIC · ${nAtt} ATT</div>
      ${famiglieRicettaNomi.length?`<div class="si-famiglie">${famiglieRicettaNomi.map(n=>`<span class="si-famiglia-tag">${n}</span>`).join('')}</div>`:''}
    </div>`;

  // ═══ Azione principale: Nuova Ricetta in LAB — STESSA logica esistente,
  // stesso meccanismo di scelta della Ricetta di partenza se ce n'è più di una. ═══
  const zonaAzionePrincipale=S.pendingDuplicaSceltaRecipeId===recipe.id?`
    <div class="si-scelta-partenza">
      <div class="si-scelta-partenza-titolo">Da quale Ricetta attiva vuoi partire?</div>
      ${attive.map(v=>`<button class="si-scelta-riga" onclick="creaBozzaDaAttivaId('${recipe.id}','${v.id}')">${v.name}</button>`).join('')}
      <button class="si-scelta-annulla" onclick="S.pendingDuplicaSceltaRecipeId=null;render()">Annulla</button>
    </div>`:`
    <div class="si-azione-principale">
      <button class="si-btn-principale" onclick="duplicaVersioneLAB('${recipe.id}')"><i class="ti ti-plus"></i> Nuova Ricetta in LAB</button>
    </div>`;

  // ═══ B. OGGI — cosa sta succedendo ora: Attive + Bozze + Pronte. Mai le Archiviate. ═══
  const sezioneAttiveOggi=attive.length>0?`
    <div class="si-sezione-cesura"><span class="si-sezione-notch verde"></span><span class="si-sezione-titolo">Attive</span><span class="si-sezione-count">${attive.length}</span></div>
    ${attive.map(v=>{
      const espansa=!!S.rmv2AttivaEspansa[v.id];
      return `<div class="si-riga">
        <button class="si-riga-apri" onclick="S.view='recipe';S.mode='produzione';S.selectedVariantId='${v.id}';render()">
          <span class="si-riga-nome">${v.name}</span>
          <span class="si-riga-sub">${v.portionsCount} porz · ${v.gramsPerPortion}g/porz · dal ${v.validatedAt}</span>
        </button>
        <div class="si-riga-azioni">
          <button class="si-riga-btn" onclick="S.rmv2AttivaEspansa['${v.id}']=!S.rmv2AttivaEspansa['${v.id}'];render()">${espansa?'Chiudi':'Contenuto'}</button>
          <button class="si-riga-btn" onclick="toggleActiveV2('${recipe.id}','${v.id}',true)" title="Disattiva per la produzione">Disattiva</button>
        </div>
        ${espansa?`<div class="si-riga-dettaglio">${renderContenutoVariante(v)}</div>`:''}
      </div>`;
    }).join('')}`:'';

  const sezioneBozzeOggi=inLab.length>0?`
    <div class="si-sezione-cesura"><span class="si-sezione-notch lacca"></span><span class="si-sezione-titolo">In LAB — lavoro in corso</span><span class="si-sezione-count">${inLab.length}</span></div>
    ${inLab.map(v=>`<div class="si-riga">
      <button class="si-riga-apri" onclick="S.view='recipe';S.mode='lab';S.recipes=S.recipes.map(r=>r.id==='${recipe.id}'?{...r,currentLabIdx:${v._idx}}:r);S.selectedVariantId=null;render()">
        <span class="si-riga-nome">${v._name}</span>
        <span class="si-riga-sub">Bozza in sviluppo</span>
      </button>
      <div class="si-riga-azioni"><button class="si-riga-btn" onclick="S.view='recipe';S.mode='lab';S.recipes=S.recipes.map(r=>r.id==='${recipe.id}'?{...r,currentLabIdx:${v._idx}}:r);S.selectedVariantId=null;render()">Apri LAB</button></div>
    </div>`).join('')}`:'';

  const sezionePronteOggi=pronte.length>0?`
    <div class="si-sezione-cesura"><span class="si-sezione-notch neutro"></span><span class="si-sezione-titolo">Pronte, non ancora attive</span><span class="si-sezione-count">${pronte.length}</span></div>
    ${pronte.map(v=>`<div class="si-riga">
      <button class="si-riga-apri" onclick="S.view='recipe';S.mode='produzione';S.selectedVariantId='${v.id}';render()">
        <span class="si-riga-nome">${v.name}</span>
        <span class="si-riga-sub">Pronta il ${v.validatedAt}</span>
      </button>
      <div class="si-riga-azioni">
        <button class="si-riga-btn" onclick="toggleActiveV2('${recipe.id}','${v.id}',false)">Attiva</button>
        <button class="si-riga-btn" onclick="retireVariant('${recipe.id}','${v.id}')" title="Archivia Ricetta">Archivia</button>
      </div>
    </div>`).join('')}`:'';

  const oggiVuoto=attive.length===0&&inLab.length===0&&pronte.length===0;
  const zonaOggi=`
    <div class="si-sezione-cesura" style="border-top:none"><span class="si-sezione-titolo" style="font-size:12px">Oggi</span></div>
    ${oggiVuoto?`<div class="si-empty"><i class="ti ti-info-circle"></i> Nessuna Ricetta attualmente in Produzione o in sviluppo.</div>`:`
      ${sezioneAttiveOggi}${sezioneBozzeOggi}${sezionePronteOggi}
    `}`;

  // ═══ C. STORIA — registro editoriale cronologico, solo Ricette consolidate
  // (Pronte + Attive + Archiviate). Le Bozze non entrano mai in Storia. ═══
  const consolidate=[...attive,...pronte,...archiviate]
    .map(v=>({...v,_ts:parseDataItaliana(v.validatedAt)}))
    .sort((a,b)=>(b._ts||0)-(a._ts||0)); // più recente prima; senza data, in fondo

  const statoLabel={active:'Attiva',approved:'Pronta',retired:'Archiviata'};
  const zonaStoria=`
    <div class="si-sezione-cesura" style="border-top:none"><span class="si-sezione-titolo" style="font-size:12px">Storia</span></div>
    ${consolidate.length===0?`<div class="si-empty"><i class="ti ti-history"></i> Nessuna Ricetta consolidata ancora.</div>`:
      consolidate.map(v=>`<button class="si-storia-riga" onclick="S.view='recipe';S.mode='produzione';S.selectedVariantId='${v.id}';render()">
        <span class="si-storia-data">${v.validatedAt||'—'}</span>
        <span class="si-storia-corpo"><span class="si-storia-nome">${v.name}</span><span class="si-storia-stato">${statoLabel[v._type]||v._type}</span></span>
      </button>`).join('')}`;

  // ═══ Azioni secondarie: Confronta, Unisci, Elimina — legacy, preservate ═══
  const zonaSecondarie=`
    <div class="si-secondarie">
      ${recipe.validatedVariants.length>=2?`<button class="si-btn-secondario" onclick="S.view='confronto';S.confrontoA=null;S.confrontoB=null;render()"><i class="ti ti-columns"></i> Confronta Ricette attive</button>`:''}
      <button class="si-btn-secondario" onclick="openMergePicker('${recipe.id}')"><i class="ti ti-git-merge"></i> Unisci con un'altra Scheda</button>
      ${S.confirmDeleteId===recipe.id?`
        <div style="font-size:13px;color:#c0392b;text-align:center;padding:8px 0"><i class="ti ti-alert-triangle"></i> Sei sicuro? Questa azione è irreversibile.</div>
        <div style="display:flex;gap:8px">
          <button class="si-btn-secondario" style="flex:1" onclick="S.confirmDeleteId=null;render()">Annulla</button>
          <button class="si-btn-elimina" style="flex:1;border:1px solid #c0392b" onclick="deleteRecipe('${recipe.id}')">Sì, elimina</button>
        </div>`:
        `<button class="si-btn-elimina" onclick="S.confirmDeleteId='${recipe.id}';render()"><i class="ti ti-trash"></i> Elimina questa Scheda</button>`
      }
    </div>`;

  return `<div class="si-env">
    ${zonaIdentita}
    ${zonaAzionePrincipale}
    ${zonaOggi}
    ${zonaStoria}
    ${zonaSecondarie}
  </div>`;
}

function renderHome(){
  const mainRecipesComplete=S.recipes.filter(r=>!r.parentRecipeId);

  // Censimento: N RIC conta TUTTE le Ricette della Scheda, in ogni stato
  // (bozze + pronte + attive + archiviate) — calcolo derivato, nessun tocco
  // al modello dati. N ATT resta activeVariants(), già esistente.
  function censimento(r){
    const nRic=(r.labVersions||[]).length+(r.validatedVariants||[]).length;
    const nAtt=activeVariants(r).length;
    return{nRic,nAtt};
  }

  // Filtro Famiglia: riattivato con la stessa logica/stato già esistenti
  // (S.selectedFamily, S.variantFamilies) — nessuna nuova business logic.
  const famigliaAttivaId=S.selectedFamily;
  const mainRecipes=famigliaAttivaId
    ?mainRecipesComplete.filter(r=>(r.validatedVariants||[]).some(vv=>vv.status!=='retired'&&(S.variantFamilies[vv.id]||[]).includes(famigliaAttivaId)))
    :mainRecipesComplete;
  const famigliaAttivaNome=famigliaAttivaId?(S.families.find(f=>f.id===famigliaAttivaId)?.name||''):null;

  // Raggruppamento per categoria, ordine alfabetico
  const perCategoria={};
  mainRecipes.forEach(r=>{
    const cat=r.category||'Altro';
    if(!perCategoria[cat])perCategoria[cat]=[];
    perCategoria[cat].push(r);
  });
  const categorie=Object.keys(perCategoria).sort((a,b)=>a.localeCompare(b));

  const totRicette=mainRecipes.reduce((s,r)=>s+(r.labVersions||[]).length+(r.validatedVariants||[]).length,0);

  const headerHtml=`<div class="schede-header">
    <div class="schede-title">Schede</div>
    <div class="schede-accessi">
      <button class="schede-accesso" id="schede-btn-filtra">FILTRA</button>
      <span class="schede-accessi-sep"></span>
      <button class="schede-accesso" id="schede-btn-famiglie">FAMIGLIE</button>
    </div>
  </div>
  <div class="schede-count-globale">${categorie.length} CATEGORI${categorie.length===1?'A':'E'} · ${mainRecipes.length} SCHED${mainRecipes.length===1?'A':'E'} · ${totRicette} RICETT${totRicette===1?'A':'E'}</div>
  ${famigliaAttivaNome?`<div class="schede-filtro-attivo">FAMIGLIA: ${famigliaAttivaNome} <button onclick="S.selectedFamily=null;render()">✕</button></div>`:''}`;

  if(mainRecipesComplete.length===0){
    return `<div class="schede-env">${headerHtml}
      <div class="schede-empty"><i class="ti ti-book-2" style="font-size:28px;display:block;margin-bottom:10px"></i>Nessuna Scheda ancora.</div>
    </div>`;
  }
  if(mainRecipes.length===0){
    return `<div class="schede-env">${headerHtml}
      <div class="schede-empty"><i class="ti ti-tags" style="font-size:28px;display:block;margin-bottom:10px"></i>Nessuna Scheda in questa famiglia.</div>
    </div>`;
  }

  return `<div class="schede-env">${headerHtml}
    ${categorie.map(cat=>{
      const righe=perCategoria[cat];
      return `<div class="schede-cesura">
          <span class="schede-cesura-tacca"></span>
          <span class="schede-cesura-nome">${cat.toUpperCase()}</span>
          <span class="schede-cesura-conteggio">${righe.length} SCHED${righe.length===1?'A':'E'}</span>
        </div>
        ${righe.map(r=>{
          const{nRic,nAtt}=censimento(r);
          return `<button class="schede-riga" data-nav="${r.id}">
            <span class="schede-riga-nome">${r.name}</span>
            <span class="schede-riga-censimento"><span class="schede-ric">${nRic} RIC</span> · <span class="schede-att ${nAtt>0?'attivo':'zero'}">${nAtt} ATT</span></span>
          </button>`;
        }).join('')}`;
    }).join('')}
    <div class="schede-fine">FINE PATRIMONIO</div>
  </div>`;
}

// Picker Famiglie/Filtra per l'ambiente Schede — D-POP v2.2. Riusa dati e stato
// già esistenti (S.families, S.variantFamilies, S.selectedFamily): nessuna
// nuova business logic, solo una presentazione coerente col Visual System al
// posto dello schermo legacy separato. "Filtra" e "Famiglie" aprono oggi lo
// stesso pannello: l'unico criterio di filtro reale disponibile sulle Schede
// è la Famiglia — non ho inventato un secondo criterio che non esiste.
function renderSchedeFamigliePicker(){
  return `<div class="overlay">
    <div class="modal modal-split" style="max-width:420px">
      <div class="modal-scroll">
        <div class="modal-title">Famiglie</div>
        <div class="modal-sub">Filtra le Schede per famiglia assegnata a una loro Ricetta.</div>
        ${S.families.length===0?`<div style="padding:16px 0;color:var(--dpop-grigio-dato);font-size:13px">Nessuna famiglia creata ancora — si assegnano alle Ricette durante la validazione in LAB.</div>`:
          S.families.map(f=>`<button class="schede-famiglia-riga ${S.selectedFamily===f.id?'attiva':''}" onclick="S.selectedFamily='${f.id}';S.showSchedeFamiglie=false;render()">${f.name}</button>`).join('')}
        ${S.selectedFamily?`<button class="schede-famiglia-riga" onclick="S.selectedFamily=null;S.showSchedeFamiglie=false;render()"><i>Rimuovi filtro</i></button>`:''}
      </div>
      <div class="modal-actions"><button class="btn btn-outline" onclick="S.showSchedeFamiglie=false;render()">Chiudi</button></div>
    </div>

function renderSearch(query){
  var q=query.toLowerCase();
  var results=[];
  S.recipes.forEach(function(r){
    var matchRecipe=r.name.toLowerCase().includes(q)||r.category.toLowerCase().includes(q);
    if(matchRecipe)results.push({type:"recipe",name:r.name,meta:r.category,id:r.id,emoji:catEmoji(r.category)});
    r.validatedVariants.forEach(function(vv){
      if(vv.name.toLowerCase().includes(q)||r.name.toLowerCase().includes(q)){
        results.push({type:"variant",name:r.name,meta:"Ricetta attiva: "+vv.name,id:r.id,variantId:vv.id,emoji:catEmoji(r.category)});
      }
    });
  });
  S.families.forEach(function(f){
    if(f.name.toLowerCase().includes(q))results.push({type:"family",name:f.name,meta:"famiglia",id:f.id,emoji:"🏷️"});
  });
  // Deduplica
  var seen={};
  results=results.filter(function(r){var k=r.type+r.id+(r.variantId||"");if(seen[k])return false;seen[k]=true;return true;});
  if(results.length===0)return `<div class="card" style="text-align:center;padding:32px;color:var(--mid)"><i class="ti ti-search" style="font-size:32px;display:block;margin-bottom:12px"></i>Nessun risultato per "<strong>${query}</strong>"</div>`;
  return `<div class="card" style="padding:0;">
    <div class="recipe-list-header">Risultati per "${query}" (${results.length})</div>
    <div class="search-results">
      ${results.map(r=>{
        var onclick=r.type==="family"
          ? `S.selectedFamily='${r.id}';S.homeTab='prod';S.showSearch=false;S.searchQuery='';S.view='home';render()`
          : r.type==="variant"
            ? `S.selectedId='${r.id}';S.selectedVariantId='${r.variantId}';S.mode='produzione';S.view='recipe';S.showSearch=false;S.searchQuery='';render()`
            : `S.selectedId='${r.id}';S.view='ricetta-madre-v2';S.showSearch=false;S.searchQuery='';render()`;
        return `<div class="search-result-item" onclick="${onclick}">
          <div style="width:36px;height:36px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">${r.emoji}</div>
          <div style="flex:1"><div class="search-result-name">${r.name}</div><div class="search-result-meta">${r.meta}</div></div>
          <i class="ti ti-chevron-right" style="color:var(--border);font-size:14px"></i>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}
