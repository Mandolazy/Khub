<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Khub — Kitchen Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --orange:#C85A1E;--orange-light:#FDF0E8;--orange-border:rgba(200,90,30,0.18);
  --sage:#8A9E88;--sage-light:#EBF0EA;--sage-dark:#6B8869;
  --lab:#2C4A3E;--lab-light:#E8F0ED;--lab-border:rgba(44,74,62,0.15);
  --prod:#8B4513;--prod-light:#FDF0E8;
  --cream:#F5F0E8;--dark:#2C2C2A;--mid:#6B6A66;--light:#A8A7A3;
  --border:rgba(44,44,42,0.11);--white:#FFFFFF;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;
  --shadow:0 1px 3px rgba(0,0,0,0.07),0 4px 12px rgba(0,0,0,0.05);
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--dark);min-height:100vh;font-size:14px;line-height:1.5;}

/* ── SHELL ── */
.shell{display:grid;grid-template-columns:240px 1fr;grid-template-rows:56px 1fr;height:100vh;overflow:hidden;}
.topbar{grid-column:1/-1;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;z-index:10;}
.logo{font-size:19px;font-weight:600;color:var(--orange);letter-spacing:-0.5px;}
.logo-tag{font-size:10px;color:var(--mid);font-weight:400;margin-left:2px;}
.mode-switcher{margin-left:auto;display:flex;background:var(--cream);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
.mode-btn{padding:5px 16px;border-radius:999px;border:none;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;color:var(--mid);background:transparent;display:flex;align-items:center;gap:6px;transition:all 0.18s;}
.mode-btn.lab-active{background:var(--lab);color:var(--white);}
.mode-btn.prod-active{background:var(--orange);color:var(--white);}

/* ── SIDEBAR ── */
.sidebar{background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto;gap:2px;}
.new-btn{display:flex;align-items:center;gap:7px;width:100%;padding:9px 12px;background:var(--orange);color:var(--white);border:none;border-radius:var(--r-md);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:2px;transition:opacity 0.15s;}
.new-btn:hover{opacity:0.88;}
.load-btn{display:flex;align-items:center;gap:7px;width:100%;padding:9px 12px;background:transparent;color:var(--mid);border:1px solid var(--border);border-radius:var(--r-md);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:10px;transition:all 0.15s;}
.load-btn:hover{background:var(--cream);color:var(--dark);}
.load-btn.active{background:var(--sage-light);color:var(--sage-dark);border-color:var(--sage);}
.sec-label{font-size:9px;font-weight:600;letter-spacing:0.09em;text-transform:uppercase;color:var(--light);padding:10px 8px 3px;}
.recipe-btn{display:flex;align-items:center;gap:7px;width:100%;padding:7px 9px;border:none;border-radius:var(--r-sm);background:transparent;font-family:inherit;font-size:12px;color:var(--dark);cursor:pointer;text-align:left;transition:background 0.1s;}
.recipe-btn:hover{background:var(--cream);}
.recipe-btn.active-lab{background:var(--lab-light);color:var(--lab);font-weight:500;}
.recipe-btn.active-prod{background:var(--orange-light);color:var(--orange);font-weight:500;}
.recipe-btn .var-count{margin-left:auto;font-size:9px;font-weight:600;background:var(--cream);color:var(--mid);padding:1px 5px;border-radius:999px;flex-shrink:0;}
.recipe-btn.active-lab .var-count{background:var(--lab-light);color:var(--lab);}
.recipe-btn.active-prod .var-count{background:var(--orange-light);color:var(--orange);}

/* ── MAIN ── */
.main{overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:16px;background:var(--cream);}
.card{background:var(--white);border-radius:var(--r-lg);border:1px solid var(--border);padding:20px 22px;box-shadow:var(--shadow);}
.card-label{font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--mid);display:flex;align-items:center;gap:6px;margin-bottom:14px;}

/* ── LAB THEME ── */
.lab-header{background:linear-gradient(135deg,var(--lab) 0%,#3D6B5A 100%);border-radius:var(--r-xl);padding:22px 24px;color:white;position:relative;}
.lab-header::before{content:'LAB';position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:64px;font-weight:700;opacity:0.08;letter-spacing:-2px;font-family:'DM Mono',monospace;}
.lab-header .recipe-name{font-size:24px;font-weight:600;letter-spacing:-0.5px;color:white;}
.lab-header .recipe-meta{font-size:11px;color:rgba(255,255,255,0.65);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;}
.lab-header .header-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

/* ── PROD THEME ── */
.prod-header{background:linear-gradient(135deg,#8B4513 0%,var(--orange) 100%);border-radius:var(--r-xl);padding:22px 24px;color:white;position:relative;}
.prod-header::before{content:'PROD';position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:56px;font-weight:700;opacity:0.08;letter-spacing:-2px;font-family:'DM Mono',monospace;}
.prod-header .recipe-name{font-size:24px;font-weight:600;letter-spacing:-0.5px;color:white;}
.prod-header .recipe-meta{font-size:11px;color:rgba(255,255,255,0.65);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r-md);border:none;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;}
.btn-primary{background:var(--orange);color:white;}
.btn-primary:hover{opacity:0.88;}
.btn-lab{background:var(--lab);color:white;}
.btn-lab:hover{opacity:0.88;}
.btn-ghost{background:rgba(255,255,255,0.15);color:white;border:1px solid rgba(255,255,255,0.25);}
.btn-ghost:hover{background:rgba(255,255,255,0.25);}
.btn-outline{background:transparent;color:var(--mid);border:1px solid var(--border);}
.btn-outline:hover{background:var(--cream);color:var(--dark);}
.btn-danger{background:transparent;color:#c0392b;border:1px solid rgba(192,57,43,0.3);}
.btn-danger:hover{background:rgba(192,57,43,0.08);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-icon{padding:7px;border-radius:var(--r-sm);}

/* ── SCALING ROW ── */
.scaling-row{display:flex;gap:10px;flex-wrap:wrap;}
.scale-box{display:flex;flex-direction:column;gap:4px;}
.scale-label{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.6);}
.scale-input{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:var(--r-sm);padding:6px 10px;font-family:'DM Mono',monospace;font-size:15px;font-weight:500;color:white;width:90px;outline:none;}
.scale-input:focus{background:rgba(255,255,255,0.22);border-color:rgba(255,255,255,0.5);}
.scale-total{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:var(--r-sm);padding:6px 10px;font-family:'DM Mono',monospace;font-size:15px;font-weight:500;color:rgba(255,255,255,0.7);min-width:90px;}

/* ── INGREDIENTS TABLE ── */
.ing-table{width:100%;border-collapse:collapse;}
.ing-table th{text-align:left;font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--mid);padding:0 6px 10px;border-bottom:1px solid var(--border);}
.ing-table th:last-child{text-align:right;}
.ing-table td{padding:7px 6px;border-bottom:1px solid rgba(44,44,42,0.06);vertical-align:middle;}
.ing-table tr:last-child td{border-bottom:none;}
.ing-name{font-size:13px;color:var(--dark);}
.ing-qty-input{background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 7px;font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--dark);width:80px;outline:none;transition:all 0.12s;}
.ing-qty-input:hover{border-color:var(--border);background:var(--cream);}
.ing-qty-input:focus{border-color:var(--sage);background:var(--white);}
.ing-qty-readonly{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--dark);padding:4px 7px;}
.ing-unit-select{background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;font-family:inherit;font-size:12px;color:var(--mid);outline:none;cursor:pointer;transition:all 0.12s;}
.ing-unit-select:hover{border-color:var(--border);background:var(--cream);}
.ing-pct{font-size:11px;color:var(--light);text-align:right;font-family:'DM Mono',monospace;}
.ing-bar{height:2px;background:var(--sage-light);border-radius:999px;margin-top:3px;overflow:hidden;}
.ing-bar-fill{height:100%;background:var(--sage);border-radius:999px;transition:width 0.3s;}
.add-ing-row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;}
.add-ing-input{flex:1;min-width:120px;background:var(--cream);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 10px;font-family:inherit;font-size:13px;color:var(--dark);outline:none;}
.add-ing-input:focus{border-color:var(--sage);background:var(--white);}
.add-ing-input-sm{width:80px;background:var(--cream);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 8px;font-family:'DM Mono',monospace;font-size:13px;color:var(--dark);outline:none;}
.add-ing-input-sm:focus{border-color:var(--sage);background:var(--white);}
.unit-select{background:var(--cream);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 6px;font-family:inherit;font-size:12px;color:var(--dark);outline:none;cursor:pointer;}

/* ── STEPS ── */
.steps-list{display:flex;flex-direction:column;gap:10px;}
.step-item{display:flex;gap:10px;align-items:flex-start;}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--lab-light);color:var(--lab);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:4px;}
.step-text{flex:1;background:var(--cream);border:1px solid transparent;border-radius:var(--r-sm);padding:7px 10px;font-size:13px;color:var(--dark);outline:none;resize:vertical;min-height:36px;font-family:inherit;line-height:1.5;transition:all 0.12s;}
.step-text:focus{border-color:var(--sage);background:var(--white);}
.step-text[readonly]{background:transparent;cursor:default;}
.step-del{padding:4px 6px;background:transparent;border:none;color:var(--light);cursor:pointer;border-radius:6px;font-size:13px;flex-shrink:0;transition:color 0.12s;}
.step-del:hover{color:#c0392b;}

/* ── MEDIA ── */
.media-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.media-slot{border:2px dashed var(--border);border-radius:var(--r-lg);padding:20px;text-align:center;cursor:pointer;transition:all 0.15s;background:var(--cream);min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.media-slot:hover{border-color:var(--sage);background:var(--sage-light);}
.media-slot.filled{border-style:solid;border-color:var(--border);padding:0;overflow:hidden;}
.media-slot img{width:100%;height:150px;object-fit:cover;border-radius:calc(var(--r-lg) - 2px);}
.media-slot video{width:100%;height:150px;object-fit:cover;border-radius:calc(var(--r-lg) - 2px);}
.media-slot-icon{font-size:24px;color:var(--light);}
.media-slot-label{font-size:12px;color:var(--mid);font-weight:500;}
.media-slot-sub{font-size:11px;color:var(--light);}

/* ── VARIANTS ── */
.variant-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--cream);border-radius:var(--r-md);border:1px solid var(--border);transition:all 0.12s;cursor:pointer;}
.variant-card:hover{border-color:var(--orange-border);background:var(--orange-light);}
.variant-card.production{border-color:var(--orange);background:var(--orange-light);}
.vc-dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0;}
.vc-dot.production{background:var(--orange);}
.vc-name{font-size:13px;font-weight:500;color:var(--dark);}
.vc-meta{font-size:11px;color:var(--mid);margin-top:1px;}
.vc-prod-badge{font-size:9px;font-weight:600;background:var(--orange);color:white;padding:2px 7px;border-radius:999px;white-space:nowrap;margin-left:auto;}
.variants-grid{display:flex;flex-direction:column;gap:6px;}

/* ── AI CHAT ── */
.ai-panel{display:flex;flex-direction:column;gap:10px;}
.ai-msgs{display:flex;flex-direction:column;gap:8px;max-height:200px;overflow-y:auto;}
.ai-msg{padding:8px 12px;border-radius:var(--r-md);font-size:13px;line-height:1.5;}
.ai-msg.user{background:var(--lab-light);color:var(--lab);margin-left:20%;}
.ai-msg.bot{background:var(--cream);color:var(--dark);margin-right:20%;}
.ai-input-row{display:flex;gap:8px;}
.ai-input{flex:1;background:var(--cream);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 12px;font-family:inherit;font-size:13px;color:var(--dark);outline:none;resize:none;}
.ai-input:focus{border-color:var(--lab);background:var(--white);}
.ai-sugg{background:var(--lab-light);border:1px solid var(--lab-border);border-radius:var(--r-md);padding:10px 14px;font-size:12px;color:var(--lab);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

/* ── VOICE ── */
.voice-panel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.voice-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--cream);font-family:inherit;font-size:13px;color:var(--mid);cursor:pointer;transition:all 0.15s;}
.voice-btn:hover{background:var(--sage-light);color:var(--sage-dark);}
.voice-btn.recording{background:var(--orange);color:white;border-color:var(--orange);}
.voice-note{font-size:12px;color:var(--mid);background:var(--cream);border-radius:var(--r-md);padding:8px 12px;flex:1;}

/* ── LOAD ── */
.load-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.load-tab{padding:8px 16px;border-radius:var(--r-sm);border:1px solid var(--border);background:transparent;font-family:inherit;font-size:13px;font-weight:500;color:var(--mid);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:6px;}
.load-tab:hover{background:var(--sage-light);border-color:var(--sage);}
.load-tab.active{background:var(--dark);color:white;border-color:var(--dark);}
.load-area{border:2px dashed var(--border);border-radius:var(--r-lg);padding:32px;text-align:center;cursor:pointer;transition:all 0.15s;background:var(--cream);}
.load-area:hover{border-color:var(--sage);background:var(--sage-light);}
.load-area.dragover{border-color:var(--orange);background:var(--orange-light);}
.load-text-area{width:100%;background:var(--cream);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;font-family:inherit;font-size:13px;color:var(--dark);outline:none;resize:vertical;min-height:120px;line-height:1.6;}
.load-text-area:focus{border-color:var(--sage);}
.load-url-input{width:100%;background:var(--cream);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;font-family:inherit;font-size:13px;color:var(--dark);outline:none;}
.load-url-input:focus{border-color:var(--sage);}

/* ── PREVIEW ── */
.preview-ing-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(44,44,42,0.06);}
.preview-ing-name{flex:1;font-size:13px;color:var(--dark);}
.preview-ing-qty{width:80px;background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:4px 7px;font-family:'DM Mono',monospace;font-size:13px;color:var(--dark);outline:none;text-align:right;}
.preview-ing-unit{background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:12px;color:var(--mid);outline:none;cursor:pointer;}
.preview-steps{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
.preview-step{font-size:13px;color:var(--dark);padding:6px 10px;background:var(--cream);border-radius:var(--r-sm);line-height:1.5;}

/* ── HOME ── */
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.home-card{background:var(--white);border-radius:var(--r-xl);border:1px solid var(--border);padding:22px;cursor:pointer;transition:all 0.18s;box-shadow:var(--shadow);}
.home-card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,0.1);}
.home-card.lab{background:linear-gradient(135deg,var(--lab) 0%,#3D6B5A 100%);color:white;border-color:transparent;}
.home-card.prod{background:linear-gradient(135deg,#8B4513 0%,var(--orange) 100%);color:white;border-color:transparent;}
.home-card-icon{font-size:28px;margin-bottom:10px;display:block;}
.home-card-title{font-size:16px;font-weight:600;margin-bottom:4px;}
.home-card-sub{font-size:12px;opacity:0.7;}
.home-card.lab .home-card-sub,.home-card.prod .home-card-sub{color:rgba(255,255,255,0.7);}
.last-recipe{background:var(--white);border-radius:var(--r-xl);border:1px solid var(--border);padding:22px;box-shadow:var(--shadow);}
.archive-list{display:flex;flex-direction:column;gap:1px;}
.archive-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-radius:var(--r-md);transition:background 0.1s;}
.archive-item:hover{background:var(--cream);}
.archive-emoji{width:36px;height:36px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.archive-name{font-size:14px;font-weight:500;color:var(--dark);}
.archive-meta{font-size:11px;color:var(--mid);margin-top:1px;}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(44,44,42,0.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
.modal{background:var(--white);border-radius:var(--r-xl);padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.2);}
.modal-title{font-size:17px;font-weight:600;margin-bottom:4px;}
.modal-sub{font-size:13px;color:var(--mid);margin-bottom:18px;}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.form-label{font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--mid);}
.form-input{background:var(--cream);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 12px;font-family:inherit;font-size:14px;color:var(--dark);outline:none;transition:border-color 0.12s;}
.form-input:focus{border-color:var(--sage);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:white;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,0.25);animation:toastIn 0.2s ease;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

/* ── VALIDATE ── */
.validate-bar{background:var(--lab-light);border:1px solid var(--lab-border);border-radius:var(--r-lg);padding:14px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(44,74,62,0.1);}
.validate-input{flex:1;min-width:180px;background:var(--white);border:1px solid var(--lab-border);border-radius:var(--r-sm);padding:8px 12px;font-family:inherit;font-size:13px;color:var(--dark);outline:none;}
.validate-input:focus{border-color:var(--lab);}
.validate-label{font-size:12px;color:var(--lab);font-weight:500;}

/* ── LISTS ── */
.recipe-list-view{display:flex;flex-direction:column;}
.recipe-list-header{padding:16px 20px 10px;font-size:12px;font-weight:600;color:var(--mid);text-transform:uppercase;letter-spacing:0.06em;}
.recipe-list-item{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--border);cursor:pointer;background:var(--white);transition:background 0.1s;}
.recipe-list-item:first-of-type{border-radius:var(--r-lg) var(--r-lg) 0 0;}
.recipe-list-item:last-of-type{border-bottom:none;border-radius:0 0 var(--r-lg) var(--r-lg);}
.recipe-list-item:only-of-type{border-radius:var(--r-lg);}
.recipe-list-item:hover{background:var(--cream);}
.rli-emoji{width:40px;height:40px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.rli-name{font-size:14px;font-weight:500;color:var(--dark);}
.rli-meta{font-size:11px;color:var(--mid);margin-top:2px;}
.rli-badge{font-size:9px;font-weight:600;padding:2px 7px;border-radius:999px;}
.rli-badge-lab{background:var(--lab-light);color:var(--lab);}
.rli-badge-prod{background:var(--orange-light);color:var(--orange);}

/* ── VARIANT SIDEBAR ── */
.variant-sidebar{display:flex;flex-direction:column;gap:1px;margin-top:4px;}
.vsb-btn{display:flex;align-items:center;gap:7px;width:100%;padding:5px 9px 5px 20px;border:none;border-radius:var(--r-sm);background:transparent;font-family:inherit;font-size:11px;color:var(--dark);cursor:pointer;text-align:left;transition:background 0.1s;}
.vsb-btn:hover{background:var(--cream);}
.vsb-btn.active{background:var(--orange-light);color:var(--orange);font-weight:500;}
.vsb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.vsb-dot.prod{background:var(--orange);}
.vsb-dot.other{background:var(--sage);}

/* ── MOBILE ── */
.bottom-nav{display:none;}
.mobile-only{display:none;}
@media(max-width:768px){
  .shell{grid-template-columns:1fr;grid-template-rows:52px 1fr 56px;}
  .sidebar{display:none;}
  .bottom-nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--white);border-top:1px solid var(--border);position:fixed;bottom:0;left:0;right:0;height:56px;z-index:50;}
  .bnav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;font-family:inherit;font-size:10px;font-weight:500;color:var(--mid);cursor:pointer;transition:color 0.15s;}
  .bnav-btn.active{color:var(--orange);}
  .bnav-btn.active-lab{color:var(--lab);}
  .bnav-btn i{font-size:20px;}
  .main{padding:14px;padding-bottom:70px;}
  .home-grid{grid-template-columns:1fr;}
  .media-grid{grid-template-columns:1fr;}
  .mobile-only{display:block;}
  .desktop-only{display:none;}
  .scaling-row{gap:6px;}
  .scale-input,.scale-total{width:76px;font-size:13px;}
  .form-row{grid-template-columns:1fr;}
  .ing-table{font-size:12px;}
}
</style>
</head>
<body>
<div class="shell" id="app">
  <div class="topbar">
    <div class="logo">Khub <span class="logo-tag">Kitchen Hub</span></div>
    <div class="mode-switcher" id="mode-switcher" style="display:none">
      <button class="mode-btn" id="btn-mode-lab"><i class="ti ti-flask"></i> LAB</button>
      <button class="mode-btn" id="btn-mode-prod"><i class="ti ti-settings-2"></i> Produzione</button>
    </div>
  </div>
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<script>
'use strict';
// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
const S = {
  view: 'home',      // home | lab-list | prod-list | recipe | load | preview
  mode: 'lab',       // lab | produzione
  recipes: [],
  selectedId: null,
  selectedVariantId: null,
  loadTab: 'foto',   // foto | testo | link | video
  loadText: '',
  loadUrl: '',
  loadImageB64: null,
  loadImagePreviewUrl: null,
  loadVideoUrl: '',
  loadPreview: null,
  showModal: false,
  showValidateBar: false,
  pendingVariantName: '',
  toast: null,
  aiMsgs: {},
  aiSugg: null,
  recording: false,
  mediaRecorder: null,
  voiceNotes: {},
  isLoading: false,
};

const UNITS = ['g','ml','kg','l','n','tbsp','tsp','cl'];
const CAT_EMOJI = {Dolci:'🍰',Basi:'🧱',Salato:'🍳',Altro:'📋'};

// ══════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════
function R(id){return S.recipes.find(r=>r.id===id);}
function curLab(recipe){return recipe&&recipe.labVersions[recipe.currentLabIdx||0];}
function uid(){return 'id'+Date.now()+Math.random().toString(36).slice(2,7);}
function cnum(n){return isNaN(parseFloat(n))?0:parseFloat(n);}

let _saveTimer={};
function autosave(id){
  if(_saveTimer[id])clearTimeout(_saveTimer[id]);
  _saveTimer[id]=setTimeout(()=>{
    const r=S.recipes.find(x=>x.id===id);
    if(r)saveToSupabase(r);
  },1500);
}

function upRec(id,fn){
  S.recipes=S.recipes.map(r=>r.id===id?fn({...r}):r);
  render();
  autosave(id);
}
function upLab(id,fn){
  upRec(id,r=>{
    const lv=r.labVersions.map((v,i)=>i===(r.currentLabIdx||0)?fn({...v,ingredients:[...v.ingredients]}):v);
    return{...r,labVersions:lv};
  });
}

let _toastTimer=null;
function toast(msg,icon='ti-check'){
  S.toast={msg,icon};render();
  if(_toastTimer)clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>{S.toast=null;render();},2800);
}

// ══════════════════════════════════════════════════════════
// SUPABASE
// ══════════════════════════════════════════════════════════
async function loadFromSupabase(){
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({supabaseAction:'load'})});
    const data=await res.json();
    if(!data.recipes||!Array.isArray(data.recipes))return;
    S.recipes=data.recipes.map(r=>{
      const rVariants=(data.variants||[]).filter(v=>v.recipe_id===r.id);
      const labVersions=rVariants.filter(v=>v.status==='lab').map(v=>({
        id:v.id,label:v.label||v.name||'Versione 1',note:v.note||'',
        portionsCount:v.portions_count||4,gramsPerPortion:v.grams_per_portion||200,
        ingredients:(data.ingredients||[]).filter(i=>i.variant_id===v.id).sort((a,b)=>a.sort_order-b.sort_order).map(i=>({
          id:i.id,name:i.name,qty:parseFloat(i.qty)||0,unit:i.unit||'g',
          isSubRecipe:i.is_sub_recipe||false,subRecipeId:i.sub_recipe_id||null,
        })),
        steps:parseSteps(v.steps),
        mediaUrl:v.media_url||null,
        videoUrl:v.video_url||null,
      }));
      const validatedVariants=rVariants.filter(v=>v.status==='validated').map(v=>({
        id:v.id,name:v.name||v.label||'Variante',validatedAt:v.validated_at?new Date(v.validated_at).toLocaleDateString('it-IT'):'',
        portionsCount:v.portions_count||4,gramsPerPortion:v.grams_per_portion||200,
        ingredients:(data.ingredients||[]).filter(i=>i.variant_id===v.id).sort((a,b)=>a.sort_order-b.sort_order).map(i=>({
          id:i.id,name:i.name,qty:parseFloat(i.qty)||0,unit:i.unit||'g',
        })),
        steps:parseSteps(v.steps),
        mediaUrl:v.media_url||null,
        videoUrl:v.video_url||null,
      }));
      return{
        id:r.id,name:r.name,category:r.category||'Altro',department:r.department||'Cucina',
        productionVariantId:r.production_variant_id||null,
        labVersions:labVersions.length>0?labVersions:[makeDefaultLab(r.id)],
        validatedVariants,
        currentLabIdx:0,
        mediaUrl:r.media_url||null,
        videoUrl:r.video_url||null,
      };
    });
    if(S.recipes.length>0&&!S.selectedId)S.selectedId=S.recipes[0].id;
  }catch(e){console.error('Load error',e);}
}

function parseSteps(raw){
  if(!raw)return[];
  if(Array.isArray(raw))return raw;
  try{const p=JSON.parse(raw);return Array.isArray(p)?p:[];}catch(e){return[];}
}

function makeDefaultLab(recipeId){
  return{id:'lv_'+uid(),label:'Versione 1',note:'',portionsCount:4,gramsPerPortion:200,ingredients:[],steps:[],mediaUrl:null,videoUrl:null};
}

async function saveToSupabase(recipe){
  try{
    const recipeData={
      id:recipe.id,name:recipe.name,category:recipe.category,department:recipe.department||'Cucina',
      production_variant_id:recipe.productionVariantId||null,
      media_url:recipe.mediaUrl||null,video_url:recipe.videoUrl||null,
    };
    const allVariants=[];
    const allIngredients=[];
    recipe.labVersions.forEach(v=>{
      allVariants.push({
        id:v.id,recipe_id:recipe.id,name:v.label,label:v.label,note:v.note||'',
        status:'lab',portions_count:v.portionsCount,grams_per_portion:v.gramsPerPortion,
        steps:JSON.stringify(v.steps||[]),
        media_url:v.mediaUrl||null,video_url:v.videoUrl||null,
      });
      (v.ingredients||[]).forEach((ing,idx)=>{
        allIngredients.push({
          id:ing.id||uid(),variant_id:v.id,
          name:ing.name,qty:parseFloat(ing.qty)||0,unit:ing.unit||'g',
          is_sub_recipe:ing.isSubRecipe||false,sub_recipe_id:ing.subRecipeId||null,
          sort_order:idx,
        });
      });
    });
    recipe.validatedVariants.forEach(vv=>{
      allVariants.push({
        id:vv.id,recipe_id:recipe.id,name:vv.name,label:vv.name,note:'',
        status:'validated',portions_count:vv.portionsCount,grams_per_portion:vv.gramsPerPortion,
        steps:JSON.stringify(vv.steps||[]),
        validated_at:new Date().toISOString(),
        media_url:vv.mediaUrl||null,video_url:vv.videoUrl||null,
      });
      (vv.ingredients||[]).forEach((ing,idx)=>{
        allIngredients.push({
          id:ing.id||uid(),variant_id:vv.id,
          name:ing.name,qty:parseFloat(ing.qty)||0,unit:ing.unit||'g',
          is_sub_recipe:false,sub_recipe_id:null,
          sort_order:idx,
        });
      });
    });
    await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      supabaseAction:'save',data:{recipe:recipeData,variants:allVariants,ingredients:allIngredients}
    })});
  }catch(e){console.error('Save error',e);}
}

async function deleteRecipe(id){
  const recipe=R(id);
  if(!recipe||!confirm(`Eliminare "${recipe.name}"?`))return;
  S.recipes=S.recipes.filter(r=>r.id!==id);
  if(S.selectedId===id){S.selectedId=S.recipes[0]?.id||null;}
  S.view=S.recipes.length>0?'home':'load';
  render();
  await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({supabaseAction:'delete',table:'recipes',id})});
  toast('Ricetta eliminata','ti-trash');
}

async function deleteVariant(recipeId,variantId){
  const recipe=R(recipeId);
  const vv=recipe&&recipe.validatedVariants.find(v=>v.id===variantId);
  if(!vv||!confirm(`Eliminare la variante "${vv.name}"?`))return;
  upRec(recipeId,r=>{
    const newVars=r.validatedVariants.filter(v=>v.id!==variantId);
    const newProdId=r.productionVariantId===variantId?(newVars.length>0?newVars[newVars.length-1].id:null):r.productionVariantId;
    return{...r,validatedVariants:newVars,productionVariantId:newProdId};
  });
  if(S.selectedVariantId===variantId)S.selectedVariantId=null;
  toast('Variante eliminata','ti-trash');
  await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({supabaseAction:'delete',table:'variants',id:variantId})});
}

// ══════════════════════════════════════════════════════════
// IMPORT AI
// ══════════════════════════════════════════════════════════
async function extractRecipe(){
  const type=S.loadTab;
  S.isLoading=true;render();
  try{
    let messages=[];
    const PROMPT=`Estrai la ricetta e rispondi SOLO con JSON valido. Elenca TUTTI gli ingredienti uno per uno con quantità numeriche esatte. Formato: {"name":"nome","category":"Dolci|Salato|Basi|Altro","portionsCount":4,"gramsPerPortion":200,"ingredients":[{"name":"nome","qty":100,"unit":"g"}],"steps":["passo 1"],"subRecipes":[{"name":"Nome Prep","ingredients":[{"name":"nome","qty":100,"unit":"g"}],"steps":["passo"]}]}. Unità: g,ml,kg,l,n,tbsp,tsp,cl. Gli ingredienti nella ricetta principale devono avere quantità reali anche se appartengono a sub-preparazioni.`;

    if(type==='foto'&&S.loadImageB64){
      messages=[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:S.loadImageB64.mediaType,data:S.loadImageB64.data}},
        {type:'text',text:'Estrai la ricetta da questa immagine. '+PROMPT}
      ]}];
    }else if(type==='testo'&&S.loadText.trim()){
      messages=[{role:'user',content:`Estrai la ricetta dal seguente testo. ${PROMPT}\n\nTESTO:\n${S.loadText}`}];
    }else if(type==='link'&&S.loadUrl.trim()){
      let pageText='';
      try{
        const pr=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fetchUrl:S.loadUrl})});
        const pd=await pr.json();
        if(pd.html){const t=document.createElement('div');t.innerHTML=pd.html;t.querySelectorAll('script,style,nav,header,footer,aside').forEach(el=>el.remove());pageText=(t.innerText||t.textContent||'').replace(/\s+/g,' ').trim().slice(0,6000);}
      }catch(e){}
      if(pageText){messages=[{role:'user',content:`Estrai la ricetta dal testo (fonte: ${S.loadUrl}). ${PROMPT}\n\nTESTO:\n${pageText}`}];}
      else{messages=[{role:'user',content:`Estrai la ricetta da questo URL: ${S.loadUrl}. Usa il nome nell\\'URL per dedurre la ricetta. ${PROMPT}`}];}
    }else if(type==='video'&&S.loadVideoUrl.trim()){
      messages=[{role:'user',content:`Analizza questo video/reel di ricetta: ${S.loadVideoUrl}. ${PROMPT}. Estrai ingredienti e procedimento dal titolo, descrizione e contesto del video.`}];
    }else{
      S.isLoading=false;render();
      toast('Inserisci contenuto da importare','ti-alert-circle');return;
    }

    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages})});
    const data=await res.json();
    const text=(data.content||[]).map(c=>c.text||'').join('');
    const clean=text.replace(/```json|```/g,'').trim();
    let parsed;
    try{parsed=JSON.parse(clean);}catch(e){
      S.isLoading=false;render();
      toast('Errore nel parsing della ricetta','ti-alert-circle');return;
    }
    parsed.ingredients=(parsed.ingredients||[]).map((i,idx)=>({
      ...i,id:uid(),isSubRecipe:false,subRecipeId:null,
      qty:parseFloat(i.qty)||0,unit:UNITS.includes(i.unit)?i.unit:'g'
    }));
    parsed.steps=parsed.steps||[];
    parsed.subRecipes=(parsed.subRecipes||[]).map(sr=>({
      ...sr,ingredients:(sr.ingredients||[]).map(i=>({...i,id:uid(),qty:parseFloat(i.qty)||0,unit:UNITS.includes(i.unit)?i.unit:'g'}))
    }));
    S.loadPreview=parsed;
    S.view='preview';
  }catch(e){console.error(e);toast('Errore nell\'estrazione','ti-alert-circle');}
  S.isLoading=false;render();
}

function savePreview(){
  const p=S.loadPreview;if(!p)return;
  const ts=Date.now();
  const mainId='r'+ts;
  const labVersion={
    id:'lv'+ts,label:'Versione 1',note:'Importata',
    portionsCount:parseInt(p.portionsCount)||4,gramsPerPortion:parseFloat(p.gramsPerPortion)||200,
    ingredients:p.ingredients.map(i=>({...i,id:uid()})),
    steps:p.steps||[],mediaUrl:null,videoUrl:null,
  };
  const mainRecipe={
    id:mainId,name:p.name||'Nuova ricetta',category:p.category||'Altro',department:'Cucina',
    productionVariantId:null,validatedVariants:[],currentLabIdx:0,
    labVersions:[labVersion],mediaUrl:null,videoUrl:null,
  };
  const recipesToSave=[mainRecipe];

  // Sub-ricette parallele (senza toccare la ricetta madre)
  if(p.subRecipes&&p.subRecipes.length){
    p.subRecipes.forEach((sr,i)=>{
      const srId='r'+(ts+i+1);
      const srLab={
        id:'lv'+(ts+i+1),label:'Versione 1',note:'Da '+p.name,
        portionsCount:1,gramsPerPortion:sr.ingredients.reduce((s,x)=>s+cnum(x.qty),0)||200,
        ingredients:sr.ingredients.map(x=>({...x,id:uid()})),
        steps:sr.steps||[],mediaUrl:null,videoUrl:null,
      };
      recipesToSave.push({
        id:srId,name:sr.name,category:'Basi',department:'Cucina',
        productionVariantId:null,validatedVariants:[],currentLabIdx:0,
        labVersions:[srLab],mediaUrl:null,videoUrl:null,
      });
    });
  }

  S.recipes=[...S.recipes,...recipesToSave];
  S.selectedId=mainId;
  S.view='recipe';S.mode='lab';
  S.loadPreview=null;S.loadImageB64=null;S.loadImagePreviewUrl=null;
  S.loadText='';S.loadUrl='';S.loadVideoUrl='';
  render();

  setTimeout(()=>{
    recipesToSave.forEach(r=>{
      const fresh=S.recipes.find(x=>x.id===r.id);
      if(fresh)saveToSupabase(fresh);
    });
  },200);
  toast(recipesToSave.length>1?`Salvate ${recipesToSave.length} ricette in LAB`:'Ricetta salvata in LAB','ti-flask');
}

// ══════════════════════════════════════════════════════════
// LAB ACTIONS
// ══════════════════════════════════════════════════════════
function onValidate(){
  const name=S.pendingVariantName.trim();
  if(!name){toast('Dai un nome alla variante','ti-alert-circle');return;}
  const id=S.selectedId;const recipe=R(id);if(!recipe)return;
  const v=curLab(recipe);if(!v)return;
  const nv={
    id:'vv'+Date.now(),name,
    validatedAt:new Date().toLocaleDateString('it-IT'),
    portionsCount:v.portionsCount,gramsPerPortion:v.gramsPerPortion,
    ingredients:v.ingredients.map(i=>({...i,id:i.id||uid()})),
    steps:[...v.steps],
    mediaUrl:v.mediaUrl||null,videoUrl:v.videoUrl||null,
  };
  upRec(id,r=>({
    ...r,
    validatedVariants:[...r.validatedVariants,nv],
    productionVariantId:nv.id,
  }));
  S.pendingVariantName='';S.showValidateBar=false;S.mode='produzione';S.selectedVariantId=nv.id;
  toast(`"${name}" validata e in Produzione!`,'ti-circle-check');
}

function addIngredient(recipeId){
  const nameEl=document.getElementById('new-ing-name');
  const qtyEl=document.getElementById('new-ing-qty');
  const unitEl=document.getElementById('new-ing-unit');
  if(!nameEl||!nameEl.value.trim())return;
  const ing={id:uid(),name:nameEl.value.trim(),qty:parseFloat(qtyEl?.value)||0,unit:unitEl?.value||'g',isSubRecipe:false,subRecipeId:null};
  upLab(recipeId,v=>({...v,ingredients:[...v.ingredients,ing]}));
  nameEl.value='';if(qtyEl)qtyEl.value='';
}

function onIngQty(recipeId,ingId,val){
  upLab(recipeId,v=>({...v,ingredients:v.ingredients.map(i=>i.id===ingId?{...i,qty:parseFloat(val)||0}:i)}));
}
function onIngUnit(recipeId,ingId,val){
  upLab(recipeId,v=>({...v,ingredients:v.ingredients.map(i=>i.id===ingId?{...i,unit:val}:i)}));
}
function onIngName(recipeId,ingId,val){
  upLab(recipeId,v=>({...v,ingredients:v.ingredients.map(i=>i.id===ingId?{...i,name:val}:i)}));
}
function delIngredient(recipeId,ingId){
  upLab(recipeId,v=>({...v,ingredients:v.ingredients.filter(i=>i.id!==ingId)}));
}

function addStep(recipeId){
  upLab(recipeId,v=>({...v,steps:[...v.steps,'']}));
}
function onStepText(recipeId,idx,val){
  upLab(recipeId,v=>{const s=[...v.steps];s[idx]=val;return{...v,steps:s};});
}
function delStep(recipeId,idx){
  upLab(recipeId,v=>({...v,steps:v.steps.filter((_,i)=>i!==idx)}));
}

// Scaling variante in produzione
function onVarPortions(recipeId,varId,val){
  upRec(recipeId,r=>{
    const vv=r.validatedVariants.find(v=>v.id===varId);if(!vv)return r;
    const ratio=parseFloat(val)/vv.portionsCount;
    const newVV={...vv,portionsCount:parseFloat(val),ingredients:vv.ingredients.map(i=>({...i,qty:Math.round(i.qty*ratio*10)/10}))};
    return{...r,validatedVariants:r.validatedVariants.map(v=>v.id===varId?newVV:v)};
  });
}
function onVarGpp(recipeId,varId,val){
  upRec(recipeId,r=>{
    const vv=r.validatedVariants.find(v=>v.id===varId);if(!vv)return r;
    const ratio=parseFloat(val)/vv.gramsPerPortion;
    const newVV={...vv,gramsPerPortion:parseFloat(val),ingredients:vv.ingredients.map(i=>({...i,qty:Math.round(i.qty*ratio*10)/10}))};
    return{...r,validatedVariants:r.validatedVariants.map(v=>v.id===varId?newVV:v)};
  });
}
function onVarIngQty(recipeId,varId,ingId,val){
  upRec(recipeId,r=>{
    const vv=r.validatedVariants.find(v=>v.id===varId);if(!vv)return r;
    const oldIng=vv.ingredients.find(i=>i.id===ingId);if(!oldIng)return r;
    const ratio=parseFloat(val)/(parseFloat(oldIng.qty)||1);
    const newVV={...vv,ingredients:vv.ingredients.map(i=>i.id===ingId?{...i,qty:parseFloat(val)}:{...i,qty:Math.round(i.qty*ratio*10)/10}),gramsPerPortion:Math.round(vv.gramsPerPortion*ratio)};
    return{...r,validatedVariants:r.validatedVariants.map(v=>v.id===varId?newVV:v)};
  });
}

// ══════════════════════════════════════════════════════════
// AI CONSULTANT
// ══════════════════════════════════════════════════════════
async function sendAI(recipeId){
  const inp=document.getElementById('ai-input');
  const msg=inp?.value?.trim();if(!msg)return;
  const recipe=R(recipeId);const v=curLab(recipe);
  S.aiMsgs[recipeId]=[...(S.aiMsgs[recipeId]||[]),{role:'user',text:msg}];
  if(inp)inp.value='';render();
  const sys=`Sei un consulente di cucina professionale. Stai analizzando la ricetta "${recipe.name}". Ingredienti attuali: ${(v?.ingredients||[]).map(i=>i.qty+i.unit+' '+i.name).join(', ')}. Rispondi in modo conciso e pratico. Se suggerisci una modifica a un ingrediente, termina con JSON su riga separata: {"action":"update","ingName":"nome","newQty":100,"newName":"nome opzionale"}`;
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,system:sys,messages:(S.aiMsgs[recipeId]||[]).map(m=>({role:m.role==='user'?'user':'assistant',content:m.text}))})});
    const data=await res.json();
    const text=(data.content||[]).map(c=>c.text||'').join('');
    const lines=text.split('\n');
    let suggLine=null;
    const cleanLines=lines.filter(l=>{if(l.trim().startsWith('{')){try{JSON.parse(l.trim());suggLine=l.trim();return false;}catch(e){}}return true;});
    const cleanText=cleanLines.join('\n').trim();
    S.aiMsgs[recipeId]=[...(S.aiMsgs[recipeId]||[]),{role:'bot',text:cleanText}];
    if(suggLine){try{S.aiSugg=JSON.parse(suggLine);}catch(e){}}
  }catch(e){S.aiMsgs[recipeId]=[...(S.aiMsgs[recipeId]||[]),{role:'bot',text:'Errore. Riprova.'}];}
  render();
}

function applyAISugg(recipeId){
  if(!S.aiSugg)return;
  const sugg=S.aiSugg;S.aiSugg=null;
  upLab(recipeId,v=>({...v,ingredients:v.ingredients.map(i=>i.name.toLowerCase().includes(sugg.ingName?.toLowerCase()||'')?{...i,qty:parseFloat(sugg.newQty)||i.qty,name:sugg.newName||i.name}:i)}));
  toast('Suggerimento applicato','ti-sparkles');
}

// ══════════════════════════════════════════════════════════
// VOICE
// ══════════════════════════════════════════════════════════
async function toggleRecording(recipeId){
  if(S.recording){
    S.mediaRecorder?.stop();S.recording=false;render();return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mr=new MediaRecorder(stream);const chunks=[];
    mr.ondataavailable=e=>chunks.push(e.data);
    mr.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks,{type:'audio/webm'});
      const reader=new FileReader();
      reader.onload=async()=>{
        const b64=reader.result.split(',')[1];
        try{
          const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,messages:[{role:'user',content:[{type:'text',text:'Trascrivi questa nota vocale in italiano. Rispondi solo con il testo trascritto.'},{type:'image',source:{type:'base64',media_type:'audio/webm',data:b64}}]}]})});
          const data=await res.json();
          const text=(data.content||[]).map(c=>c.text||'').join('').trim();
          S.voiceNotes[recipeId]=text||'Nota vocale salvata';
        }catch(e){S.voiceNotes[recipeId]='Nota vocale salvata';}
        render();
      };
      reader.readAsDataURL(blob);
    };
    S.mediaRecorder=mr;mr.start();S.recording=true;render();
  }catch(e){toast('Microfono non disponibile','ti-microphone-off');}
}

function handleMediaUpload(recipeId,file,type){
  const reader=new FileReader();
  reader.onload=e=>{
    const url=e.target.result;
    upRec(recipeId,r=>{
      if(S.mode==='lab'){
        const lv=r.labVersions.map((v,i)=>i===(r.currentLabIdx||0)?{...v,[type==='video'?'videoUrl':'mediaUrl']:url}:v);
        return{...r,labVersions:lv};
      }
      return r;
    });
  };
  reader.readAsDataURL(file);
}

function shareVariant(recipeId,variantId){
  const recipe=R(recipeId);
  const vv=recipe&&recipe.validatedVariants.find(v=>v.id===variantId);
  if(!vv)return;
  const data={n:recipe.name,v:vv.name,p:vv.portionsCount,g:vv.gramsPerPortion,i:vv.ingredients.map(i=>i.name+':'+i.qty+i.unit).join('|'),s:(vv.steps||[]).join('§')};
  const url=window.location.origin+'/khub_mvp.html?share='+btoa(encodeURIComponent(JSON.stringify(data)));
  if(navigator.share){navigator.share({title:recipe.name+' — '+vv.name,url});}
  else{navigator.clipboard.writeText(url).then(()=>toast('Link copiato','ti-link')).catch(()=>prompt('Copia:',url));}
}

function exportPDF(recipeId,variantId){
  const recipe=R(recipeId);
  const vv=recipe&&recipe.validatedVariants.find(v=>v.id===variantId);
  if(!vv)return;
  const tot=vv.ingredients.reduce((s,i)=>s+cnum(i.qty),0);
  const rows=vv.ingredients.map(i=>`<tr><td>${i.name}</td><td style="text-align:right;font-family:monospace">${i.qty} ${i.unit}</td><td style="text-align:right;color:#888;font-family:monospace">${tot>0?(cnum(i.qty)/tot*100).toFixed(1):0}%</td></tr>`).join('');
  const steps=(vv.steps||[]).length?'<h3 style="margin:24px 0 10px">Procedimento</h3><ol>'+vv.steps.map(s=>`<li style="margin-bottom:6px;line-height:1.6">${s}</li>`).join('')+'</ol>':'';
  const h=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${recipe.name} — ${vv.name}</title><style>body{font-family:Georgia,serif;max-width:700px;margin:40px auto;padding:0 20px;color:#222}h1{font-size:26px;margin-bottom:2px}h2{font-size:16px;color:#888;font-weight:normal;margin-top:0}table{width:100%;border-collapse:collapse;margin-top:16px}th{text-align:left;border-bottom:2px solid #333;padding:6px 4px;font-size:12px}td{padding:5px 4px;border-bottom:1px solid #eee;font-size:14px}.meta{color:#888;font-size:12px;margin:8px 0 20px}.badge{background:#C85A1E;color:white;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;margin-left:8px;vertical-align:middle}@media print{body{margin:20px}}</style></head><body><h1>${recipe.name}<span class="badge">${vv.name}</span></h1><div class="meta">Validata il ${vv.validatedAt} · ${vv.portionsCount} porzioni · ${vv.gramsPerPortion}g/porzione</div><table><thead><tr><th>Ingrediente</th><th style="text-align:right">Quantità</th><th style="text-align:right">%</th></tr></thead><tbody>${rows}</tbody></table>${steps}<div style="margin-top:40px;font-size:11px;color:#ccc;border-top:1px solid #eee;padding-top:12px">Generato da Khub</div></body></html>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download=recipe.name.replace(/\s+/g,'_')+'__'+vv.name.replace(/\s+/g,'_')+'.html';a.click();
  toast('PDF pronto','ti-file-type-pdf');
}

function catEmoji(cat){return CAT_EMOJI[cat]||'📋';}

function renderSidebar(){
  const mode=S.mode;
  const mainRecipes=S.recipes.filter(r=>!r.parentRecipeId);
  let html=`<button class="new-btn" id="btn-new-recipe"><i class="ti ti-plus"></i> Nuova ricetta</button>
  <button class="load-btn ${S.view==='load'?'active':''}" id="btn-load-view"><i class="ti ti-upload"></i> Carica ricetta</button>
  <button class="load-btn" id="btn-home" style="margin-bottom:2px"><i class="ti ti-home"></i> Home</button>`;

  if(mode==='lab'){
    html+=`<div class="sec-label">LAB</div>`;
    const labRecipes=mainRecipes.filter(r=>r.labVersions.some(v=>v.ingredients.length>0)||r.labVersions.length>0);
    labRecipes.forEach(r=>{
      const isActive=r.id===S.selectedId&&S.view==='recipe'&&mode==='lab';
      html+=`<button class="recipe-btn ${isActive?'active-lab':''}" data-nav="${r.id}">
        <span style="font-size:14px">${catEmoji(r.category)}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.name}</span>
        <span class="var-count">${r.labVersions.length}</span>
      </button>`;
    });
  }else{
    html+=`<div class="sec-label">Produzione</div>`;
    const prodRecipes=mainRecipes.filter(r=>r.validatedVariants.length>0);
    prodRecipes.forEach(r=>{
      const isActive=r.id===S.selectedId&&S.view==='recipe'&&mode==='produzione';
      html+=`<button class="recipe-btn ${isActive?'active-prod':''}" data-nav="${r.id}">
        <span style="font-size:14px">${catEmoji(r.category)}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.name}</span>
        <span class="var-count">${r.validatedVariants.length}</span>
      </button>`;
      // Varianti in sidebar
      if(isActive&&r.validatedVariants.length>0){
        html+=`<div class="variant-sidebar">`;
        r.validatedVariants.forEach(vv=>{
          const isProd=vv.id===r.productionVariantId;
          const isSelV=vv.id===S.selectedVariantId;
          html+=`<button class="vsb-btn ${isSelV?'active':''}" data-variant="${vv.id}" data-recipe="${r.id}">
            <span class="vsb-dot ${isProd?'prod':'other'}"></span>${vv.name}${isProd?' ★':''}
          </button>`;
        });
        html+=`</div>`;
      }
    });
    if(prodRecipes.length===0){
      html+=`<div style="padding:12px 8px;font-size:12px;color:var(--light)">Nessuna ricetta validata</div>`;
    }
  }
  return html;
}

          <td><select class="ing-unit-select" onchange="onIngUnit('${recipe.id}','${ing.id}',this.value)">${UNITS.map(u=>`<option ${ing.unit===u?'selected':''}>${u}</option>`).join('')}</select></td>
          <td class="ing-pct">${tot>0?(cnum(ing.qty)/tot*100).toFixed(1):0}%</td>
          <td><button onclick="delIngredient('${recipe.id}','${ing.id}')" style="background:none;border:none;cursor:pointer;color:var(--light);font-size:13px;padding:4px;transition:color 0.12s" onmouseover="this.style.color='#c0392b'" onmouseout="this.style.color='var(--light)'"><i class="ti ti-x"></i></button></td>
        </tr>`).join('')}
      </tbody>
    </table>
    <div class="add-ing-row">
      <input class="add-ing-input" id="new-ing-name" placeholder="Nome ingrediente" onkeydown="if(event.key==='Enter')addIngredient('${recipe.id}')">
      <input class="add-ing-input-sm" id="new-ing-qty" type="number" placeholder="Qty">
      <select class="unit-select" id="new-ing-unit">${UNITS.map(u=>`<option>${u}</option>`).join('')}</select>
      <button class="btn btn-outline btn-sm" onclick="addIngredient('${recipe.id}')"><i class="ti ti-plus"></i> Aggiungi</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div class="card-label" style="margin-bottom:0"><i class="ti ti-list-numbers"></i> Procedimento</div>
      <button class="btn btn-outline btn-sm" onclick="addStep('${recipe.id}')"><i class="ti ti-plus"></i> Aggiungi passo</button>
    </div>
    ${v.steps&&v.steps.length?`<div class="steps-list">
      ${v.steps.map((s,i)=>`<div class="step-item">
        <div class="step-num">${i+1}</div>
        <textarea class="step-text" rows="2" onchange="onStepText('${recipe.id}',${i},this.value)">${s}</textarea>
        <button class="step-del" onclick="delStep('${recipe.id}',${i})"><i class="ti ti-x"></i></button>
      </div>`).join('')}
    </div>`:`<div style="font-size:13px;color:var(--light);padding:8px 0">Nessun passo. Clicca "+ Aggiungi passo".</div>`}
  </div>

  <div class="card">
    <div class="card-label"><i class="ti ti-photo-video"></i> Foto e video</div>
    <div class="media-grid">
      <div class="media-slot ${v.mediaUrl?'filled':''}" id="media-foto-slot">
        ${v.mediaUrl?`<img src="${v.mediaUrl}" alt="Foto ricetta"><div style="padding:8px;display:flex;gap:6px"><button class="btn btn-outline btn-sm" onclick="upLab('${recipe.id}',v=>({...v,mediaUrl:null}))"><i class="ti ti-trash"></i></button></div>`:
        `<div class="media-slot-icon"><i class="ti ti-camera"></i></div>
        <div class="media-slot-label">Aggiungi foto</div>
        <div class="media-slot-sub">JPG, PNG, HEIC</div>`}
        <input type="file" id="media-foto-input" accept="image/*" style="display:none">
      </div>
      <div class="media-slot ${v.videoUrl?'filled':''}" id="media-video-slot">
        ${v.videoUrl?`<video src="${v.videoUrl}" controls style="width:100%;height:150px;object-fit:cover;border-radius:calc(var(--r-lg) - 2px)"></video><div style="padding:8px"><button class="btn btn-outline btn-sm" onclick="upLab('${recipe.id}',v=>({...v,videoUrl:null}))"><i class="ti ti-trash"></i></button></div>`:
        `<div class="media-slot-icon"><i class="ti ti-video"></i></div>
        <div class="media-slot-label">Aggiungi video</div>
        <div class="media-slot-sub">MP4, MOV</div>`}
        <input type="file" id="media-video-input" accept="video/*" style="display:none">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-label"><i class="ti ti-robot"></i> Consulente AI</div>
    <div class="ai-panel">
      <div class="ai-msgs" id="ai-msgs">
        ${(S.aiMsgs[recipe.id]||[]).map(m=>`<div class="ai-msg ${m.role}">${m.text}</div>`).join('')}
      </div>
      ${S.aiSugg?`<div class="ai-sugg"><i class="ti ti-sparkles"></i><span>Modifica suggerita: <strong>${S.aiSugg.ingName}</strong> → ${S.aiSugg.newQty}${S.aiSugg.newName?', rinomina in "'+S.aiSugg.newName+'"':''}</span><button class="btn btn-lab btn-sm" onclick="applyAISugg('${recipe.id}')">Applica</button><button class="btn btn-outline btn-sm" onclick="S.aiSugg=null;render()">Ignora</button></div>`:''}
      <div class="ai-input-row">
        <textarea class="ai-input" id="ai-input" rows="2" placeholder="Chiedi consiglio sulla ricetta..."></textarea>
        <button class="btn btn-lab btn-icon" id="btn-send-ai"><i class="ti ti-send"></i></button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-label"><i class="ti ti-microphone"></i> Note vocali</div>
    <div class="voice-panel">
      <button class="voice-btn ${S.recording?'recording':''}" id="btn-voice">
        <i class="ti ti-${S.recording?'player-stop':'microphone'}"></i>
        ${S.recording?'Stop registrazione':'Registra nota'}
      </button>
      ${S.voiceNotes[recipe.id]?`<div class="voice-note">${S.voiceNotes[recipe.id]}</div>`:''}
    </div>
  </div>

  ${recipe.validatedVariants.length>0?`
  <div class="card">
    <div class="card-label"><i class="ti ti-circle-check"></i> Varianti validate (${recipe.validatedVariants.length})</div>
    <div class="variants-grid">
      ${recipe.validatedVariants.map(vv=>{
        const isProd=vv.id===recipe.productionVariantId;
        return `<div class="variant-card ${isProd?'production':''}">
          <div class="vc-dot ${isProd?'production':''}"></div>
          <div style="flex:1"><div class="vc-name">${vv.name}</div><div class="vc-meta">${vv.portionsCount} porz · ${vv.gramsPerPortion}g/porz · ${vv.validatedAt}</div></div>
          ${isProd?'<span class="vc-prod-badge">Produzione</span>':`<button class="btn btn-outline btn-sm" onclick="upRec('${recipe.id}',r=>({...r,productionVariantId:'${vv.id}'}));toast('Variante di produzione aggiornata','ti-check')">→ Prod</button>`}
          <button onclick="deleteVariant('${recipe.id}','${vv.id}')" title="Elimina" style="background:none;border:none;cursor:pointer;color:var(--light);font-size:13px;padding:4px;transition:color 0.12s" onmouseover="this.style.color='#c0392b'" onmouseout="this.style.color='var(--light)'"><i class="ti ti-trash"></i></button>
        </div>`;
      }).join('')}
    </div>
  </div>`:''}`;
}

function renderProdRecipe(recipe){
  const varId=S.selectedVariantId||recipe.productionVariantId||recipe.validatedVariants[0]?.id;
  const vv=recipe.validatedVariants.find(v=>v.id===varId);
  if(!vv)return`<div class="card" style="text-align:center;padding:40px">
    <i class="ti ti-flask" style="font-size:40px;color:var(--light)"></i>
    <div style="margin-top:12px;color:var(--mid)">Nessuna variante validata</div>
    <button class="btn btn-lab" style="margin-top:14px" onclick="S.mode='lab';render()">Vai in LAB</button>
  </div>`;
  const tot=vv.ingredients.reduce((s,i)=>s+cnum(i.qty),0);
  return `
  <div class="prod-header">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
      <div style="flex:1">
        <div class="recipe-name">${recipe.name}</div>
        <div class="recipe-meta">
          <span>${recipe.category}</span>
          <span style="background:rgba(255,255,255,0.2);padding:1px 8px;border-radius:999px;font-weight:600">${vv.name}</span>
          <span>Validata il ${vv.validatedAt}</span>
        </div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm btn-icon" onclick="shareVariant('${recipe.id}','${vv.id}')" title="Condividi"><i class="ti ti-share"></i></button>
        <button class="btn btn-ghost btn-sm btn-icon" onclick="exportPDF('${recipe.id}','${vv.id}')" title="Scarica PDF"><i class="ti ti-file-type-pdf"></i></button>
        <button class="btn btn-ghost btn-sm btn-icon" onclick="deleteVariant('${recipe.id}','${vv.id}')" title="Elimina variante"><i class="ti ti-trash"></i></button>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
      <div class="scale-box">
        <div class="scale-label">Porzioni</div>
        <input class="scale-input" type="number" value="${vv.portionsCount}" onchange="onVarPortions('${recipe.id}','${vv.id}',this.value)">
      </div>
      <div class="scale-box">
        <div class="scale-label">G/Porzione</div>
        <input class="scale-input" type="number" value="${vv.gramsPerPortion}" onchange="onVarGpp('${recipe.id}','${vv.id}',this.value)">
      </div>
      <div class="scale-box">
        <div class="scale-label">Peso totale</div>
        <div class="scale-total">${Math.round(vv.portionsCount*vv.gramsPerPortion)} g</div>
      </div>
    </div>
    <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="S.mode='lab';render()"><i class="ti ti-flask"></i> Vai in LAB</button>
    </div>
  </div>

  <div class="card">
    <div class="card-label"><i class="ti ti-list-details"></i> Ingredienti · Le proporzioni si mantengono</div>
    <table class="ing-table">
      <thead><tr><th>Ingrediente</th><th>Quantità</th><th>Unità</th><th style="text-align:right">%</th></tr></thead>
      <tbody>
        ${vv.ingredients.map(ing=>`
        <tr>
          <td class="ing-name">${ing.name}</td>
          <td><input class="ing-qty-input" type="number" value="${ing.qty}" onchange="onVarIngQty('${recipe.id}','${vv.id}','${ing.id}',this.value)"></td>
          <td><span class="ing-qty-readonly">${ing.unit}</span></td>
          <td class="ing-pct">${tot>0?(cnum(ing.qty)/tot*100).toFixed(1):0}%</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>

  ${vv.steps&&vv.steps.length?`
  <div class="card">
    <div class="card-label"><i class="ti ti-list-numbers"></i> Procedimento</div>
    <div class="steps-list">
      ${vv.steps.map((s,i)=>`<div class="step-item">
        <div class="step-num">${i+1}</div>
        <div class="step-text" style="background:transparent;border-color:transparent">${s}</div>
      </div>`).join('')}
    </div>
  </div>`:''}

  ${vv.mediaUrl||vv.videoUrl?`
  <div class="card">
    <div class="card-label"><i class="ti ti-photo-video"></i> Media</div>
    <div class="media-grid">
      ${vv.mediaUrl?`<div class="media-slot filled"><img src="${vv.mediaUrl}" alt="Foto"></div>`:''}
      ${vv.videoUrl?`<div class="media-slot filled"><video src="${vv.videoUrl}" controls style="width:100%;height:150px;object-fit:cover"></video></div>`:''}
    </div>
  </div>`:''}

  ${recipe.validatedVariants.length>1?`
  <div class="card">
    <div class="card-label"><i class="ti ti-layers"></i> Altre varianti</div>
    <div class="variants-grid">
      ${recipe.validatedVariants.filter(v=>v.id!==vv.id).map(v2=>`
      <div class="variant-card" onclick="S.selectedVariantId='${v2.id}';render()">
        <div class="vc-dot ${v2.id===recipe.productionVariantId?'production':''}"></div>
        <div style="flex:1"><div class="vc-name">${v2.name}</div><div class="vc-meta">${v2.portionsCount} porz · ${v2.gramsPerPortion}g/porz</div></div>
        ${v2.id===recipe.productionVariantId?'<span class="vc-prod-badge">Prod</span>':''}
      </div>`).join('')}
    </div>
  </div>`:''}`;
}

function renderBottomNav(){
  const isHome=S.view==='home';const isLoad=S.view==='load'||S.view==='preview';
  const isLab=S.mode==='lab'&&S.view==='recipe';const isProd=S.mode==='produzione'&&S.view==='recipe';
  return `
    <button class="bnav-btn ${isHome?'active':''}" id="bnav-home"><i class="ti ti-home"></i>Home</button>
    <button class="bnav-btn ${isLoad?'active':''}" id="bnav-load"><i class="ti ti-upload"></i>Carica</button>
    <button class="bnav-btn ${isLab?'active-lab':''}" id="bnav-lab"><i class="ti ti-flask"></i>LAB</button>
    <button class="bnav-btn ${isProd?'active':''}" id="bnav-prod"><i class="ti ti-settings-2"></i>Prod</button>`;
}

function render(){
  // Sidebar
  const sidebar=document.getElementById('sidebar');
  if(sidebar)sidebar.innerHTML=renderSidebar();

  // Mode switcher
  const ms=document.getElementById('mode-switcher');
  if(ms){
    ms.style.display=S.view==='recipe'?'flex':'none';
    const labBtn=document.getElementById('btn-mode-lab');
    const prodBtn=document.getElementById('btn-mode-prod');
    if(labBtn)labBtn.className='mode-btn '+(S.mode==='lab'?'lab-active':'');
    if(prodBtn)prodBtn.className='mode-btn '+(S.mode==='produzione'?'prod-active':'');
  }

  // Main content
  let mainContent='';
  const recipe=S.selectedId?R(S.selectedId):null;
  if(S.view==='home'){mainContent=renderHome();}
  else if(S.view==='load'){mainContent=renderLoad();}
  else if(S.view==='preview'){mainContent=renderPreview();}
  else if(S.view==='recipe'&&recipe){
    mainContent=S.mode==='lab'?renderLabRecipe(recipe):renderProdRecipe(recipe);
  }

  const main=document.getElementById('main');
  if(main)main.innerHTML=mainContent+(S.toast?`<div class="toast"><i class="ti ${S.toast.icon}"></i>${S.toast.msg}</div>`:'');

  // Bottom nav
  const bn=document.getElementById('bottom-nav');
  if(bn)bn.innerHTML=renderBottomNav();

  // Bind events
  bindEvents();
}

function bindEvents(){
  const recipe=S.selectedId?R(S.selectedId):null;

  // Sidebar
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click',()=>{
      S.selectedId=el.dataset.nav;S.view='recipe';S.selectedVariantId=null;render();
    });
  });
  document.querySelectorAll('[data-variant]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      S.selectedId=el.dataset.recipe;S.selectedVariantId=el.dataset.variant;S.view='recipe';S.mode='produzione';render();
    });
  });

  // New recipe
  const btnNew=document.getElementById('btn-new-recipe');
  if(btnNew)btnNew.addEventListener('click',()=>{
    const id='r'+Date.now();
    const lab=makeDefaultLab(id);
    const r={id,name:'Nuova ricetta',category:'Dolci',department:'Cucina',productionVariantId:null,validatedVariants:[],currentLabIdx:0,labVersions:[lab],mediaUrl:null,videoUrl:null};
    S.recipes=[...S.recipes,r];S.selectedId=id;S.view='recipe';S.mode='lab';render();
    saveToSupabase(r);
  });

  // Load button
  const btnLoad=document.getElementById('btn-load-view');
  if(btnLoad)btnLoad.addEventListener('click',()=>{S.view='load';render();});
  const btnHome=document.getElementById('btn-home');
  if(btnHome)btnHome.addEventListener('click',()=>{S.view='home';render();});

  // Home cards
  const homeLab=document.getElementById('home-lab');
  if(homeLab)homeLab.addEventListener('click',()=>{S.mode='lab';S.view=S.selectedId?'recipe':'home';render();});
  const homeProd=document.getElementById('home-prod');
  if(homeProd)homeProd.addEventListener('click',()=>{S.mode='produzione';S.view=S.selectedId?'recipe':'home';render();});
  const homeLoad=document.getElementById('home-load');
  if(homeLoad)homeLoad.addEventListener('click',()=>{S.view='load';render();});
  const homeOpenLab=document.getElementById('home-open-lab');
  if(homeOpenLab)homeOpenLab.addEventListener('click',()=>{S.mode='lab';S.view='recipe';render();});
  const homeOpenProd=document.getElementById('home-open-prod');
  if(homeOpenProd)homeOpenProd.addEventListener('click',()=>{S.mode='produzione';S.view='recipe';render();});

  // Archive items
  document.querySelectorAll('.recipe-list-item[data-nav]').forEach(el=>{
    el.addEventListener('click',()=>{S.selectedId=el.dataset.nav;S.view='recipe';render();});
  });

  // Mode switcher
  const btnLab=document.getElementById('btn-mode-lab');
  if(btnLab)btnLab.addEventListener('click',()=>{S.mode='lab';render();});
  const btnProd=document.getElementById('btn-mode-prod');
  if(btnProd)btnProd.addEventListener('click',()=>{S.mode='produzione';render();});

  // Load tabs
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.addEventListener('click',()=>{S.loadTab=el.dataset.tab;render();});
  });

  // Foto drop area
  const dropArea=document.getElementById('drop-area');
  const fotoInput=document.getElementById('foto-input');
  if(dropArea){
    dropArea.addEventListener('click',()=>fotoInput?.click());
    dropArea.addEventListener('dragover',e=>{e.preventDefault();dropArea.classList.add('dragover');});
    dropArea.addEventListener('dragleave',()=>dropArea.classList.remove('dragover'));
    dropArea.addEventListener('drop',e=>{
      e.preventDefault();dropArea.classList.remove('dragover');
      const file=e.dataTransfer.files[0];if(file)handleLoadImage(file);
    });
  }
  if(fotoInput)fotoInput.addEventListener('change',e=>{if(e.target.files[0])handleLoadImage(e.target.files[0]);});

  // Text / URL / Video inputs
  const textInput=document.getElementById('text-input');
  if(textInput)textInput.addEventListener('input',e=>{S.loadText=e.target.value;});
  const urlInput=document.getElementById('url-input');
  if(urlInput)urlInput.addEventListener('input',e=>{S.loadUrl=e.target.value;});
  const videoInput=document.getElementById('video-input');
  if(videoInput)videoInput.addEventListener('input',e=>{S.loadVideoUrl=e.target.value;});

  // Extract
  const btnExtract=document.getElementById('btn-extract');
  if(btnExtract)btnExtract.addEventListener('click',extractRecipe);

  // Preview
  const btnBackLoad=document.getElementById('btn-back-load');
  if(btnBackLoad)btnBackLoad.addEventListener('click',()=>{S.view='load';render();});
  const btnSavePreview=document.getElementById('btn-save-preview');
  if(btnSavePreview)btnSavePreview.addEventListener('click',()=>{
    // Aggiorna nome e categoria dall'anteprima
    const pn=document.getElementById('prev-name');
    const pc=document.getElementById('prev-cat');
    const pp=document.getElementById('prev-portions');
    const pg=document.getElementById('prev-gpp');
    if(pn&&S.loadPreview)S.loadPreview.name=pn.value||S.loadPreview.name;
    if(pc&&S.loadPreview)S.loadPreview.category=pc.value;
    if(pp&&S.loadPreview)S.loadPreview.portionsCount=parseInt(pp.value)||4;
    if(pg&&S.loadPreview)S.loadPreview.gramsPerPortion=parseFloat(pg.value)||200;
    // Aggiorna ingredienti preview
    document.querySelectorAll('[data-prev-ing]').forEach(el=>{
      const idx=parseInt(el.dataset.prevIng);
      const field=el.dataset.field;
      if(S.loadPreview&&S.loadPreview.ingredients[idx])S.loadPreview.ingredients[idx][field]=el.value;
    });
    savePreview();
  });

  // Validate
  const btnShowValidate=document.getElementById('btn-show-validate');
  if(btnShowValidate)btnShowValidate.addEventListener('click',()=>{S.showValidateBar=true;render();setTimeout(()=>document.getElementById('validate-name')?.focus(),50);});
  const btnValidate=document.getElementById('btn-validate');
  if(btnValidate)btnValidate.addEventListener('click',onValidate);
  const valInput=document.getElementById('validate-name');
  if(valInput)valInput.addEventListener('keydown',e=>{if(e.key==='Enter')onValidate();});

  // AI
  const btnSendAI=document.getElementById('btn-send-ai');
  if(btnSendAI&&recipe)btnSendAI.addEventListener('click',()=>sendAI(recipe.id));
  const aiInput=document.getElementById('ai-input');
  if(aiInput&&recipe)aiInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendAI(recipe.id);}});

  // Voice
  const btnVoice=document.getElementById('btn-voice');
  if(btnVoice&&recipe)btnVoice.addEventListener('click',()=>toggleRecording(recipe.id));

  // Media upload (LAB)
  const mediaFotoSlot=document.getElementById('media-foto-slot');
  const mediaFotoInput=document.getElementById('media-foto-input');
  if(mediaFotoSlot&&!recipe?.labVersions[recipe.currentLabIdx||0]?.mediaUrl){
    mediaFotoSlot.addEventListener('click',()=>mediaFotoInput?.click());
  }
  if(mediaFotoInput&&recipe)mediaFotoInput.addEventListener('change',e=>{if(e.target.files[0])handleMediaUpload(recipe.id,e.target.files[0],'image');});

  const mediaVideoSlot=document.getElementById('media-video-slot');
  const mediaVideoInput=document.getElementById('media-video-input');
  if(mediaVideoSlot&&!recipe?.labVersions[recipe.currentLabIdx||0]?.videoUrl){
    mediaVideoSlot.addEventListener('click',()=>mediaVideoInput?.click());
  }
  if(mediaVideoInput&&recipe)mediaVideoInput.addEventListener('change',e=>{if(e.target.files[0])handleMediaUpload(recipe.id,e.target.files[0],'video');});

  // Bottom nav
  const bnavHome=document.getElementById('bnav-home');
  if(bnavHome)bnavHome.addEventListener('click',()=>{S.view='home';render();});
  const bnavLoad=document.getElementById('bnav-load');
  if(bnavLoad)bnavLoad.addEventListener('click',()=>{S.view='load';render();});
  const bnavLab=document.getElementById('bnav-lab');
  if(bnavLab)bnavLab.addEventListener('click',()=>{S.mode='lab';if(S.selectedId)S.view='recipe';render();});
  const bnavProd=document.getElementById('bnav-prod');
  if(bnavProd)bnavProd.addEventListener('click',()=>{S.mode='produzione';if(S.selectedId)S.view='recipe';render();});

  // Scroll ai msgs
  const aiMsgs=document.getElementById('ai-msgs');
  if(aiMsgs)aiMsgs.scrollTop=aiMsgs.scrollHeight;
}

function handleLoadImage(file){
  const reader=new FileReader();
  reader.onload=e=>{
    S.loadImagePreviewUrl=e.target.result;
    const b64=e.target.result.split(',')[1];
    const mediaType=file.type||'image/jpeg';
    S.loadImageB64={data:b64,mediaType};
    render();
  };
  reader.readAsDataURL(file);
}

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
(async()=>{
  render();
  await loadFromSupabase();
  if(S.recipes.length===0)S.view='load';
  render();
})();
</script>
</body>
</html>
