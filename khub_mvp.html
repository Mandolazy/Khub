function renderPreview(){
  const p=S.loadPreview;if(!p)return'';
  const tot=p.ingredients.reduce((s,i)=>s+cnum(i.qty),0);
  const destinazioneEsistente=S.loadDestinazione==='esistente';
  const schedaScelta=destinazioneEsistente?R(S.loadDestinazioneSchedaId):null;
  return `<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div>
        <div class="card-label" style="margin-bottom:4px"><i class="ti ti-eye"></i> Anteprima ricetta</div>
        <div style="font-size:11px;color:var(--mid)">Controlla la ricetta prima di salvarla</div>
      </div>
      <button class="btn btn-outline btn-sm" id="btn-back-load"><i class="ti ti-arrow-left"></i> Indietro</button>
    </div>
    <div class="form-row" style="margin-bottom:14px">
      <div class="form-group">
        <label class="form-label">Nome ricetta</label>
        <input class="form-input" id="prev-name" value="${p.name||''}">
      </div>
      <div class="form-group">
        <label class="form-label">${destinazioneEsistente?'Categoria della Scheda':'Categoria'}</label>
        ${destinazioneEsistente?
          `<div class="form-input" style="background:var(--cream);color:var(--mid);cursor:not-allowed">${schedaScelta?schedaScelta.category:'—'}</div>`
          :`<select class="form-input" id="prev-cat">
            ${['Dolci','Salato','Basi','Altro'].map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}
          </select>`}
      </div>
    </div>
    <div class="form-row" style="margin-bottom:16px">
      <div class="form-group"><label class="form-label">Porzioni</label><input class="form-input" type="number" id="prev-portions" value="${p.portionsCount||4}"></div>
      <div class="form-group"><label class="form-label">G/Porzione</label><input class="form-input" type="number" id="prev-gpp" value="${p.gramsPerPortion||200}"></div>
    </div>
    <div class="card-label"><i class="ti ti-list-details"></i> Ingredienti (${p.ingredients.length})</div>
    ${p.ingredients.map((ing,idx)=>`
    <div class="preview-ing-row">
      <span class="preview-ing-name">${ing.name}</span>
      <input class="preview-ing-qty" type="number" value="${ing.qty}" data-prev-ing="${idx}" data-field="qty">
      <select class="preview-ing-unit" data-prev-ing="${idx}" data-field="unit">
        ${UNITS.map(u=>`<option ${ing.unit===u?'selected':''}>${u}</option>`).join('')}
      </select>
      <span style="font-size:11px;color:var(--light);min-width:35px;text-align:right">${tot>0?(cnum(ing.qty)/tot*100).toFixed(0):'0'}%</span>
    </div>`).join('')}
    ${p.steps&&p.steps.length?`
    <div class="card-label" style="margin-top:18px"><i class="ti ti-list-numbers"></i> Procedimento</div>
    <div class="preview-steps">
      ${p.steps.map((s,i)=>`<div class="preview-step"><span style="font-weight:600;color:var(--mid);margin-right:6px">${i+1}.</span>${s}</div>`).join('')}
    </div>`:''}
    ${p.subRecipes&&p.subRecipes.length?`
    <div style="margin-top:16px;background:var(--lab-light);border:1px solid var(--lab-border);border-radius:var(--r-md);padding:10px 14px;font-size:12px;color:var(--lab)">
      <i class="ti ti-sparkles"></i> Verranno create anche: <strong>${p.subRecipes.map(s=>s.name).join(', ')}</strong>
    </div>`:''}

    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
      <div class="card-label" style="margin-bottom:10px"><i class="ti ti-folder"></i> Destinazione</div>
      <div style="display:flex;gap:8px;margin-bottom:${destinazioneEsistente?'12px':'0'}">
        <button class="btn ${!destinazioneEsistente?'btn-lab':'btn-outline'} btn-sm" onclick="S.loadDestinazione='nuova';S.loadDestinazioneSchedaId=null;render()">Nuova Scheda</button>
        ${S.recipes.length>0?`<button class="btn ${destinazioneEsistente?'btn-lab':'btn-outline'} btn-sm" onclick="S.loadDestinazione='esistente';render()">Scheda esistente</button>`:''}
      </div>
      ${destinazioneEsistente?`
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">Scegli la Scheda</label>
        <select class="form-input" id="prev-scheda-esistente" onchange="S.loadDestinazioneSchedaId=this.value||null;render()">
          <option value="">— seleziona —</option>
          ${[...S.recipes].sort((a,b)=>a.name.localeCompare(b.name)).map(r=>`<option value="${r.id}" ${S.loadDestinazioneSchedaId===r.id?'selected':''}>${r.name}</option>`).join('')}
        </select>
      </div>`:''}
    </div>

    <div style="margin-top:18px;display:flex;justify-content:flex-end">
      <button class="btn btn-lab" id="btn-save-preview" ${destinazioneEsistente&&!S.loadDestinazioneSchedaId?'disabled':''}>
        <i class="ti ti-flask"></i> ${destinazioneEsistente?'Aggiungi come nuova Ricetta':'Crea Scheda'}
      </button>
    </div>
  </div>`;
}

function renderLabRecipe(recipe){
  const v=curLab(recipe);if(!v)return'';
  const tot=v.ingredients.reduce((s,i)=>s+cnum(i.qty),0);
  const sectionsOpen=ensureLabSectionsOpen(recipe,v);
  return `
  <div class="lab-header">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
      <div style="flex:1">
        <input
          class="recipe-name"
          value="${(v.name||recipe.name).replace(/"/g,'&quot;')}"
          onchange="onLabDraftNameChange('${recipe.id}',this.value)"
          style="background:transparent;border:none;border-bottom:1.5px solid rgba(255,255,255,0.3);color:white;font-family:inherit;font-size:24px;font-weight:600;letter-spacing:-0.5px;width:100%;outline:none;padding:0 0 2px 0;cursor:text;"
          onfocus="this.style.borderBottomColor='white'"
          onblur="this.style.borderBottomColor='rgba(255,255,255,0.3)'"
          title="Clicca per modificare il nome"
        >
        <div class="recipe-meta">
          <span>${recipe.category}</span>
          <span>${v.label}</span>
          <span>${recipe.labVersions.length} bozz${recipe.labVersions.length!==1?'e':'a'} LAB</span>
        </div>
      </div>

    </div>
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
      <div class="scale-box">
        <div class="scale-label">Porzioni</div>
        <input class="scale-input" type="number" value="${v.portionsCount}" onchange="scaleLabPortions('${recipe.id}',this.value)">
      </div>
      <div class="scale-box">
        <div class="scale-label">G/Porzione</div>
        <input class="scale-input" type="number" value="${v.gramsPerPortion}" onchange="scaleLabGpp('${recipe.id}',this.value)">
      </div>
      <div class="scale-box">
        <div class="scale-label">Peso totale</div>
        <div class="scale-total">${Math.round(v.portionsCount*v.gramsPerPortion)} g</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost btn-sm" onclick="duplicaVersioneLAB('${recipe.id}')" title="Duplica bozza LAB corrente"><i class="ti ti-copy"></i> Nuova bozza</button>
      <button class="btn btn-outline btn-sm" id="btn-show-validate" title="Salva questa bozza come Ricetta pronta, senza metterla in produzione"><i class="ti ti-check"></i> Valida</button>
      <button class="btn btn-lab btn-sm" onclick="rendiAttiva('${recipe.id}')" title="Questa bozza migliora la stessa preparazione"><i class="ti ti-refresh"></i> Rendi attiva</button>
      <button class="btn btn-outline btn-sm" onclick="creaSchedaDaLab('${recipe.id}')" title="Questa bozza è una preparazione diversa"><i class="ti ti-sparkles"></i> Crea Scheda</button>
      <button class="btn btn-outline btn-sm" onclick="eliminaBozza('${recipe.id}','${v.id}')" title="Questa bozza non serve più" style="color:#c0392b;border-color:rgba(192,57,43,0.3)"><i class="ti ti-trash"></i></button>
      <button class="btn btn-ghost btn-sm" onclick="openLabFamilyPicker('${recipe.id}')" title="Famiglie di questa Ricetta"><i class="ti ti-tags"></i> Famiglie Ricetta</button>
      ${(()=>{
        const attiveOra=activeVariants(recipe);
        if(attiveOra.length===0)return'';
        const target=attiveOra.length===1?`'${attiveOra[0].id}'`:'null';
        return `<button class="btn btn-ghost btn-sm" onclick="S.mode='produzione';S.selectedVariantId=${target};render()"><i class="ti ti-eye"></i> Vai in Produzione</button>`;
      })()}
      ${recipe.validatedVariants.length>=2?`<button class="btn btn-ghost btn-sm" onclick="S.view='confronto';S.confrontoA=null;S.confrontoB=null;render()"><i class="ti ti-columns"></i> Confronta</button>`:''}
      <button class="btn btn-outline btn-sm" onclick="S.mostraConfrontoOrigine=!S.mostraConfrontoOrigine;render()" title="Cosa è cambiato rispetto a com'era all'inizio"><i class="ti ti-git-compare"></i> Confronta con la Ricetta di partenza</button>
    </div>
  </div>

  ${!S.mostraConfrontoOrigine?'':(()=>{
    if(v.originVariantId===null){
      return `<div class="card" style="margin-top:12px;background:var(--cream)">
        <div style="font-size:13px;color:var(--mid)"><i class="ti ti-info-circle"></i> Questa bozza non ha una Ricetta di partenza: è nata senza una Ricetta attiva già in uso.</div>
      </div>`;
    }
    const origine=findVariantById(v.originVariantId);
    if(!origine){
      return `<div class="card" style="margin-top:12px;background:var(--orange-light)">
        <div style="font-size:13px;color:var(--orange-accessible)"><i class="ti ti-alert-triangle"></i> La Ricetta di partenza non è più disponibile.</div>
      </div>`;
    }
    const risultato=contaVariabiliCambiate(origine.variant.ingredients,v.ingredients);
    if(risultato.numeroIngredientiCoinvolti===0){
      return `<div class="card" style="margin-top:12px;background:var(--sage-light)">
        <div style="font-size:13px;color:var(--sage-dark)"><i class="ti ti-circle-check"></i> Nessuna differenza rispetto a "${origine.variant.name}".</div>
      </div>`;
    }
    const aggiunti=risultato.dettaglio.filter(d=>d.tipo==='aggiunto');
    const rimossi=risultato.dettaglio.filter(d=>d.tipo==='rimosso');
    const modificati=risultato.dettaglio.filter(d=>d.tipo==='modificato');
    return `<div class="card" style="margin-top:12px">
      <div style="font-size:11px;color:var(--light);margin-bottom:10px">Confronto con "${origine.variant.name}" — ${risultato.numeroIngredientiCoinvolti} ingredient${risultato.numeroIngredientiCoinvolti===1?'e coinvolto':'i coinvolti'}</div>
      ${aggiunti.length?`<div style="margin-bottom:10px">
        <div style="font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--sage-dark);margin-bottom:4px">Aggiunti</div>
        ${aggiunti.map(d=>`<div style="font-size:13px;color:var(--dark)">+ ${d.ingName}</div>`).join('')}
      </div>`:''}
      ${rimossi.length?`<div style="margin-bottom:10px">
        <div style="font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#c0392b;margin-bottom:4px">Rimossi</div>
        ${rimossi.map(d=>`<div style="font-size:13px;color:var(--dark);text-decoration:line-through;opacity:0.7">${d.ingName}</div>`).join('')}
      </div>`:''}
      ${modificati.length?`<div>
        <div style="font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--orange-accessible);margin-bottom:4px">Modificati</div>
        ${modificati.map(d=>`<div style="font-size:13px;color:var(--dark)">${d.ingName} <span style="color:var(--mid);font-size:12px">(${d.campi.join(', ')})</span></div>`).join('')}
      </div>`:''}
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
        <button class="btn btn-lab btn-sm" onclick="interpretaModifiche('${recipe.id}')" ${S.interpretazioneLoading?'disabled':''}>
          ${S.interpretazioneLoading?'<i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i> MichelinAI sta osservando…':'<i class="ti ti-chef-hat"></i> Aiutami a interpretare queste modifiche'}
        </button>
        ${(S.interpretazioneModifiche&&S.interpretazioneModifiche.recipeId===recipe.id&&S.interpretazioneModifiche.variantId===v.id)?(()=>{
          const oss=S.interpretazioneModifiche.osservazioni;
          if(oss.length===0){
            return `<div style="margin-top:10px;font-size:13px;color:var(--mid)"><i class="ti ti-circle-check"></i> MichelinAI non ha trovato nulla di rilevante da segnalare su queste modifiche.</div>`;
          }
          const certezzaLabel={fatto_verificato:'Fatto verificato',osservazione_ricorrente:'Osservazione ricorrente',ipotesi:'Ipotesi',dati_insufficienti:'Dati insufficienti'};
          return `<div style="margin-top:10px;display:flex;flex-direction:column;gap:10px">
            ${oss.map(o=>`
              <div style="background:var(--cream);border-radius:var(--r-md);padding:10px 12px">
                <div style="font-size:13px;color:var(--dark);line-height:1.5">${o.osservazione}</div>
                <div style="font-size:11.5px;color:var(--mid);margin-top:4px;font-style:italic">${o.motivo}</div>
                <div style="font-size:10.5px;color:var(--light);margin-top:6px;text-transform:uppercase;letter-spacing:.03em">${certezzaLabel[o.certezza]||o.certezza}</div>
              </div>`).join('')}
          </div>`;
        })():''}
      </div>
    </div>`;
  })()}

  ${recipe.labVersions.length>1?`<div class="lab-version-tabs">
    ${recipe.labVersions.map((lv,i)=>`<button class="lab-vtab ${i===(recipe.currentLabIdx||0)?'active':''}" onclick="upRec('${recipe.id}',r=>({...r,currentLabIdx:${i}}));render()">${lv.label}</button>`).join('')}
  </div>`:''}

  <div class="card">
    <div class="card-label"><i class="ti ti-list-details"></i> Ingredienti</div>
    <table class="ing-table">
      <thead><tr><th>Ingrediente</th><th>Quantità</th><th>Unità</th><th style="text-align:right">%</th><th style="text-align:right;color:var(--sage);font-size:11px">Resa%</th><th></th></tr></thead>
      <tbody>
        ${v.ingredients.map(ing=>{
          const isBrick=ing.isSubRecipe===true;
          const brickInfo=isBrick?findVariantById(ing.subRecipeId):null;
          const rigaPrincipale=`
        <tr${isBrick?' style="background:var(--sage-light)"':''}>
          <td>${isBrick?'<i class="ti ti-brick" style="color:var(--sage-dark);margin-right:5px" title="Mattoncino: questo ingrediente è un\'altra Scheda"></i>':''}<input class="ing-qty-input" style="width:100%;min-width:100px" value="${ing.name}" onchange="onIngName('${recipe.id}','${ing.id}',this.value)"></td>
          <td><input class="ing-qty-input" type="number" value="${ing.qty}" onchange="onIngQty('${recipe.id}','${ing.id}',this.value)"></td>
          <td><select class="ing-unit-select" onchange="onIngUnit('${recipe.id}','${ing.id}',this.value)">${UNITS.map(u=>`<option ${ing.unit===u?'selected':''}>${u}</option>`).join('')}</select></td>
          <td class="ing-pct">${tot>0?(cnum(ing.qty)/tot*100).toFixed(1):0}%</td>
          <td style="text-align:right"><input type="number" min="0" max="500" placeholder="—"
            value="${ing.estimatedYieldPct!=null?ing.estimatedYieldPct:''}"
            onchange="onIngYield('${recipe.id}','${ing.id}',this.value)"
            onblur="onIngYield('${recipe.id}','${ing.id}',this.value)"
            style="width:54px;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 5px;font-family:'DM Mono',monospace;font-size:12px;color:var(--sage);text-align:right;outline:none;"
            onmouseover="this.style.borderColor='var(--border)'"
            onmouseout="this.style.borderColor='transparent'"
            onfocus="this.style.borderColor='var(--sage)'"
            onblur="this.style.borderColor='transparent'"
            title="Resa % (es. 70 = perde il 30%, 200 = raddoppia, 0 = evapora)"
          ></td>
          <td><button onclick="delIngredient('${recipe.id}','${ing.id}')" style="background:none;border:none;cursor:pointer;color:var(--light);font-size:13px;padding:4px;transition:color 0.12s" onmouseover="this.style.color='#c0392b'" onmouseout="this.style.color='var(--light)'"><i class="ti ti-x"></i></button></td>
        </tr>`;
          // Modello delle Schede — dettaglio del mattoncino: solo lettura, mai un input.
          // Se la variante referenziata non esiste più, lo dichiariamo, non nascondiamo il problema.
          const rigaDettaglio=!isBrick?'':(brickInfo?`
        <tr class="mattoncino-detail">
          <td colspan="6" style="background:var(--cream);border-left:3px solid var(--sage);padding:8px 10px 10px 22px">
            <div style="font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--sage-dark);margin-bottom:5px">
              <i class="ti ti-brick"></i> Contenuto di ${brickInfo.recipe.name}${brickInfo.variant.label?' — '+brickInfo.variant.label:''}
            </div>
            <div style="display:flex;flex-direction:column;gap:3px">
              ${(brickInfo.variant.ingredients||[]).map(si=>`
              <div style="font-size:12px;color:var(--mid);display:flex;justify-content:space-between;max-width:360px">
                <span>${si.name}</span><span style="font-family:'DM Mono',monospace;margin-left:12px">${si.qty} ${si.unit}</span>
              </div>`).join('')}
            </div>
          </td>
        </tr>`:`
        <tr class="mattoncino-detail">
          <td colspan="6" style="background:var(--orange-light);border-left:3px solid var(--orange);padding:8px 10px 8px 22px;font-size:12px;color:var(--orange-accessible)">
            <i class="ti ti-alert-triangle"></i> La Scheda o la Ricetta collegata a questo mattoncino non è più disponibile.
          </td>
        </tr>`);
          return rigaPrincipale+rigaDettaglio;
        }).join('')}
      </tbody>
    </table>
    <div class="add-ing-row">
      ${S.addIngMode==='mattoncino'?`
        ${S.addIngSelectedMattoncino?`
          <div class="add-ing-input" style="display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--sage-light);border-color:var(--sage)">
            <span style="font-size:13px;color:var(--sage-dark)"><i class="ti ti-brick"></i> ${S.addIngSelectedMattoncino.recipeName}${S.addIngSelectedMattoncino.variantLabel?' — '+S.addIngSelectedMattoncino.variantLabel:''}</span>
            <button onclick="clearMattoncinoSelection()" style="background:none;border:none;cursor:pointer;color:var(--sage-dark)"><i class="ti ti-x"></i></button>
          </div>
        `:`
          <div style="position:relative;flex:1">
            <input class="add-ing-input" id="new-ing-search" placeholder="Cerca una Scheda validata…" value="${S.addIngSearchQuery}" oninput="onMattonciniSearch(this.value)" style="width:100%">
            ${S.addIngSearchQuery.trim()?(()=>{
              const q=S.addIngSearchQuery.trim().toLowerCase();
              const risultati=getMattonciniDisponibili(recipe.id).filter(m=>
                (m.recipeName+' '+m.variantLabel).toLowerCase().includes(q)
              ).slice(0,8);
              return `<div style="position:absolute;top:100%;left:0;right:0;background:var(--white);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow);z-index:20;max-height:220px;overflow-y:auto;margin-top:4px">
                ${risultati.length===0?`<div style="padding:10px 12px;font-size:13px;color:var(--light)">Nessuna Scheda validata trovata</div>`:
                  risultati.map(m=>`<button class="mattoncino-result" data-recipe-id="${escAttr(m.recipeId)}" data-variant-id="${escAttr(m.variantId)}" data-recipe-name="${escAttr(m.recipeName)}" data-variant-label="${escAttr(m.variantLabel)}" data-category="${escAttr(m.category)}" style="display:block;width:100%;text-align:left;padding:8px 12px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:13px;border-bottom:1px solid var(--border)">
                    <div style="color:var(--dark)">${m.recipeName}${m.variantLabel?' — '+m.variantLabel:''}</div>
                    <div style="font-size:11px;color:var(--light)">${m.category}</div>
                  </button>`).join('')}
              </div>`;
            })():''}
          </div>
        `}
      `:`
        <input class="add-ing-input" id="new-ing-name" placeholder="Nome ingrediente" onkeydown="if(event.key==='Enter')addIngredient('${recipe.id}')">
      `}
      <input class="add-ing-input-sm" id="new-ing-qty" type="number" placeholder="Qty">
      <select class="unit-select" id="new-ing-unit">${UNITS.map(u=>`<option>${u}</option>`).join('')}</select>
      <button class="btn btn-outline btn-sm" onclick="toggleAddIngMode()" title="${S.addIngMode==='mattoncino'?'Torna a ingrediente normale':'Usa una Scheda come ingrediente'}" style="${S.addIngMode==='mattoncino'?'background:var(--sage-light);border-color:var(--sage);color:var(--sage-dark)':''}"><i class="ti ti-brick"></i></button>
      <button class="btn btn-outline btn-sm" onclick="addIngredient('${recipe.id}')"><i class="ti ti-plus"></i> Aggiungi</button>
    </div>
    ${(()=>{
      // Riepilogo peso finito stimato — visibile solo se almeno un ingrediente ha resa definita
      const hasYield=v.ingredients.some(i=>i.estimatedYieldPct!=null);
      if(!hasYield)return'';
      const pesoFinitoTot=v.ingredients.reduce((s,i)=>s+cnum(i.qty)*effectiveYield(i),0);
      const gppStimati=v.portionsCount>0?Math.round(pesoFinitoTot/v.portionsCount):0;
      return `<div style="margin-top:10px;padding:10px 12px;background:var(--cream);border-radius:var(--r-md);border:1px solid var(--border);font-size:12px;color:var(--mid);display:flex;gap:16px;flex-wrap:wrap">
        <span><i class="ti ti-calculator" style="color:var(--sage)"></i> <strong style="color:var(--dark)">Stima peso finito</strong></span>
        <span>Totale: <strong style="color:var(--dark)">${Math.round(pesoFinitoTot)}g</strong></span>
        <span>Porzioni: <strong style="color:var(--dark)">${v.portionsCount}</strong></span>
        <span>G/porzione finiti: <strong style="color:var(--sage)">${gppStimati}g</strong></span>
      </div>`;
    })()}
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div class="card-label" style="margin-bottom:0"><i class="ti ti-list-numbers"></i> Procedimento</div>
      <button class="btn btn-outline btn-sm" onclick="addStep('${recipe.id}')"><i class="ti ti-plus"></i> Aggiungi passo</button>
    </div>
    ${v.steps&&v.steps.length?`<div class="steps-list" id="steps-list-${recipe.id}">
      ${v.steps.map((s,i)=>`<div class="step-item" draggable="true" data-step-idx="${i}" data-recipe="${recipe.id}">
        <button class="step-drag" title="Trascina per riordinare"><i class="ti ti-grip-vertical"></i></button>
        <div class="step-num">${i+1}</div>
        <textarea class="step-text" rows="2" onchange="onStepText('${recipe.id}',${i},this.value)">${s}</textarea>
        <button class="step-del" onclick="delStep('${recipe.id}',${i})"><i class="ti ti-x"></i></button>
      </div>`).join('')}
    </div>`:`<div style="font-size:13px;color:var(--light);padding:8px 0">Nessun passo. Clicca "+ Aggiungi passo".</div>`}
  </div>

  ${recipe.validatedVariants.length>0?`
  <div class="card">
    <div class="card-label"><i class="ti ti-circle-check"></i> Varianti validate (${recipe.validatedVariants.length})</div>
    <div class="variants-grid">
      ${recipe.validatedVariants.map(vv=>{
        const isActive=vv.active===true&&vv.status!=='retired';
        const isRetired=vv.status==='retired';
        return `<div class="variant-card ${isActive?'production':''}">
          <div class="vc-dot ${isActive?'production':'validated'}"></div>
          <div style="flex:1"><div class="vc-name">${vv.name}</div><div class="vc-meta">${vv.portionsCount} porz · ${vv.gramsPerPortion}g/porz · ${vv.validatedAt}</div></div>
          ${isActive?'<span class="vc-prod-badge">Attiva</span>':isRetired?'<span class="vc-prod-badge" style="color:var(--light)">Archiviata</span>':'<span class="vc-prod-badge validated">Pronta</span>'}
          <button onclick="deleteVariant('${recipe.id}','${vv.id}')" title="Elimina" style="background:none;border:none;cursor:pointer;color:var(--light);font-size:13px;padding:4px;transition:color 0.12s" onmouseover="this.style.color='#c0392b'" onmouseout="this.style.color='var(--light)'"><i class="ti ti-trash"></i></button>
        </div>`;
      }).join('')}
    </div>
  </div>`:''}

  <div class="card">
    ${labSectionHeader(recipe.id,'primoConsulto','ti-sparkles','Primo Consulto',sectionsOpen.primoConsulto)}
    ${sectionsOpen.primoConsulto?(()=>{
      const m1Fatto=hasM1(v);
      const chiaveM1=recipe.id+'|'+v.id;
      const staCaricandoQuestaBozza=S.m1Loading&&S.m1LoadingKey===chiaveM1;
      const staCaricandoAltrove=S.m1Loading&&!staCaricandoQuestaBozza;
      const erroreM1=S.m1Error[v.id];
      const testoFresco=S.m1Text[v.id];
      const osservazioniM1=(v.l2Items||[]).filter(x=>x.provenanceType==='m1');
      const legacyPresente=!m1Fatto&&v.primoConsulto;
      if(staCaricandoQuestaBozza){
        return`<div style="display:flex;align-items:center;gap:8px;color:var(--mid);font-size:13px"><i class="ti ti-loader-2"></i> MichelinAI sta analizzando la bozza…</div>`;
      }
      if(m1Fatto){
        const primaOss=osservazioniM1[0];
        const tsM1=primaOss&&primaOss.createdAt?new Date(primaOss.createdAt).toLocaleString('it-IT'):null;
        return`
        <div style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--lab);margin-bottom:${testoFresco||osservazioniM1.length?'12px':'0'}">
          <i class="ti ti-circle-check"></i> Primo Consulto effettuato
        </div>
        ${testoFresco?`<div style="font-size:14px;color:var(--dark);line-height:1.5;white-space:pre-wrap;margin-bottom:${osservazioniM1.length?'12px':'0'}">${testoFresco}</div>`:''}
        ${osservazioniM1.length?`
        <div style="display:flex;flex-direction:column;gap:10px">
          ${!testoFresco?`<div style="font-size:12px;color:var(--mid)">Osservazioni emerse dal Primo Consulto:</div>`:''}
          ${osservazioniM1.map(o=>`
            <div style="border-left:3px solid var(--lab);padding:6px 0 6px 12px">
              <div style="font-size:12px;font-weight:600;color:var(--lab);margin-bottom:2px">${(o.content&&o.content.label)||'Osservazione'}</div>
              <div style="font-size:14px;color:var(--dark);line-height:1.4">${(o.content&&o.content.text)||''}</div>
            </div>
          `).join('')}
        </div>`:(!testoFresco?`<div style="font-size:13px;color:var(--mid)">Nessuna osservazione strutturata registrata.</div>`:'')}
        ${tsM1?`<div style="font-size:11px;color:var(--light);margin-top:10px">Consulto di ${v.label||'questa bozza'} del ${tsM1}</div>`:''}
        `;
      }
      return`
      <div style="display:flex;justify-content:flex-end;margin-bottom:${erroreM1?'10px':'0'}">
        <button class="btn btn-lab btn-sm" ${staCaricandoAltrove?'disabled':''} onclick="runM1('${recipe.id}')">
          <i class="ti ti-sparkles"></i> ${erroreM1?'Riprova Primo Consulto':'Avvia il Primo Consulto'}
        </button>
      </div>
      ${erroreM1?`<div style="font-size:13px;color:#c0392b;margin-bottom:10px"><i class="ti ti-alert-circle"></i> ${erroreM1}</div>`:''}
      <div style="font-size:13px;color:var(--light)">Chiedi a MichelinAI un primo sguardo tecnico su ${v.label||'questa bozza'}.</div>
      ${legacyPresente?`<div style="font-size:11px;color:var(--light);margin-top:6px">Esiste un Primo Consulto legacy per questa bozza (storico, non convertito, non aggiornato).</div>`:''}
      `;
    })():''}
  </div>

  <div class="card">
    ${labSectionHeader(recipe.id,'media','ti-photo-video','Foto e video',sectionsOpen.media)}
    ${sectionsOpen.media?`<div class="media-grid">
      <div class="media-slot ${v.mediaUrl?'filled':''}" id="media-foto-slot">
        ${v.mediaUrl?`<img src="${v.mediaUrl}" alt="Foto ricetta"><div style="padding:8px;display:flex;gap:6px"><button class="btn btn-outline btn-sm" onclick="upLab('${recipe.id}',v=>({...v,mediaUrl:null}))"><i class="ti ti-trash"></i></button></div>`:
        `<div class="media-slot-icon"><i class="ti ti-camera"></i></div>
        <div class="media-slot-label">Aggiungi foto</div>
        <div class="media-slot-sub">JPG, PNG, HEIC</div>`}
        <input type="file" id="media-foto-input" accept="image/*" style="display:none">
      </div>
      <div class="media-slot ${v.videoUrl?'filled':''}" id="media-video-slot">
        ${v.videoUrl?`<video src="${v.videoUrl}" controls style="width:100%;height:150px;object-fit:cover;border-radius:calc(var(--r-lg) - 2px)"></video><div style="padding:8px"><button class="btn btn-outline btn-sm" onclick="upLab('${recipe.id}',v=>({...v,videoUrl:null}))"><i class="ti ti-trash"></i></button></div>`:
        `<div class="media-slot-icon"><i class="ti ti-video"></i></div>
        <div class="media-slot-label">Aggiungi video</div>
        <div class="media-slot-sub">MP4, MOV</div>`}
        <input type="file" id="media-video-input" accept="video/*" style="display:none">
      </div>
    </div>`:''}
  </div>

    <div class="card">
    ${labSectionHeader(recipe.id,'voice','ti-microphone','Note vocali',sectionsOpen.voice)}
    ${sectionsOpen.voice?`<div class="voice-panel">
      <button class="voice-btn ${S.recording?'recording':''}" id="btn-voice">
        <i class="ti ti-${S.recording?'player-stop':'microphone'}"></i>
        ${S.recording?'Stop':'Registra nota'}
      </button>
      ${S.recording?`<div id="voice-preview" style="flex:1;font-size:12px;color:var(--mid);font-style:italic;padding:4px 8px">In ascolto...</div>`:''}
      ${S.pendingVoiceText[recipe.id]?`<div style="width:100%"><div class="voice-note">${S.pendingVoiceText[recipe.id]}</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-outline btn-sm" onclick="voiceToIngredients('${recipe.id}')"><i class="ti ti-list-details"></i> Ingredienti</button><button class="btn btn-outline btn-sm" onclick="voiceToSteps('${recipe.id}')"><i class="ti ti-list-numbers"></i> Procedimento</button><button class="btn btn-outline btn-sm" onclick="voiceToNotes('${recipe.id}')"><i class="ti ti-notebook"></i> Appunti</button><button class="btn btn-outline btn-sm" onclick="voiceClear('${recipe.id}')"><i class="ti ti-x"></i></button></div></div>`:''}
    </div>`:''}
  </div>

    <div class="card">
    ${labSectionHeader(recipe.id,'notes','ti-notebook','Appunti',sectionsOpen.notes)}
    ${sectionsOpen.notes?`<textarea class="note-area" id="recipe-notes-area" placeholder="Appunti, osservazioni, idee per future varianti...">${recipe.notes||''}</textarea>`:''}
  </div>

  <div class="card">
    ${renderYieldAnalysisPanel(recipe,v)}
    ${labSectionHeader(recipe.id,'ai','ti-chef-hat','MichelinAI',sectionsOpen.ai)}
    ${sectionsOpen.ai?(()=>{
      const chiaveBozzaAttuale=recipe.id+'|'+v.id;
      const staRispondendo=S.michelinAILoading&&S.michelinAILoadingKey===chiaveBozzaAttuale;
      return`<div class="ai-panel">
      <div class="ai-input-row">
        <textarea class="ai-input" id="mai-q-input" rows="2" placeholder="Chiedi qualcosa su questa Scheda... (Cmd/Ctrl+Invio per inviare)" ${staRispondendo?'disabled':''}>${S.michelinAIQuestion||''}</textarea>
        <button class="btn btn-lab btn-icon" id="mai-q-send" ${staRispondendo?'disabled':''}><i class="ti ${staRispondendo?'ti-loader-2':'ti-send'}"></i></button>
      </div>
      ${staRispondendo?`<div style="margin-top:10px;font-size:13px;color:var(--mid)"><i class="ti ti-loader-2"></i> MichelinAI sta rispondendo…</div>`:''}
      ${(!staRispondendo&&S.michelinAILastQuestion)?`<div style="margin-top:10px;padding:12px 14px;background:var(--cream);border-radius:var(--r-md)">
        <div style="font-weight:600;font-size:13px;color:var(--dark);margin-bottom:8px"><i class="ti ti-message"></i> ${S.michelinAILastQuestion}</div>
        ${renderRispostaMichelinAI(S.michelinAIRisposta)}
      </div>`:''}
    </div>`;})():''}
  </div>

  <div class="card">
    ${S.confirmDeleteId===recipe.id?
      `<div style="font-size:13px;color:#c0392b;margin-bottom:10px"><i class="ti ti-alert-triangle"></i> Sei sicuro? Questa azione è irreversibile.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm" style="background:#c0392b;color:white" onclick="deleteRecipe('${recipe.id}')"><i class="ti ti-trash"></i> Sì, elimina</button>
        <button class="btn btn-outline btn-sm" onclick="S.confirmDeleteId=null;render()">Annulla</button>
      </div>`:
      `<button onclick="S.confirmDeleteId='${recipe.id}';render()" style="background:none;border:none;cursor:pointer;color:#c0392b;font-family:inherit;font-size:13px;display:flex;align-items:center;gap:6px;padding:0"><i class="ti ti-trash"></i> Elimina questa Scheda</button>`
    }
  </div>`;
}

function renderProdRecipe(recipe){
  const attiveOra=activeVariants(recipe);
  if(!S.selectedVariantId&&attiveOra.length>1){
    // Micro-Step B: 2+ Ricette attive — nessuna aperta arbitrariamente.
    // Selettore minimo, provvisorio: il componente definitivo arriverà con il lavoro di design.
    return `<div class="card" style="padding:24px">
      <div class="card-label" style="margin-bottom:14px"><i class="ti ti-eye"></i> Quale Ricetta attiva vuoi vedere?</div>
      ${attiveOra.map(v=>`<button class="btn btn-outline btn-sm" style="display:block;width:100%;text-align:left;margin-bottom:8px" onclick="S.selectedVariantId='${v.id}';render()">${v.name}</button>`).join('')}
    </div>`;
  }
  // Fase 5: prima variante active:true, fallback alla prima validata
  const varId=S.selectedVariantId||attiveOra[0]?.id||(recipe.validatedVariants.find(v=>v.status!=='retired'))?.id;
  const vv=recipe.validatedVariants.find(v=>v.id===varId);
  if(!vv)return`<div class="card" style="text-align:center;padding:40px">
    <i class="ti ti-flask" style="font-size:40px;color:var(--light)"></i>
    <div style="margin-top:12px;color:var(--mid)">Nessuna Ricetta validata</div>
    <button class="btn btn-lab" style="margin-top:14px" onclick="S.mode='lab';S.selectedVariantId=null;render()">Vai in LAB</button>
  </div>`;
  const tot=vv.ingredients.reduce((s,i)=>s+cnum(i.qty),0);
  // Step 4: peso finito stimato con rese
  const hasYieldProd=vv.ingredients.some(i=>i.estimatedYieldPct!=null);
  const pesoFinitoStimato=hasYieldProd?Math.round(vv.ingredients.reduce((s,i)=>s+cnum(i.qty)*effectiveYield(i),0)):null;
  return `
  <div class="prod-header">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
      <div style="flex:1">
        <div class="recipe-name">${recipe.name}</div>
        <div class="recipe-meta">
          <span>${recipe.category}</span>
          <span style="background:rgba(255,255,255,0.2);padding:1px 8px;border-radius:999px;font-weight:600">${vv.name}</span>
          <span>Validata il ${vv.validatedAt}</span>
        </div>
        ${(()=>{var vfams=S.variantFamilies[vv.id]||[];var famNames=vfams.map(function(fid){var f=S.families.find(function(x){return x.id===fid;});return f?f.name:'';}).filter(Boolean);return famNames.length?`<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">${famNames.map(n=>`<span style="background:rgba(255,255,255,0.15);padding:2px 8px;border-radius:999px;font-size:11px">${n}</span>`).join('')}</div>`:'';})()}
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
      <div class="scale-box">
        <div class="scale-label">Porzioni</div>
        <input class="scale-input" type="number" value="${vv.portionsCount}" onchange="onVarPortions('${recipe.id}','${vv.id}',this.value)">
      </div>
      <div class="scale-box">
        <div class="scale-label">${hasYieldProd?'G/Porz. finiti':'G/Porzione'}</div>
        <input class="scale-input" type="number" value="${vv.gramsPerPortion}" onchange="onVarGpp('${recipe.id}','${vv.id}',this.value)">
      </div>
      <div class="scale-box">
        <div class="scale-label">${hasYieldProd?'Peso finito':'Peso totale'}</div>
        <div class="scale-total">${hasYieldProd?pesoFinitoStimato+'':Math.round(vv.portionsCount*vv.gramsPerPortion)} g</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost btn-sm" onclick="openFamilyManager('${vv.id}')" title="Famiglie di questa Ricetta"><i class="ti ti-tags"></i> Famiglie Ricetta</button>
      <button class="btn btn-ghost btn-sm" onclick="shareVariant('${recipe.id}','${vv.id}')" title="Condividi"><i class="ti ti-share"></i> Condividi</button>
      <button class="btn btn-ghost btn-sm" onclick="exportPDF('${recipe.id}','${vv.id}')" title="Scarica PDF"><i class="ti ti-file-type-pdf"></i> PDF</button>
      <button class="btn btn-ghost-danger btn-sm" style="margin-left:auto" onclick="deleteVariant('${recipe.id}','${vv.id}')" title="Elimina Ricetta"><i class="ti ti-trash"></i> Elimina</button>
    </div>
    <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="S.mode='lab';S.selectedVariantId=null;render()"><i class="ti ti-flask"></i> Vai in LAB</button>
    </div>
  </div>

  <div class="card">
    <div class="card-label"><i class="ti ti-list-details"></i> Ingredienti${hasYieldProd?' · Quantità a crudo da preparare':' · Le proporzioni si mantengono'}</div>
    <table class="ing-table">
      <thead><tr><th>Ingrediente</th><th>Quantità</th><th>Unità</th><th style="text-align:right">%</th></tr></thead>
      <tbody>
        ${vv.ingredients.map(ing=>`
        <tr>
          <td class="ing-name">${ing.name}</td>
          <td><input class="ing-qty-input" type="number" value="${cnum(ing.qty)||''}" onchange="onVarIngQty('${recipe.id}','${vv.id}','${ing.id}',this.value)"></td>
          <td><select class="unit-select" onchange="onVarIngUnit('${recipe.id}','${vv.id}','${ing.id}',this.value)">
            ${['g','ml','kg','l','n','tbsp','tsp','cl'].map(u=>`<option value="${u}" ${ing.unit===u?'selected':''}>${u}</option>`).join('')}
          </select></td>
          <td class="ing-pct">${tot>0?(cnum(ing.qty)/tot*100).toFixed(1):0}%</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>

  ${vv.steps&&vv.steps.length?`
  <div class="card">
    <div class="card-label"><i class="ti ti-list-numbers"></i> Procedimento</div>
    <div class="steps-list">
      ${vv.steps.map((s,i)=>`<div class="step-item">
        <div class="step-num">${i+1}</div>
        <div class="step-text" style="background:transparent;border-color:transparent">${s}</div>
      </div>`).join('')}
    </div>
  </div>`:''}

  ${vv.mediaUrl||vv.videoUrl?`
  <div class="card">
    <div class="card-label"><i class="ti ti-photo-video"></i> Media</div>
    <div class="media-grid">
      ${vv.mediaUrl?`<div class="media-slot filled"><img src="${vv.mediaUrl}" alt="Foto"></div>`:''}
      ${vv.videoUrl?`<div class="media-slot filled"><video src="${vv.videoUrl}" controls style="width:100%;height:150px;object-fit:cover"></video></div>`:''}
    </div>
  </div>`:''}

  ${hasYieldProd?`
  <div style="padding:10px 14px;background:var(--cream);border-radius:var(--r-md);border:1px solid var(--border);font-size:13px;color:var(--mid);margin-bottom:8px">
    <i class="ti ti-check" style="color:var(--sage)"></i>
    Peso finito atteso: <strong style="color:var(--dark)">${pesoFinitoStimato}g</strong>
    <span style="margin-left:8px;font-size:12px">(${vv.portionsCount} porz. × ${Math.round(pesoFinitoStimato/vv.portionsCount)}g)</span>
  </div>`:''}

  ${recipe.validatedVariants.length>1?`
  <div class="card">
    <div class="card-label"><i class="ti ti-layers"></i> Altre varianti</div>
    <div class="variants-grid">
      ${recipe.validatedVariants.filter(v=>v.id!==vv.id).map(v2=>{
        const isActive2=v2.active===true&&v2.status!=='retired';
        const isRetired2=v2.status==='retired';
        return `
      <div class="variant-card" onclick="S.selectedVariantId='${v2.id}';render()">
        <div class="vc-dot ${isActive2?'production':'validated'}"></div>
        <div style="flex:1"><div class="vc-name">${v2.name}</div><div class="vc-meta">${v2.portionsCount} porz · ${v2.gramsPerPortion}g/porz</div></div>
        ${isActive2?'<span class="vc-prod-badge">Attiva</span>':isRetired2?'<span class="vc-prod-badge" style="color:var(--light)">Archiviata</span>':'<span class="vc-prod-badge validated">Pronta</span>'}
      </div>`;}).join('')}
    </div>
  </div>`:''}`;
}

function renderRecipesAll(){
  const recipes=S.recipes.filter(r=>!r.parentRecipeId).sort((a,b)=>a.name.localeCompare(b.name));
  const raTab=S.recipesAllTab||'all';

  const tabsHtml=`<div class="home-tabs" style="margin:0 18px 14px">
    <button class="home-tab ${raTab==='all'?'active-all':''}" id="ratab-all"><i class="ti ti-book-2"></i> Tutte le ricette</button>
    <button class="home-tab ${raTab==='families'?'active-all':''}" id="ratab-families"><i class="ti ti-tags"></i> Famiglie</button>
  </div>`;

  if(raTab==='families'){
    return `<div class="card" style="padding:0;">
      <div style="padding:16px 18px 0">${tabsHtml}</div>
      <div class="recipe-list-header">Famiglie (${S.families.length})</div>
      <div class="home-recipe-list">
        ${S.families.length===0?`<div style="padding:16px;color:var(--mid);font-size:13px">Nessuna famiglia creata. Le famiglie si assegnano alle varianti durante la validazione in LAB.</div>`:''}
        ${S.families.map(f=>{
          var varIds=Object.keys(S.variantFamilies).filter(vid=>S.variantFamilies[vid].includes(f.id));
          return `<div class="home-recipe-item" onclick="S.selectedFamily='${f.id}';S.homeTab='prod';S.view='home';render()">
            <div class="rli-emoji"><i class="ti ti-tag" style="font-size:18px;color:var(--sage)"></i></div>
            <div style="flex:1">
              <div class="rli-name">${f.name}</div>
              <div class="rli-meta">${varIds.length} variant${varIds.length!==1?'i':'e'}</div>
            </div>
            <i class="ti ti-chevron-right" style="color:var(--border);font-size:14px"></i>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  return `<div class="card" style="padding:0;">
    <div style="padding:16px 18px 0">${tabsHtml}</div>
    <div style="padding:0 18px 10px;font-size:12px;font-weight:600;color:var(--mid);text-transform:uppercase;letter-spacing:0.06em">Tutte le ricette (${recipes.length})</div>
    ${recipes.map(r=>{
      const varCount=r.validatedVariants?r.validatedVariants.filter(v=>v.status!=='retired').length:0;
      const hasActive=activeVariants(r).length>0;
      return `<div class="recipe-list-item" data-nav="${r.id}">
        <div class="rli-emoji">${catEmoji(r.category)}</div>
        <div style="flex:1">
          <div class="rli-name">${r.name}</div>
          <div class="rli-meta">${r.category} · ${varCount} variant${varCount!==1?'i':'e'}${hasActive?' · <span style="color:var(--orange);font-weight:500">● Attiva</span>':''}</div>
        </div>
        <i class="ti ti-chevron-right" style="color:var(--border);font-size:14px"></i>
      </div>`;
    }).join('')}
  </div>`;
}

function renderMergePicker(){
  const survivor=R(S.mergeSourceRecipeId);
  if(!survivor)return'';
  const q=(S.mergeSearch||'').trim().toLowerCase();
  const candidati=S.recipes.filter(r=>r.id!==survivor.id&&(!q||r.name.toLowerCase().includes(q)));
  return `<div class="overlay">
    <div class="modal modal-split" style="max-width:460px">
      <div class="modal-scroll">
        <div class="modal-title">Unisci con un'altra Scheda</div>
        <div class="modal-sub">Le Schede scelte verranno assorbite in "<strong>${survivor.name}</strong>": tutte le loro Ricette si spostano qui, e le Schede assorbite vengono eliminate.</div>
        <input class="form-input" placeholder="Cerca una Scheda..." value="${S.mergeSearch||''}" oninput="S.mergeSearch=this.value;render()" style="margin-bottom:12px">
        ${candidati.length===0?`<div style="font-size:13px;color:var(--light)">Nessuna Scheda trovata.</div>`:candidati.map(r=>`
          <label style="display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer">
            <input type="checkbox" ${S.mergeTargetIds.includes(r.id)?'checked':''} onchange="toggleMergeTarget('${r.id}')">
            <span style="font-size:14px;color:var(--dark)">${r.name}</span>
          </label>`).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="cancelMerge()">Annulla</button>
        <button class="btn btn-lab" ${S.mergeTargetIds.length===0?'disabled':''} onclick="proceedToMergeConfirm()">Continua (${S.mergeTargetIds.length})</button>
      </div>
    </div>
  </div>`;
}

function renderMergeConfirm(){
  const survivor=R(S.mergeSourceRecipeId);
  if(!survivor)return'';
  const assorbite=S.mergeTargetIds.map(id=>R(id)).filter(Boolean);
  const conAppunti=assorbite.filter(r=>r.notes&&r.notes.trim());
  return `<div class="overlay">
    <div class="modal modal-split" style="max-width:460px">
      <div class="modal-scroll">
        <div class="modal-title">Conferma unione</div>
        <div class="modal-sub">
          Verranno assorbite in "<strong>${survivor.name}</strong>":<br>
          ${assorbite.map(r=>'— '+r.name).join('<br>')}
          <br><br>Le Schede assorbite verranno eliminate. Le loro Ricette (bozze, pronte, attive, archiviate) si spostano tutte dentro "${survivor.name}", mantenendo i loro dati e collegamenti.
        </div>
        ${conAppunti.length?`<div class="family-picker-title" style="margin-top:6px">Appunti trovati nelle Schede assorbite</div>
          ${conAppunti.map(r=>`
            <div style="margin-bottom:14px;padding:10px 12px;background:var(--cream);border-radius:var(--r-md)">

function createFamilyFromInput(){
  var input=document.getElementById("new-family-input");
  var name=input?input.value.trim():S.pendingNewFamily.trim();
  if(!name)return;
  // Controlla se esiste già
  var existing=S.families.find(function(f){return f.name.toLowerCase()===name.toLowerCase();});
  if(existing){
    if(!S.pendingFamilies.includes(existing.id))S.pendingFamilies=[...S.pendingFamilies,existing.id];
  } else {
    var newFam={id:"fam_"+uid(),name:name};
    S.families=[...S.families,newFam];
    S.pendingFamilies=[...S.pendingFamilies,newFam.id];
    // Salva su Supabase
    fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({supabaseAction:"saveFamily",family:newFam})});
  }
  S.pendingNewFamily="";
  render();
  setTimeout(function(){var inp=document.getElementById("new-family-input");if(inp){inp.value="";inp.focus();}},50);
}

function togglePendingFamily(fid){
  if(S.pendingFamilies.includes(fid)){

}

  const mainRecipes=S.recipes.filter(r=>!r.parentRecipeId);

  // Raggruppamento per categoria della Scheda di appartenenza (cesura

  const perCategoria={};
  righeAttive.forEach(({recipe,variant})=>{

// LAB globale — tutte e sole le Bozze (status:'lab') di tutte le Schede.
// Ogni riga è una Bozza, non una Scheda. Ordinate per contenutoModificatoIl
// (vera ultima modifica editoriale, vedi firmaContenutoBozza) — le legacy
// senza quel dato vanno in fondo, mai una data inventata, mai created_at
// usato come sostituto.
function renderLabGlobale(){
  const mainRecipes=S.recipes.filter(r=>!r.parentRecipeId);
  const tutteLeBozze=[];
  mainRecipes.forEach(r=>{
    (r.labVersions||[]).forEach(v=>{
      tutteLeBozze.push({recipeId:r.id,recipeName:r.name,bozza:v});
    });
  });

  tutteLeBozze.sort((a,b)=>{
    const ta=a.bozza.contenutoModificatoIl,tb=b.bozza.contenutoModificatoIl;
    if(ta&&tb)return new Date(tb)-new Date(ta); // più recente prima
    if(ta&&!tb)return -1; // chi ha un dato tracciato viene sempre prima di chi non ce l'ha
    if(!ta&&tb)return 1;
    return 0; // entrambe senza dato: nessun criterio inventato, ordine stabile
  });

  if(tutteLeBozze.length===0){
    return `<div class="labg-env">
      <div class="labg-title">LAB</div>
      <div class="schede-empty"><i class="ti ti-flask" style="font-size:28px;display:block;margin-bottom:10px"></i>Nessuna Bozza in sviluppo al momento.</div>
    </div>`;
  }

  // Raggruppo per Scheda, nell'ordine di prima apparizione dentro l'array già
  // ordinato per data: il gruppo prende la posizione della sua Bozza più
  // recente, le altre Bozze della stessa Scheda restano comunque con lui
  // (stesso ordinamento sottostante, solo presentazione diversa — v.
  // riferimento Design: "N BOZZE" raggruppato, non un elenco piatto).
  const gruppiMap=new Map();
  const ordineGruppi=[];
  tutteLeBozze.forEach(({recipeId,recipeName,bozza})=>{
    if(!gruppiMap.has(recipeId)){
      gruppiMap.set(recipeId,{recipeId,recipeName,bozze:[]});
      ordineGruppi.push(recipeId);
    }
    gruppiMap.get(recipeId).bozze.push(bozza);
  });
  const gruppi=ordineGruppi.map(id=>gruppiMap.get(id));
  const totBozze=tutteLeBozze.length,totSchede=gruppi.length;

  function formattaData(iso){
    if(!iso)return'NON TRACCIATA';
    const d=new Date(iso);
    const mesi=['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
    const gg=String(d.getDate()).padStart(2,'0'),hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0');
    return `${gg} ${mesi[d.getMonth()]} · ${hh}:${mm}`;
  }

  return `<div class="labg-env">
    <div class="labg-title">LAB</div>
    <div class="labg-count">${totSchede} SCHED${totSchede===1?'A':'E'} · ${totBozze} BOZZ${totBozze===1?'A':'E'}</div>
    ${gruppi.map(g=>`
      <div class="labg-group">
        <div class="labg-group-band">
          <div class="labg-group-nome">${g.recipeName}</div>
          <div class="labg-group-conteggio">${g.bozze.length} BOZZ${g.bozze.length===1?'A':'E'}</div>
        </div>
        <div class="labg-group-body">
          ${g.bozze.map(bozza=>{
            const tracciata=!!bozza.contenutoModificatoIl;
            return `<button class="labg-row" onclick="apriBozzaDalLabGlobale('${g.recipeId}','${bozza.id}')">
              <span class="labg-row-titolo">${bozza.label||bozza.name||'Bozza'}</span>
              <span class="labg-row-data${tracciata?'':' non-tracciata'}">${formattaData(bozza.contenutoModificatoIl)}</span>
            </button>`;
          }).join('')}
        </div>
      </div>`).join('')}
    <div class="labg-fine">FINE ELENCO</div>
  </div>`;
}

// Apertura precisa di una Bozza dal LAB globale: l'indice dentro labVersions
// viene sempre derivato dall'id esatto della Bozza cliccata — mai un .find()
// generico su "la prima disponibile", mai currentLabIdx lasciato invariato.
// Bridge approvato verso la schermata LAB esistente, non ridisegnata qui.
function apriBozzaDalLabGlobale(recipeId,bozzaId){
  const recipe=R(recipeId);
  if(!recipe)return;
  const idx=recipe.labVersions.findIndex(v=>v.id===bozzaId);
  if(idx<0)return; // la Bozza non esiste più (es. validata/rimossa nel frattempo): nessuna apertura arbitraria di un'altra
  S.recipes=S.recipes.map(r=>r.id===recipeId?{...r,currentLabIdx:idx}:r);
  S.selectedId=recipeId;
  S.selectedVariantId=null;
  S.mode='lab';
  S.view='recipe';
  render();
}

function renderBottomNav(){
  // Shell mobile v3 — 3 destinazioni: Produzione, Schede, LAB.
  // MichelinAI e Profilo non sono più destinazioni di navigazione primaria
  // (architettura approvata): il codice delle due schermate resta intatto,
  // solo scollegato da qui. Impostazioni si raggiunge dalla Home.
  const isRicette=S.view==='home'||S.view==='recipes-all'||S.view==='ricetta-madre'||S.view==='ricetta-madre-v2'||S.view==='recipe'||S.view==='confronto'||S.view==='load'||S.view==='preview';
  const isProduzione=S.view==='attive';
  const isLab=S.view==='lab-globale';
  return `
    <button class="bnav-btn ${isProduzione?'active':''}" id="bnav-produzione"><i class="ti ti-tools-kitchen-2"></i>Produzione</button>
    <button class="bnav-btn ${isRicette?'active':''}" id="bnav-ricette"><i class="ti ti-book-2"></i>Schede</button>
    <button class="bnav-btn ${isLab?'active':''}" id="bnav-lab"><i class="ti ti-flask"></i>LAB</button>`;
}

// ══════════════════════════════════════════════════════════
// NAVIGAZIONE (tasto indietro del browser)
// ══════════════════════════════════════════════════════════
// Tiene traccia solo delle dimensioni "di navigazione" dello stato (dove sei,
// non cosa stai digitando). Ogni volta che render() viene chiamato e questo
// sottoinsieme cambia, viene aggiunta una entry nella history del browser,
// così il tasto Indietro torna alla schermata precedente invece di uscire
// dall'app o rompere lo stato.
let _lastNavKey=null;
let _isPopping=false;
let _initDone=false;
function navState(){
  return {
    view:S.view,mode:S.mode,selectedId:S.selectedId,selectedVariantId:S.selectedVariantId,
    homeTab:S.homeTab,recipesAllTab:S.recipesAllTab,selectedFamily:S.selectedFamily
  };
}
function syncHistory(){
  if(_isPopping)return;
  var ns=navState();
  var key=JSON.stringify(ns);
  if(key===_lastNavKey)return;
  if(!_initDone||_lastNavKey===null){history.replaceState(ns,'','');}
  else{history.pushState(ns,'','');}
  _lastNavKey=key;
}
window.addEventListener('popstate',function(e){
  _isPopping=true;
  var ns=e.state;
  if(ns){
    S.view=ns.view;S.mode=ns.mode||'lab';S.selectedId=ns.selectedId||null;
    S.selectedVariantId=ns.selectedVariantId||null;S.homeTab=ns.homeTab||'all';
    S.recipesAllTab=ns.recipesAllTab||'all';S.selectedFamily=ns.selectedFamily||null;
  }else{
    S.view='app-home';S.mode='lab';S.selectedId=null;S.selectedVariantId=null;
    S.homeTab='all';S.recipesAllTab='all';S.selectedFamily=null;
  }
  _lastNavKey=JSON.stringify(navState());
  render();
  _isPopping=false;
});

function render(){
  // Sidebar
  // Search bar
  var sbc=document.getElementById('search-bar-container');
  var sinp=document.getElementById('search-input');
  if(sbc){
    sbc.style.display=S.showSearch?'flex':'none';
    if(S.showSearch&&sinp){
      if(sinp.value!==S.searchQuery)sinp.value=S.searchQuery;
      if(document.activeElement!==sinp)sinp.focus();
    }
  }
  const sidebar=document.getElementById('sidebar');
  const shellEl=document.querySelector('.shell');
  // Su desktop, nascondi la sidebar nelle view che non la usano
  if(sidebar){
    const hideSidebar=S.view==='attive'||S.view==='profilo'||S.view==='load'||S.view==='preview'||S.view==='michelinai-globale'||S.view==='app-home'||S.view==='lab-globale';
    sidebar.style.display=hideSidebar?'none':'';
    if(!hideSidebar)sidebar.innerHTML=renderSidebar();
    else sidebar.innerHTML=''; // mai lasciare contenuto vecchio nascosto: id duplicati (es. btn-new-recipe) rubano il click a quelli visibili altrove
    // Senza questo, con la sidebar rimossa dal flusso il contenuto cadeva per
    // errore nella colonna stretta da 240px pensata per la sidebar, invece di
    // usare lo spazio libero (bug di layout pre-esistente, non introdotto qui).
    if(shellEl)shellEl.classList.toggle('no-sidebar',hideSidebar);
  }
  // app-home è uno schermo a sé (Home v4-B): niente chrome della shell attorno.
  if(shellEl)shellEl.classList.toggle('app-home-active',S.view==='app-home');

  // Mode switcher
  const ms=document.getElementById('mode-switcher');
  if(ms){
    ms.style.display=S.view==='recipe'?'flex':'none';
    const labBtn=document.getElementById('btn-mode-lab');
    const prodBtn=document.getElementById('btn-mode-prod');
    if(labBtn)labBtn.className='mode-btn '+(S.mode==='lab'?'lab-active':'');
    if(prodBtn)prodBtn.className='mode-btn '+(S.mode==='produzione'?'prod-active':'');
  }

  // Main content
  let mainContent='';
  const recipe=S.selectedId?R(S.selectedId):null;
  if(S.showSearch&&S.searchQuery.trim()){
    mainContent=renderSearch(S.searchQuery.trim());
  } else if(S.view==='app-home'){mainContent=renderAppHome();}
  else if(S.view==='home'){mainContent=renderHome();}
  else if(S.view==='load'){mainContent=renderLoad();}
  else if(S.view==='recipes-all'){mainContent=renderRecipesAll();}
  else if(S.view==='preview'){mainContent=renderPreview();}
  else if(S.view==='ricetta-madre-v2'&&recipe){mainContent=renderRicettaMadreV2(recipe);}
  else if(S.view==='confronto'&&recipe){mainContent=renderConfronto(recipe);}
  else if(S.view==='recipe'&&recipe){
    mainContent=S.mode==='lab'?renderLabRecipe(recipe):renderProdRecipe(recipe);
  }
  // Fase 1 — placeholder nuove view
  else if(S.view==='attive'){mainContent=renderAttive();}
  else if(S.view==='profilo'){mainContent=renderProfiloPlaceholder();}
  else if(S.view==='michelinai-globale'){mainContent=renderMichelinAIGlobalePlaceholder();}
  else if(S.view==='lab-globale'){mainContent=renderLabGlobale();}

  const main=document.getElementById('main');
  if(main)main.innerHTML=mainContent+(S.showFamilyPicker?renderFamilyPicker():'')+(S.showMergePicker?renderMergePicker():'')+(S.showMergeConfirm?renderMergeConfirm():'')+(S.showSchedeFamiglie?renderSchedeFamigliePicker():'')+(S.showCondividiStaff?renderCondividiStaffModal():'')+(S.showOnboarding?renderOnboarding():'')+(S.toastAction?renderToastAction():S.toast?`<div class="toast"><i class="ti ${S.toast.icon}"></i>${S.toast.msg}</div>`:'')+renderUnitConversionModal();

  // Bottom nav
  const bn=document.getElementById('bottom-nav');
  if(bn)bn.innerHTML=renderBottomNav();

  // Bind events
  bindEvents();

  syncHistory();
}

function bindEvents(){
  const recipe=S.selectedId?R(S.selectedId):null;

  // Modello delle Schede — risultati ricerca mattoncini
  document.querySelectorAll('.mattoncino-result').forEach(el=>{
    el.addEventListener('click',()=>{
      selectMattoncino(el.dataset.recipeId,el.dataset.variantId,el.dataset.recipeName,el.dataset.variantLabel,el.dataset.category);
    });
  });

  // Sidebar
  document.querySelectorAll('.home-recipe-item[data-nav]').forEach(el=>{
    el.addEventListener('click',()=>{S.selectedId=el.dataset.nav;S.view='ricetta-madre-v2';render();});
  });
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click',()=>{
      S.selectedId=el.dataset.nav;S.view='ricetta-madre-v2';S.selectedVariantId=null;render();
    });
  });
  document.querySelectorAll('[data-variant]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      S.selectedId=el.dataset.recipe;S.selectedVariantId=el.dataset.variant;S.view='recipe';S.mode='produzione';render();
    });
  });

  // New recipe
  const btnNew=document.getElementById('btn-new-recipe');
  if(btnNew)btnNew.addEventListener('click',()=>{
    const id='r'+Date.now();
    const lab=makeDefaultLab(id,'Nuova Scheda');
    const r={id,name:'Nuova Scheda',category:'Dolci',department:'Cucina',validatedVariants:[],currentLabIdx:0,labVersions:[lab],mediaUrl:null,videoUrl:null,notes:''};
    S.recipes=[...S.recipes,r];S.selectedId=id;S.view='recipe';S.mode='lab';render();
    saveToSupabase(r);
  });

  // Load button
  const btnLoad=document.getElementById('btn-load-view');
  if(btnLoad)btnLoad.addEventListener('click',()=>{S.view='load';render();});
  // Sidebar — shell v3, 3 destinazioni
  const sbRicette=document.getElementById('sb-ricette');
  if(sbRicette)sbRicette.addEventListener('click',()=>{S.view='home';render();});
  const sbProduzione=document.getElementById('sb-produzione');
  if(sbProduzione)sbProduzione.addEventListener('click',()=>{S.view='attive';render();});
  const sbLab=document.getElementById('sb-lab');
  if(sbLab)sbLab.addEventListener('click',()=>{S.view='lab-globale';render();});

  // Ricette: sotto-tab Tutte / Famiglie
  const ratabAll=document.getElementById('ratab-all');
  if(ratabAll)ratabAll.addEventListener('click',()=>{S.recipesAllTab='all';render();});
  const ratabFamilies=document.getElementById('ratab-families');
  if(ratabFamilies)ratabFamilies.addEventListener('click',()=>{S.recipesAllTab='families';render();});

  // Home cards
  const homeLab=document.getElementById('home-lab');
  if(homeLab)homeLab.addEventListener('click',()=>{S.mode='lab';S.selectedVariantId=null;S.view=S.selectedId?'recipe':'home';render();});
  const homeProd=document.getElementById('home-prod');
  if(homeProd)homeProd.addEventListener('click',()=>{S.mode='produzione';S.view=S.selectedId?'recipe':'home';render();});
  const btnSearchToggle=document.getElementById('btn-search-toggle');
  if(btnSearchToggle)btnSearchToggle.addEventListener('click',function(){S.showSearch=!S.showSearch;if(S.showSearch)S.view='home';render();});
  var searchInp=document.getElementById('search-input');
  if(searchInp)searchInp.addEventListener('input',function(){S.searchQuery=this.value;render();});
  var searchClose=document.getElementById('search-close-btn');
  if(searchClose)searchClose.addEventListener('click',function(){S.showSearch=false;S.searchQuery='';render();});

  // Archive items
  document.querySelectorAll('.recipe-list-item[data-nav]').forEach(el=>{
    el.addEventListener('click',()=>{S.selectedId=el.dataset.nav;S.view='ricetta-madre-v2';render();});
  });

  // Mode switcher
  const btnLab=document.getElementById('btn-mode-lab');
  if(btnLab)btnLab.addEventListener('click',()=>{S.mode='lab';S.selectedVariantId=null;render();});
  const btnProd=document.getElementById('btn-mode-prod');
  if(btnProd)btnProd.addEventListener('click',()=>{S.mode='produzione';render();});

  // Load tabs
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.addEventListener('click',()=>{S.loadTab=el.dataset.tab;render();});
  });

  // Foto drop area
  const dropArea=document.getElementById('drop-area');
  const fotoInput=document.getElementById('foto-input');
  if(dropArea){
    dropArea.addEventListener('click',()=>fotoInput?.click());
    dropArea.addEventListener('dragover',e=>{e.preventDefault();dropArea.classList.add('dragover');});
    dropArea.addEventListener('dragleave',()=>dropArea.classList.remove('dragover'));
    dropArea.addEventListener('drop',e=>{
      e.preventDefault();dropArea.classList.remove('dragover');
      const file=e.dataTransfer.files[0];if(file)handleLoadImage(file);
    });
  }
  if(fotoInput)fotoInput.addEventListener('change',e=>{if(e.target.files[0])handleLoadImage(e.target.files[0]);});

  // Text / URL / Video inputs
  const textInput=document.getElementById('text-input');
  if(textInput)textInput.addEventListener('input',e=>{S.loadText=e.target.value;});
  const urlInput=document.getElementById('url-input');
  if(urlInput)urlInput.addEventListener('input',e=>{S.loadUrl=e.target.value;});
  const videoInput=document.getElementById('video-input');
  if(videoInput)videoInput.addEventListener('input',e=>{S.loadVideoUrl=e.target.value;});

  // Extract
  const btnExtract=document.getElementById('btn-extract');
  if(btnExtract)btnExtract.addEventListener('click',extractRecipe);

  // Preview
  const btnBackLoad=document.getElementById('btn-back-load');
  if(btnBackLoad)btnBackLoad.addEventListener('click',()=>{S.loadDestinazione='nuova';S.loadDestinazioneSchedaId=null;S.view='load';render();});
  const btnSavePreview=document.getElementById('btn-save-preview');
  if(btnSavePreview)btnSavePreview.addEventListener('click',()=>{
    // Aggiorna nome e categoria dall'anteprima
    const pn=document.getElementById('prev-name');
    const pc=document.getElementById('prev-cat');
    const pp=document.getElementById('prev-portions');
    const pg=document.getElementById('prev-gpp');
    if(pn&&S.loadPreview)S.loadPreview.name=pn.value||S.loadPreview.name;
    if(pc&&S.loadPreview)S.loadPreview.category=pc.value;
    if(pp&&S.loadPreview)S.loadPreview.portionsCount=parseInt(pp.value)||4;
    if(pg&&S.loadPreview)S.loadPreview.gramsPerPortion=parseFloat(pg.value)||200;
    // Aggiorna ingredienti preview
    document.querySelectorAll('[data-prev-ing]').forEach(el=>{
      const idx=parseInt(el.dataset.prevIng);
      const field=el.dataset.field;
      if(S.loadPreview&&S.loadPreview.ingredients[idx])S.loadPreview.ingredients[idx][field]=el.value;
    });
    savePreview();
  });

  // Validate — chiama direttamente onValidate: usa il titolo esistente, nessun nome da chiedere
  const btnShowValidate=document.getElementById('btn-show-validate');
  if(btnShowValidate)btnShowValidate.addEventListener('click',onValidate);

  // "Chiedi a MichelinAI" — Step 3E: shell + collegamento reale.
  // Invio da solo va SEMPRE a capo (comportamento normale di una textarea,
  // fondamentale quando si incolla un testo su più righe). Solo Cmd/Ctrl+Invio
  // invia la domanda — mai un invio anticipato accidentale durante un incolla.
  const maiQInput=document.getElementById('mai-q-input');
  if(maiQInput&&recipe){
    maiQInput.addEventListener('input',()=>{S.michelinAIQuestion=maiQInput.value;}); // sync silenzioso, niente render() a ogni tasto
    maiQInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();chiediMichelinAI(recipe.id);}});
  }
  const maiQSend=document.getElementById('mai-q-send');
  if(maiQSend&&recipe)maiQSend.addEventListener('click',()=>chiediMichelinAI(recipe.id));

  // Voice
  const btnVoice=document.getElementById('btn-voice');
  // Drag & drop steps
  var dragSrcIdx=null;var dragRecipeId=null;
  document.querySelectorAll('.step-item[draggable]').forEach(function(el){
    el.addEventListener('dragstart',function(e){
      dragSrcIdx=parseInt(el.dataset.stepIdx);
      dragRecipeId=el.dataset.recipe;
      e.dataTransfer.effectAllowed='move';
      setTimeout(function(){el.style.opacity='0.4';},0);
    });
    el.addEventListener('dragend',function(){
      el.style.opacity='1';
      document.querySelectorAll('.step-item').forEach(function(x){x.classList.remove('drag-over');});
    });
    el.addEventListener('dragover',function(e){
      e.preventDefault();e.dataTransfer.dropEffect='move';
      document.querySelectorAll('.step-item').forEach(function(x){x.classList.remove('drag-over');});
      el.classList.add('drag-over');
    });
    el.addEventListener('drop',function(e){
      e.preventDefault();
      var toIdx=parseInt(el.dataset.stepIdx);
      if(dragRecipeId&&dragSrcIdx!==null&&dragSrcIdx!==toIdx){
        moveStep(dragRecipeId,dragSrcIdx,toIdx);
      }
      dragSrcIdx=null;dragRecipeId=null;
    });
  });
  var notesArea=document.getElementById('recipe-notes-area');
  if(notesArea&&recipe)notesArea.addEventListener('change',function(){upRec(recipe.id,function(r){return Object.assign({},r,{notes:notesArea.value});});});
  if(btnVoice&&recipe)btnVoice.addEventListener('click',()=>toggleRecording(recipe.id));

  // Media upload (LAB)
  const mediaFotoSlot=document.getElementById('media-foto-slot');
  const mediaFotoInput=document.getElementById('media-foto-input');
  if(mediaFotoSlot&&!recipe?.labVersions[recipe.currentLabIdx||0]?.mediaUrl){
    mediaFotoSlot.addEventListener('click',()=>mediaFotoInput?.click());
  }
  if(mediaFotoInput&&recipe)mediaFotoInput.addEventListener('change',e=>{if(e.target.files[0])handleMediaUpload(recipe.id,e.target.files[0],'image');});

  const mediaVideoSlot=document.getElementById('media-video-slot');
  const mediaVideoInput=document.getElementById('media-video-input');
  if(mediaVideoSlot&&!recipe?.labVersions[recipe.currentLabIdx||0]?.videoUrl){
    mediaVideoSlot.addEventListener('click',()=>mediaVideoInput?.click());
  }
  if(mediaVideoInput&&recipe)mediaVideoInput.addEventListener('change',e=>{if(e.target.files[0])handleMediaUpload(recipe.id,e.target.files[0],'video');});

  // Bottom nav
  // Shell v3 — bind bottom bar a 3 destinazioni
  const bnavRicette=document.getElementById('bnav-ricette');
  if(bnavRicette)bnavRicette.addEventListener('click',()=>{S.view='home';render();});
  const bnavProduzione=document.getElementById('bnav-produzione');
  if(bnavProduzione)bnavProduzione.addEventListener('click',()=>{S.view='attive';render();});
  const bnavLab=document.getElementById('bnav-lab');
  if(bnavLab)bnavLab.addEventListener('click',()=>{S.view='lab-globale';render();});

  // app-home — sei ingressi. Nuova Ricetta/Carica Ricetta riusano gli stessi
  // id (btn-new-recipe/btn-load-view) dei flussi già esistenti: nessuna logica
  // nuova, solo lo stesso pulsante con un'altra etichetta a seconda di dove appare.
  const apphomeProduzione=document.getElementById('apphome-produzione');
  if(apphomeProduzione)apphomeProduzione.addEventListener('click',()=>{S.view='attive';render();});
  const apphomeSchede=document.getElementById('apphome-schede');
  if(apphomeSchede)apphomeSchede.addEventListener('click',()=>{S.view='home';render();});
  const apphomeLab=document.getElementById('apphome-lab');
  if(apphomeLab)apphomeLab.addEventListener('click',()=>{S.view='lab-globale';render();});
  const apphomeImpostazioni=document.getElementById('apphome-impostazioni');
  if(apphomeImpostazioni)apphomeImpostazioni.addEventListener('click',()=>{S.view='profilo';render();});
  // Marchio KHUB — ritorno alla Home da qualunque ambiente
  const khubLogo=document.getElementById('khub-logo');
  if(khubLogo)khubLogo.addEventListener('click',()=>{S.view='app-home';render();});

  // Schede — Filtra/Famiglie (D-POP v2.2): oggi aprono lo stesso pannello,
  // l'unico criterio di filtro reale disponibile è la Famiglia.
  const schedeBtnFiltra=document.getElementById('schede-btn-filtra');
  if(schedeBtnFiltra)schedeBtnFiltra.addEventListener('click',()=>{S.showSchedeFamiglie=true;render();});
  const schedeBtnFamiglie=document.getElementById('schede-btn-famiglie');
  if(schedeBtnFamiglie)schedeBtnFamiglie.addEventListener('click',()=>{S.showSchedeFamiglie=true;render();});

  // Toast action buttons
  if(S.toastAction){
    S.toastAction.actions.forEach(function(a,i){
      var btn=document.getElementById("ta-btn-"+i);
      if(btn)btn.addEventListener("click",function(){S.toastAction=null;a.fn();render();});
    });
  }
}

function handleLoadImage(file){
  const reader=new FileReader();
  reader.onload=e=>{
    S.loadImagePreviewUrl=e.target.result;
    const b64=e.target.result.split(',')[1];
    const mediaType=file.type||'image/jpeg';
    S.loadImageB64={data:b64,mediaType};
    render();
  };
  reader.readAsDataURL(file);
}

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
(async()=>{
  render();
  await loadFromSupabase();
  if(S.recipes.length===0){S.view='load';}
  else{
    // Fase 5: all'avvio non impostiamo più automaticamente la variante di produzione
  }
  checkOnboarding();
  render();
  _initDone=true;
})();
</script>
