// SUPABASE
// ══════════════════════════════════════════════════════════
// Firma deterministica del contenuto editoriale di una Bozza — non crittografica,
// solo stabile e riproducibile. Stesso contenuto → stessa stringa, sempre.
// Usata dal LAB globale (Micro-Step successivo) per ordinare per vera ultima
// modifica. NON ancora agganciata al salvataggio: in attesa della migrazione
// SQL (colonne contenuto_hash/contenuto_modificato_il su Supabase).
function firmaContenutoBozza(v){
  const SEP_CAMPO='\u0001', SEP_ING='\u0002', SEP_BLOCCO='\u0003';
  const ingredienti=(v.ingredients||[]).map(i=>[
    i.name||'',
    i.qty!=null?String(i.qty):'',
    i.unit||'',
    i.isSubRecipe?'1':'0',
    i.subRecipeId||'',
    i.estimatedYieldPct!=null?String(i.estimatedYieldPct):'',
    i.measuredYieldPct!=null?String(i.measuredYieldPct):''
  ].join(SEP_CAMPO)).join(SEP_ING); // ordine preservato, nessun sort: l'ordine è contenuto
  return [
    v.name||'',
    String(v.portionsCount??''),
    String(v.gramsPerPortion??''),
    v.portionUnit||'',
    (v.steps||[]).join(SEP_CAMPO),
    ingredienti,
    v.mediaUrl||'',
    v.videoUrl||''
  ].join(SEP_BLOCCO);
}

async function loadFromSupabase(){
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({supabaseAction:'load'})});
    const data=await res.json();
    if(!data.recipes||!Array.isArray(data.recipes))return;
    // PSL: mapping L2 (Ricetta-scoped) — riusato sia per le Bozze in LAB sia
    // per le Ricette validate/attive, perche' L2 segue la stessa variant.id
    // lungo tutto il lifecycle (D3).
    const mapL2Items=(vid)=>(data.l2_items||[]).filter(x=>x.variant_id===vid).map(x=>({
      id:x.id,operationalState:x.operational_state,decisionState:x.decision_state,
      content:x.content,evidence:x.evidence||null,provenanceType:x.provenance_type,
      sourceL2ItemId:x.source_l2_item_id||null,
      baselineHash:x.baseline_hash,baselineContext:x.baseline_context,
      createdAt:x.created_at||null, // solo lettura/display (es. timestamp M1) — mai reinviato al save, colonna gestita dal DB
    }));
    S.recipes=data.recipes.map(r=>{
      const rVariants=(data.variants||[]).filter(v=>v.recipe_id===r.id);
      const labVersions=rVariants.filter(v=>v.status==='lab').map(v=>({
        id:v.id,label:v.label||v.name||'Bozza 1',name:v.name||r.name,note:v.note||'',
        originVariantId:v.origin_variant_id||null,
        contenutoModificatoIl:v.contenuto_modificato_il||null, // LAB globale (Micro-Step successivo)
        portionsCount:v.portions_count||4,
        gramsPerPortion:v.grams_per_portion||200, // mantenuto per compatibilità
        portionSize:v.grams_per_portion||200,      // Step 1: nuovo nome semantico
        portionUnit:v.portion_unit||'g',           // Step 1: unità porzione
        ingredients:(data.ingredients||[]).filter(i=>i.variant_id===v.id).sort((a,b)=>a.sort_order-b.sort_order).map(i=>({
          id:i.id,name:i.name,qty:parseFloat(i.qty)||0,unit:i.unit||'g',
          isSubRecipe:i.is_sub_recipe||false,subRecipeId:i.sub_recipe_id||null,
          estimatedYieldPct:i.estimated_yield_pct!==undefined&&i.estimated_yield_pct!==null?i.estimated_yield_pct:null, // Step 1: resa stimata
          measuredYieldPct:i.measured_yield_pct!==undefined&&i.measured_yield_pct!==null?i.measured_yield_pct:null,   // Step 1: resa misurata
        })),
        steps:parseSteps(v.steps),
        mediaUrl:v.media_url||null,
        videoUrl:v.video_url||null,
        active:false, // le bozze LAB non sono mai attive (D2: active, non shared, e' la source of truth)
        primoConsulto:v.primo_consulto||null,
        l2Items:mapL2Items(v.id),
        intentionInitial:v.intention_initial||null,intentionCurrent:v.intention_current||null,
        criteriaInitial:v.criteria_initial||null,criteriaCurrent:v.criteria_current||null,
      }));
      const validatedVariants=rVariants.filter(v=>v.status==='validated'||v.status==='retired').map(v=>({
        id:v.id,name:v.name||v.label||'Ricetta',validatedAt:v.validated_at?new Date(v.validated_at).toLocaleDateString('it-IT'):'',
        originVariantId:v.origin_variant_id||null,
        portionsCount:v.portions_count||4,
        gramsPerPortion:v.grams_per_portion||200, // mantenuto per compatibilità
        portionSize:v.grams_per_portion||200,      // Step 1: nuovo nome semantico
        portionUnit:v.portion_unit||'g',           // Step 1: unità porzione
        ingredients:(data.ingredients||[]).filter(i=>i.variant_id===v.id).sort((a,b)=>a.sort_order-b.sort_order).map(i=>({
          id:i.id,name:i.name,qty:parseFloat(i.qty)||0,unit:i.unit||'g',
          estimatedYieldPct:i.estimated_yield_pct!==undefined&&i.estimated_yield_pct!==null?i.estimated_yield_pct:null, // Step 1: resa stimata
          measuredYieldPct:i.measured_yield_pct!==undefined&&i.measured_yield_pct!==null?i.measured_yield_pct:null,   // Step 1: resa misurata
        })),
        steps:parseSteps(v.steps),
        mediaUrl:v.media_url||null,
        videoUrl:v.video_url||null,
        status:v.status||'approved', // Fase 5: legge status da Supabase
        active:v.active!=null ? !!v.active : false, // D2: active e' la source of truth applicativa, non shared
        l2Items:mapL2Items(v.id),
        intentionInitial:v.intention_initial||null,intentionCurrent:v.intention_current||null,
        criteriaInitial:v.criteria_initial||null,criteriaCurrent:v.criteria_current||null,
      }));
      const l3Items=(data.l3_items||[]).filter(x=>x.recipe_id===r.id).map(x=>({
        id:x.id,distilledContent:x.distilled_content,contextConditions:x.context_conditions||null,
        knownLimits:x.known_limits||null,originL2ItemId:x.origin_l2_item_id,supersedesId:x.supersedes_id||null,
      }));
      return{
        id:r.id,name:r.name,category:r.category||'Altro',department:r.department||'Cucina',
        labVersions:labVersions.length>0?labVersions:[makeDefaultLab(r.id,r.name)],
        validatedVariants,
        l3Items,
        currentLabIdx:0,
        mediaUrl:r.media_url||null,
        videoUrl:r.video_url||null,
        notes:r.notes||'',
      };
    });
    if(S.recipes.length>0&&!S.selectedId)S.selectedId=S.recipes[0].id;
    // Carica famiglie
    try{
      const rf=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({supabaseAction:'loadFamilies'})});
      const fd=await rf.json();
      if(fd.families)S.families=fd.families;
      if(fd.variantFamilies){
        S.variantFamilies={};
        fd.variantFamilies.forEach(function(vf){if(!S.variantFamilies[vf.variant_id])S.variantFamilies[vf.variant_id]=[];S.variantFamilies[vf.variant_id].push(vf.family_id);});
      }
    }catch(e){console.error('Load families error',e);}
  }catch(e){console.error('Load error',e);}
}

function parseSteps(raw){
  if(!raw)return[];
  if(Array.isArray(raw))return raw;
  try{const p=JSON.parse(raw);return Array.isArray(p)?p:[];}catch(e){return[];}
}

function makeDefaultLab(recipeId,name){
  return{id:'lv_'+uid(),label:'Bozza 1',name:name||'',note:'',portionsCount:1,gramsPerPortion:0,portionSize:0,portionUnit:'g',ingredients:[],steps:[],mediaUrl:null,videoUrl:null,active:false,originVariantId:null,
    l2Items:[],intentionInitial:null,intentionCurrent:null,criteriaInitial:null,criteriaCurrent:null};
}

async function saveToSupabase(recipe){
  try{
    const recipeData={
      id:recipe.id,name:recipe.name,category:recipe.category,department:recipe.department||'Cucina',
      media_url:recipe.mediaUrl||null,video_url:recipe.videoUrl||null,
      notes:recipe.notes||'',
    };
    const allVariants=[];
    const allIngredients=[];
    const allL2Items=[];
    const pushL2=(items,variantId)=>{
      (items||[]).forEach(l2=>{
        allL2Items.push({
          id:l2.id,variant_id:variantId,
          operational_state:l2.operationalState,decision_state:l2.decisionState,
          content:l2.content,evidence:l2.evidence||null,provenance_type:l2.provenanceType,
          source_l2_item_id:l2.sourceL2ItemId||null,
          baseline_hash:l2.baselineHash,baseline_context:l2.baselineContext,
        });
      });
    };
    recipe.labVersions.forEach(v=>{
      allVariants.push({
        id:v.id,recipe_id:recipe.id,name:v.name||recipe.name,label:v.label,note:v.note||'',
        status:'lab',portions_count:v.portionsCount,grams_per_portion:v.gramsPerPortion,portion_unit:v.portionUnit||'g',
        steps:JSON.stringify(v.steps||[]),
        media_url:v.mediaUrl||null,video_url:v.videoUrl||null,
        primo_consulto:v.primoConsulto||null,
        origin_variant_id:v.originVariantId||null,
        contenuto_hash:firmaContenutoBozza(v),
        // D2: active e' la source of truth applicativa (mai `shared`, che resta
        // legacy non piu' scritto da qui — vedi nota di riconciliazione).
        active:v.active===true,
        intention_initial:v.intentionInitial||null,intention_current:v.intentionCurrent||null,
        criteria_initial:v.criteriaInitial||null,criteria_current:v.criteriaCurrent||null,
      });
      (v.ingredients||[]).forEach((ing,idx)=>{
        allIngredients.push({
          id:ing.id&&ing.id.length>4?ing.id:('li'+Date.now()+Math.random().toString(36).slice(2,7)),variant_id:v.id,
          name:ing.name,qty:parseFloat(ing.qty)||0,unit:ing.unit||'g',
          is_sub_recipe:ing.isSubRecipe||false,sub_recipe_id:ing.subRecipeId||null,
          sort_order:idx,
          estimated_yield_pct:ing.estimatedYieldPct!==undefined&&ing.estimatedYieldPct!==null?ing.estimatedYieldPct:null,
          measured_yield_pct:ing.measuredYieldPct!==undefined&&ing.measuredYieldPct!==null?ing.measuredYieldPct:null,
        });
      });
      pushL2(v.l2Items,v.id);
    });
    recipe.validatedVariants.forEach(vv=>{
      allVariants.push({
        id:vv.id,recipe_id:recipe.id,name:vv.name,label:vv.name,note:'',
        status:vv.status==='retired'?'retired':'validated', // simmetria con la lettura: 'retired' deve sopravvivere al save
        portions_count:vv.portionsCount,grams_per_portion:vv.gramsPerPortion,portion_unit:vv.portionUnit||'g',
        steps:JSON.stringify(vv.steps||[]),
        validated_at:vv.validatedAt?new Date(vv.validatedAt.split('/').reverse().join('-')).toISOString():new Date().toISOString(),
        media_url:vv.mediaUrl||null,video_url:vv.videoUrl||null,
        // D2: scriviamo SOLO active, mai piu' shared — il campo shared resta
        // nel DB come legacy non toccato da questo save, fino alla
        // riconciliazione active<-shared (preparata, non ancora eseguita).
        active:vv.active===true,
        origin_variant_id:vv.originVariantId||null, // D3: sopravvive alle transizioni di lifecycle
        intention_initial:vv.intentionInitial||null,intention_current:vv.intentionCurrent||null,
        criteria_initial:vv.criteriaInitial||null,criteria_current:vv.criteriaCurrent||null,
      });
      (vv.ingredients||[]).forEach((ing,idx)=>{
        allIngredients.push({
          id:ing.id&&ing.id.length>4?ing.id:('vi'+Date.now()+Math.random().toString(36).slice(2,7)),
          variant_id:vv.id,
          name:ing.name,qty:parseFloat(ing.qty)||0,unit:ing.unit||'g',
          is_sub_recipe:false,sub_recipe_id:null,
          sort_order:idx,
          estimated_yield_pct:ing.estimatedYieldPct!==undefined&&ing.estimatedYieldPct!==null?ing.estimatedYieldPct:null,
          measured_yield_pct:ing.measuredYieldPct!==undefined&&ing.measuredYieldPct!==null?ing.measuredYieldPct:null,
        });
      });
      pushL2(vv.l2Items,vv.id);
    });
    const allL3Items=(recipe.l3Items||[]).map(l3=>({
      id:l3.id,recipe_id:recipe.id,
      distilled_content:l3.distilledContent,context_conditions:l3.contextConditions||null,
      known_limits:l3.knownLimits||null,origin_l2_item_id:l3.originL2ItemId,
      supersedes_id:l3.supersedesId||null,
    }));
    const saveRes=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      supabaseAction:'save',data:{recipe:recipeData,variants:allVariants,ingredients:allIngredients,l2Items:allL2Items,l3Items:allL3Items}
    })});
    const saveResult=await saveRes.json();
    if(saveResult&&saveResult.ok===false){
      console.error('[Supabase] errori di salvataggio:',saveResult.errors);
      toast('Alcuni dati potrebbero non essere stati salvati. Controlla la connessione.','ti-alert-circle');
      return false;
    }
    return true;
  }catch(e){console.error('Save error',e);toast('Errore salvataggio: '+e.message,'ti-alert-circle');return false;}
}

async function deleteRecipe(id){
  const recipe=R(id);
  if(!recipe)return;
  // Modello delle Schede — non eliminare una Scheda se una delle sue varianti valide
  // è ancora usata come mattoncino altrove (stessa protezione già costruita per deleteVariant)
  const tuttiIDipendenti=[];
  (recipe.validatedVariants||[]).forEach(vv=>{
    findDependentsOfVariant(vv.id).forEach(d=>{if(d.recipeId!==id)tuttiIDipendenti.push(d);});
  });
  if(tuttiIDipendenti.length){
    const elenco=tuttiIDipendenti.map(d=>'- '+d.recipeName+(d.variantLabel?' — '+d.variantLabel:'')).join('\n');
    alert('Non puoi eliminare "'+recipe.name+'": una sua Ricetta attiva è usata come mattoncino da:\n\n'+elenco+'\n\nRimuovi prima il collegamento da quelle Schede, poi riprova.');
    return;
  }
  if(!confirm(`Eliminare "${recipe.name}"?`))return;
  S.recipes=S.recipes.filter(r=>r.id!==id);
  if(S.selectedId===id){S.selectedId=S.recipes[0]?.id||null;}
  S.view=S.recipes.length>0?'home':'load';
  render();
  await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({supabaseAction:'delete',table:'recipes',id})});
  toast('Scheda eliminata','ti-trash');
}

// ══════════════════════════════════════════════════════════
// Unione Schede — una Scheda superstite assorbe una o più Schede,
// spostando (mai ricreando) tutte le loro Ricette: stessi id, quindi
// nessun collegamento mattoncino/originVariantId si rompe.
// ══════════════════════════════════════════════════════════
function openMergePicker(recipeId){
  S.mergeSourceRecipeId=recipeId;
  S.mergeTargetIds=[];
  S.mergeSearch='';
  S.showMergePicker=true;
  render();
}

function toggleMergeTarget(id){
  const idx=S.mergeTargetIds.indexOf(id);
  if(idx>=0)S.mergeTargetIds.splice(idx,1);
  else S.mergeTargetIds.push(id);
  render();
}

function proceedToMergeConfirm(){
  if(!S.mergeTargetIds.length)return;
  // Le scelte sugli Appunti si preparano solo per le Schede assorbite che ne hanno davvero
  S.mergeNotesChoices={};
  S.mergeTargetIds.forEach(id=>{
    const r=R(id);
    if(r&&r.notes&&r.notes.trim())S.mergeNotesChoices[id]='include';
  });
  S.showMergePicker=false;
  S.showMergeConfirm=true;
  render();
}

function cancelMerge(){
  S.mergeSourceRecipeId=null;S.mergeTargetIds=[];S.mergeNotesChoices={};S.mergeSearch='';
  S.showMergePicker=false;S.showMergeConfirm=false;
  render();
}

async function confirmMerge(){
  const survivorId=S.mergeSourceRecipeId;
  const absorbedIds=[...S.mergeTargetIds];
  const survivor=R(survivorId);
  if(!survivor||!absorbedIds.length)return;

  // 1) Appunti: solo quelli scelti esplicitamente come "include", con provenienza
  let appuntiAggiuntivi='';
  absorbedIds.forEach(id=>{
    const r=R(id);
    if(r&&r.notes&&r.notes.trim()&&S.mergeNotesChoices[id]==='include'){
      appuntiAggiuntivi+=(appuntiAggiuntivi?'\n\n':'')+'Da "'+r.name+'":\n'+r.notes.trim();
    }
  });

  // 2) Famiglie a livello di Scheda (chiave 'lab_'+recipeId): unite senza duplicati,
  // nessun dato deve restare legato all'id di una Scheda che sta per essere eliminata.
  const chiaveSuperstite='lab_'+survivorId;
  const famiglieUnite=new Set(S.variantFamilies[chiaveSuperstite]||[]);
  absorbedIds.forEach(id=>{
    const chiave='lab_'+id;
    (S.variantFamilies[chiave]||[]).forEach(fid=>famiglieUnite.add(fid));
    delete S.variantFamilies[chiave];
  });
  if(famiglieUnite.size>0)S.variantFamilies[chiaveSuperstite]=[...famiglieUnite];

  // 3) Ricette: SPOSTATE, mai ricreate — stessi id, quindi mattoncini/originVariantId/cronologia restano validi
  let labVersionsAggiunte=[];
  let validatedAggiunte=[];
  absorbedIds.forEach(id=>{
    const r=R(id);
    if(!r)return;
    labVersionsAggiunte=labVersionsAggiunte.concat(r.labVersions||[]);
    validatedAggiunte=validatedAggiunte.concat(r.validatedVariants||[]);
  });

  S.recipes=S.recipes.map(r=>r.id!==survivorId?r:{
    ...r,
    labVersions:[...r.labVersions,...labVersionsAggiunte],
    validatedVariants:[...r.validatedVariants,...validatedAggiunte],
    notes:appuntiAggiuntivi?((r.notes&&r.notes.trim())?r.notes+'\n\n':(r.notes||''))+appuntiAggiuntivi:(r.notes||''),
  });

  // 4) Le Schede assorbite, ora vuote, vengono eliminate — client e Supabase
  S.recipes=S.recipes.filter(r=>!absorbedIds.includes(r.id));
  for(const id of absorbedIds){
    await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({supabaseAction:'delete',table:'recipes',id})});
  }

  const updatedSurvivor=R(survivorId);
  if(updatedSurvivor)await saveToSupabase(updatedSurvivor);

  S.selectedId=survivorId;
  S.mergeSourceRecipeId=null;S.mergeTargetIds=[];S.mergeNotesChoices={};S.mergeSearch='';
  S.showMergePicker=false;S.showMergeConfirm=false;
  render();
  toast('Schede unite in "'+(updatedSurvivor?updatedSurvivor.name:'')+'"','ti-git-merge');
}

async function deleteVariant(recipeId,variantId){
  const recipe=R(recipeId);
  const vv=recipe&&recipe.validatedVariants.find(v=>v.id===variantId);
  if(!vv)return;
  // Modello delle Schede — non eliminare una variante ancora usata come mattoncino altrove
  const dipendenti=findDependentsOfVariant(variantId);
  if(dipendenti.length){
    const elenco=dipendenti.map(d=>'- '+d.recipeName+(d.variantLabel?' — '+d.variantLabel:'')).join('\n');
    alert('Non puoi eliminare "'+vv.name+'": è usata come mattoncino da:\n\n'+elenco+'\n\nRimuovi prima il collegamento da quelle Schede, poi riprova.');
    return;
  }
  if(!confirm(`Eliminare la Ricetta "${vv.name}"?`))return;
  upRec(recipeId,r=>({...r,validatedVariants:r.validatedVariants.filter(v=>v.id!==variantId)}));
  if(S.selectedVariantId===variantId)S.selectedVariantId=null;
  toast('Ricetta eliminata','ti-trash');
  await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({supabaseAction:'delete',table:'variants',id:variantId})});
}

async function extractRecipe(){
  const type=S.loadTab;
  S.isLoading=true;render();
  try{
    let messages=[];
    const PROMPT=`Estrai la ricetta e rispondi SOLO con JSON valido. La fonte può essere in qualsiasi lingua (francese, inglese, spagnolo, ecc.): TRADUCI SEMPRE in italiano il nome della ricetta, i nomi degli ingredienti e i passi del procedimento, anche se il testo originale è in un'altra lingua. Converti unità di misura locali (es. cuillère à soupe, cup, oz) nel loro equivalente in g/ml quando possibile. Elenca TUTTI gli ingredienti uno per uno con quantità numeriche esatte. Formato: {"name":"nome","category":"Dolci|Salato|Basi|Altro","portionsCount":4,"gramsPerPortion":200,"ingredients":[{"name":"nome","qty":100,"unit":"g"}],"steps":["passo 1"],"subRecipes":[{"name":"Nome Prep","ingredients":[{"name":"nome","qty":100,"unit":"g"}],"steps":["passo"]}]}. Unità: g,ml,kg,l,n,tbsp,tsp,cl. Gli ingredienti nella ricetta principale devono avere quantità reali anche se appartengono a sub-preparazioni.`;

    if(type==='foto'&&S.loadImageB64){
      messages=[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:S.loadImageB64.mediaType,data:S.loadImageB64.data}},
        {type:'text',text:'Estrai la ricetta da questa immagine. '+PROMPT}
      ]}];
    }else if(type==='testo'&&S.loadText.trim()){
      messages=[{role:'user',content:`Estrai la ricetta dal seguente testo. ${PROMPT}\n\nTESTO:\n${S.loadText}`}];
    }else if(type==='link'&&S.loadUrl.trim()){
      let pageText='';
      try{
        const pr=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fetchUrl:S.loadUrl})});
        const pd=await pr.json();
        if(pd.html){const t=document.createElement('div');t.innerHTML=pd.html;t.querySelectorAll('script,style,nav,header,footer,aside').forEach(el=>el.remove());pageText=(t.innerText||t.textContent||'').replace(/\s+/g,' ').trim().slice(0,6000);}
      }catch(e){}
      if(pageText){messages=[{role:'user',content:`Estrai la ricetta dal testo (fonte: ${S.loadUrl}). ${PROMPT}\n\nTESTO:\n${pageText}`}];}
      else{messages=[{role:'user',content:`Estrai la ricetta da questo URL: ${S.loadUrl}. Usa il nome nell\\'URL per dedurre la ricetta. ${PROMPT}`}];}
    }else if(type==='video'&&S.loadVideoUrl.trim()){
      messages=[{role:'user',content:`Analizza questo video/reel di ricetta: ${S.loadVideoUrl}. ${PROMPT}. Estrai ingredienti e procedimento dal titolo, descrizione e contesto del video.`}];
    }else{
      S.isLoading=false;render();
      toast('Inserisci contenuto da importare','ti-alert-circle');return;
    }

    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:2000,messages})});
    const data=await res.json();
    const text=(data.content||[]).map(c=>c.text||'').join('');
    const clean=text.replace(/```json|```/g,'').trim();
    let parsed;
    try{parsed=JSON.parse(clean);}catch(e){
      S.isLoading=false;render();
      toast('Errore nel parsing della ricetta','ti-alert-circle');return;
    }
    parsed.ingredients=(parsed.ingredients||[]).map((i,idx)=>({
      ...i,id:uid(),isSubRecipe:false,subRecipeId:null,
      qty:parseFloat(i.qty)||0,unit:UNITS.includes(i.unit)?i.unit:'g'
    }));
    parsed.steps=parsed.steps||[];
    parsed.subRecipes=(parsed.subRecipes||[]).map(sr=>({
      ...sr,ingredients:(sr.ingredients||[]).map(i=>({...i,id:uid(),qty:parseFloat(i.qty)||0,unit:UNITS.includes(i.unit)?i.unit:'g'}))
    }));
    S.loadPreview=parsed;
    S.view='preview';
  }catch(e){console.error(e);toast('Errore nell\'estrazione','ti-alert-circle');}
  S.isLoading=false;render();
}

function savePreview(){

  const buildLabVersion=note=>({
    id:'lv'+ts,label:p.name||'Nuova Scheda',name:p.name||'Nuova Scheda',note,originVariantId:null,

    ingredients:p.ingredients.map(i=>({...i,id:uid()})),
    steps:p.steps||[],mediaUrl:null,videoUrl:null,active:false,
  });

  // Sotto-ricette: comportamento INVARIATO in entrambi i rami — sempre nuove Schede
  // indipendenti, la scelta della destinazione riguarda solo la Ricetta principale.
  const recipesToSave=[];
  if(p.subRecipes&&p.subRecipes.length){

      const srId='r'+(ts+i+1);
      const srLab={
        id:'lv'+(ts+i+1),label:sr.name||'Bozza 1',note:'Da '+p.name,
        portionsCount:1,gramsPerPortion:sr.ingredients.reduce((s,x)=>s+cnum(x.qty),0)||200,
        ingredients:sr.ingredients.map(x=>({...x,id:uid()})),

        id:srId,name:sr.name,category:'Basi',department:'Cucina',
        validatedVariants:[],currentLabIdx:0,
        labVersions:[srLab],mediaUrl:null,videoUrl:null,
      });

  let landingId,toastMsg;

  if(S.loadDestinazione==='esistente'&&S.loadDestinazioneSchedaId){
    const target=R(S.loadDestinazioneSchedaId);
    if(!target){toast('Scheda non trovata: riprova.','ti-alert-circle');return;}
    // Entra come nuova bozza in LAB — non tocca validatedVariants, quindi non
    // modifica né sostituisce la Ricetta attiva della Scheda.
    const nuovaBozza=buildLabVersion('Importata');
    S.recipes=S.recipes.map(r=>r.id===target.id?{...r,labVersions:[...r.labVersions,nuovaBozza],currentLabIdx:r.labVersions.length}:r);
    S.recipes=[...S.recipes,...recipesToSave];
    landingId=target.id;
    toastMsg='Ricetta aggiunta come bozza a "'+target.name+'"';
  }else{
    const mainId='r'+ts;
    const mainRecipe={
      id:mainId,name:p.name||'Nuova Scheda',category:p.category||'Altro',department:'Cucina',
      validatedVariants:[],currentLabIdx:0,
      labVersions:[buildLabVersion('Importata')],mediaUrl:null,videoUrl:null,notes:'',
    };
    S.recipes=[...S.recipes,mainRecipe,...recipesToSave];
    landingId=mainId;
    toastMsg=recipesToSave.length?`Salvate ${1+recipesToSave.length} Schede`:'Scheda salvata';
  }

  S.selectedId=landingId;
  S.view='ricetta-madre-v2'; // Lifecycle della Scheda: si atterra sulla Scheda, mai direttamente nel LAB
  S.loadPreview=null;S.loadImageB64=null;S.loadImagePreviewUrl=null;
  S.loadText='';S.loadUrl='';S.loadVideoUrl='';
  S.loadDestinazione='nuova';S.loadDestinazioneSchedaId=null;
  render();

  setTimeout(()=>{
    const idsToSave=[landingId,...recipesToSave.map(r=>r.id)];
    idsToSave.forEach(id=>{
      const fresh=S.recipes.find(x=>x.id===id);
      if(fresh)saveToSupabase(fresh);
    });
  },200);
  toast(toastMsg,'ti-flask');
}

function suggestFamilies(recipe, variantName){
  var suggestions=[];
  var text=(recipe.name+' '+variantName).toLowerCase();
  // Suggerisci famiglie esistenti per nome simile
  S.families.forEach(function(f){
    var fname=f.name.toLowerCase();
    if(text.includes(fname)||fname.includes(recipe.name.toLowerCase())){
      suggestions.push(f.id);
    }
  });
  // Suggerisci per parole chiave
  var keywords={
    "senza glutine":["fam_senza_glutine"],
    "gluten free":["fam_senza_glutine"],
    "vegano":["fam_vegano"],
    "vegetariano":["fam_vegetariano"],
    "dolce":["fam_dolci"],"torta":["fam_torte","fam_dolci"],
    "crema":["fam_creme"],"salsa":["fam_creme"],
    "pasta":["fam_pasta"],"spaghetti":["fam_pasta"],"tagliatelle":["fam_pasta"],
    "pollo":["fam_carne"],"manzo":["fam_carne"],"maiale":["fam_carne"],
    "pesce":["fam_pesce"],"salmone":["fam_pesce"],"branzino":["fam_pesce"]
  };
  Object.keys(keywords).forEach(function(kw){
    if(text.includes(kw)){
      keywords[kw].forEach(function(fid){if(!suggestions.includes(fid))suggestions.push(fid);});
    }
  });
  // Aggiungi sempre la famiglia con il nome della ricetta (crea se non esiste)
  var recipeFamily=S.families.find(function(f){return f.name.toLowerCase()===recipe.name.toLowerCase();});
  if(recipeFamily&&!suggestions.includes(recipeFamily.id))suggestions.unshift(recipeFamily.id);
  return [...new Set(suggestions)].slice(0,5);
}

async function saveFamilies(variantId, familyIds, newFamilyName){
  var famIds=[...familyIds];
  // Crea nuova famiglia se specificata
  if(newFamilyName&&newFamilyName.trim()){
    var newFam={id:'fam_'+uid(),name:newFamilyName.trim()};
    S.families=[...S.families,newFam];
    famIds.push(newFam.id);
    await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({supabaseAction:'saveFamily',family:newFam})});
  }
  // Crea famiglia con nome ricetta se non esiste
  var recipe=R(S.selectedId);
  if(recipe){
    var existing=S.families.find(function(f){return f.name.toLowerCase()===recipe.name.toLowerCase();});
    if(!existing){
      var recipeFam={id:'fam_r'+uid(),name:recipe.name};
      S.families=[...S.families,recipeFam];
      famIds.unshift(recipeFam.id);
      await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({supabaseAction:'saveFamily',family:recipeFam})});
    } else if(!famIds.includes(existing.id)){
      famIds.unshift(existing.id);
    }
  }
  // Salva relazioni variant_families
  if(famIds.length>0){
    S.variantFamilies[variantId]=famIds;
    await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({supabaseAction:'saveVariantFamilies',variantId,familyIds:famIds})});
  }
}

// Crea una nuova bozza a partire da una Ricetta attiva specifica (o da zero se null).
// Punto unico usato sia dal caso automatico (0 o 1 attiva) sia dopo una scelta
// esplicita fatta dall'utente quando ce n'erano 2 o più — mai un .find() arbitrario.
function creaBozzaDaSorgente(recipeId,attiva){
  var recipe=R(recipeId);
  if(!recipe)return;
  var sorgente=attiva||{portionsCount:1,gramsPerPortion:0,portionSize:0,portionUnit:'g',ingredients:[],steps:[],label:'',name:recipe.name};
  var nuovaBozza={
    id:"lv"+uid(),
    label:"Bozza 1",
    name:sorgente.name||recipe.name,
    note:attiva?("Nuova bozza da \""+(attiva.name||recipe.name)+"\""):'',
    portionsCount:sorgente.portionsCount,
    gramsPerPortion:sorgente.gramsPerPortion,
    portionSize:sorgente.portionSize||sorgente.gramsPerPortion,
    portionUnit:sorgente.portionUnit||'g',
    ingredients:(sorgente.ingredients||[]).map(function(i){return Object.assign({},i,{id:"li"+uid()});}),
    steps:[].concat(sorgente.steps||[]),
    mediaUrl:null,videoUrl:null,active:false,
    originVariantId:attiva?attiva.id:null, // memoria certa: da quale Ricetta attiva è nata (o esplicitamente nessuna)
  };
  upRec(recipeId,function(r){
    return Object.assign({},r,{labVersions:[nuovaBozza],currentLabIdx:0});
  });
  S.pendingDuplicaSceltaRecipeId=null;
  toast(attiva?"Nuova bozza creata dalla Ricetta attiva":"Nuova bozza creata","ti-copy");
}

function creaBozzaDaAttivaId(recipeId,attivaId){
  var recipe=R(recipeId);
  if(!recipe)return;
  var attiva=(recipe.validatedVariants||[]).find(function(vv){return vv.id===attivaId;});
  if(!attiva)return;
  creaBozzaDaSorgente(recipeId,attiva);
}

function duplicaVersioneLAB(recipeId){
  var recipe=R(recipeId);
  if(!recipe)return;
  var v=curLab(recipe);
  if(!v){
    // Nessuna bozza da cui partire (es. subito dopo "Rendi attiva"): si riparte
    // dalla Ricetta attiva, se esiste — mai da zero se c'è già un patrimonio.
    var attive=activeVariants(recipe);
    if(attive.length>1){
      // Micro-Step B: 0..N Ricette attive — con più di una, la scelta della
      // Ricetta di partenza è sempre esplicita, mai un .find() arbitrario.
      S.pendingDuplicaSceltaRecipeId=recipeId;
      render();
      return;
    }
    creaBozzaDaSorgente(recipeId,attive[0]||null);
    return;
  }
  var nextNum=recipe.labVersions.length+1;
  var newLabel="Bozza "+nextNum;
  var newV={
    id:"lv"+uid(),
    label:newLabel,
    name:v.name||recipe.name,
    note:"Copia di "+v.label,
    portionsCount:v.portionsCount,
    gramsPerPortion:v.gramsPerPortion,
    portionSize:v.portionSize||v.gramsPerPortion, // Step 1
    portionUnit:v.portionUnit||'g',               // Step 1
    ingredients:v.ingredients.map(function(i){return Object.assign({},i,{id:"li"+uid()});} ),
    steps:[...v.steps],
    mediaUrl:null,
    videoUrl:null,
    active:false,
    originVariantId:(v.originVariantId!==undefined?v.originVariantId:null), // stessa origine della bozza da cui si continua a esplorare
  };
  upRec(recipeId,function(r){
    var newVersions=[...r.labVersions,newV];
    return Object.assign({},r,{labVersions:newVersions,currentLabIdx:newVersions.length-1});
  });
  toast("Nuova bozza creata: "+newLabel,"ti-copy");
}

// Lifecycle della Scheda — Caso 1: la bozza migliora la stessa preparazione.
// Sostituisce la versione attiva, pensiona automaticamente la precedente, chiude il ciclo della bozza.
// Nessun nuovo nome richiesto (il nome della Scheda esiste già), nessuna nuova assegnazione di Famiglie.
// Lifecycle della Scheda — Caso 2: la bozza non evolve più la stessa preparazione,
// ne nasce una diversa. Eredita nome/ingredienti/procedimento/rese/mattoncini.
// Nasce senza Famiglie proprie e senza Primo Consulto ereditato — fresca, con la sua storia.
// La bozza di origine si trasferisce: non viene duplicata, scompare da dove era nata.
async function creaSchedaDaLab(recipeId){
  const recipe=R(recipeId);
  if(!recipe)return;
  const v=curLab(recipe);
  if(!v||!v.ingredients||!v.ingredients.length){
    toast('Aggiungi almeno un ingrediente prima di creare una nuova Scheda.','ti-alert-circle');
    return;
  }
  const nomeNuova=(v.name||recipe.name).trim();
  if(!confirm('Creare una nuova Scheda indipendente chiamata "'+nomeNuova+'"? La bozza lascerà "'+recipe.name+'" e diventerà una Scheda a sé, con la propria storia.'))return;

  const ts=Date.now();
  const newId='r'+ts;
  const newLabVersion={
    id:'lv'+ts,label:'Bozza 1',name:nomeNuova,note:'Nata da "'+recipe.name+'"',originVariantId:null,
    portionsCount:v.portionsCount,gramsPerPortion:v.gramsPerPortion,
    portionSize:v.portionSize||v.gramsPerPortion,portionUnit:v.portionUnit||'g',
    ingredients:v.ingredients.map(i=>({...i,id:uid()})),
    steps:[...(v.steps||[])],
    mediaUrl:null,videoUrl:null,active:false,
    l2Items:[],intentionInitial:null,intentionCurrent:null,criteriaInitial:null,criteriaCurrent:null,
  };
  const newRecipe={
    id:newId,name:nomeNuova,category:recipe.category,department:recipe.department||'Cucina',
    validatedVariants:[],currentLabIdx:0,
    labVersions:[newLabVersion],mediaUrl:null,videoUrl:null,notes:'',
  };

  S.recipes=[...S.recipes,newRecipe].map(r=>
    r.id===recipeId?{...r,labVersions:r.labVersions.filter(lv=>lv.id!==v.id),currentLabIdx:0}:r
  );
  S.selectedId=newId;
  S.view='ricetta-madre-v2';
  render();

  await saveToSupabase(newRecipe);
  const recipeAggiornata=R(recipeId);
  if(recipeAggiornata)await saveToSupabase(recipeAggiornata);

  toast('Nuova Scheda creata: "'+nomeNuova+'"','ti-sparkles');
  openLabFamilyPicker(newId);
}

// Lifecycle della Scheda — quarto esito: la bozza non serve più.
// Una bozza LAB non può mai essere referenziata come mattoncino altrove (solo le
// varianti validate lo sono) — nessun controllo di dipendenza necessario.
async function eliminaBozza(recipeId,variantId){
  const recipe=R(recipeId);
  if(!recipe)return;
  const v=(recipe.labVersions||[]).find(lv=>lv.id===variantId);
  if(!v)return;
  if(!confirm('Eliminare la bozza "'+(v.name||recipe.name)+'"? Non modifica in alcun modo la Scheda ufficiale.'))return;

  S.view='ricetta-madre-v2'; // mai una schermata vuota: si torna sempre alla Scheda

  upRec(recipeId,r=>{
    const newLabVersions=r.labVersions.filter(lv=>lv.id!==variantId);
    return{...r,labVersions:newLabVersions,currentLabIdx:0};
  });
  toast('Bozza eliminata','ti-trash');
  await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({supabaseAction:'delete',table:'variants',id:variantId})});
}

function rendiAttiva(recipeId){
  const recipe=R(recipeId);
  if(!recipe)return;
  const v=curLab(recipe);
  if(!v||!v.ingredients||!v.ingredients.length){
    toast('Aggiungi almeno un ingrediente prima di rendere attiva questa bozza.','ti-alert-circle');
    return;
  }
  if(!confirm('Rendere attiva questa bozza? Diventerà una Ricetta attiva. La bozza nel LAB si chiuderà.'))return;

  // D3: stesso variant.id lungo tutto il lifecycle (lab -> attiva). Un nuovo
  // id nasce SOLO nel vero branching (creaBozzaDaSorgente/duplicaVersioneLAB/ecc).
  const nv={
    id:v.id,
    name:v.name||recipe.name,
    status:'approved',
    active:true,
    validatedAt:new Date().toLocaleDateString('it-IT'),
    portionsCount:v.portionsCount,
    gramsPerPortion:v.gramsPerPortion,
    portionSize:v.portionSize||v.gramsPerPortion,
    portionUnit:v.portionUnit||'g',
    ingredients:v.ingredients.map(i=>({
      ...i,
      id:'vi'+uid()+uid(),
      estimatedYieldPct:i.estimatedYieldPct!==undefined&&i.estimatedYieldPct!==null?i.estimatedYieldPct:null,
      measuredYieldPct:i.measuredYieldPct!==undefined&&i.measuredYieldPct!==null?i.measuredYieldPct:null,
    })),
    steps:[...(v.steps||[])],
    mediaUrl:v.mediaUrl||null,videoUrl:v.videoUrl||null,
    originVariantId:v.originVariantId||null, // D3: sopravvive alla transizione di lifecycle
    l2Items:v.l2Items||[], // PSL: L2 segue la Ricetta, mai copiato in una nuova identita'
    intentionInitial:v.intentionInitial||null,intentionCurrent:v.intentionCurrent||null,
    criteriaInitial:v.criteriaInitial||null,criteriaCurrent:v.criteriaCurrent||null,
  };

  S.view='ricetta-madre-v2'; // la bozza ha concluso il ciclo: si torna alla Scheda

  upRec(recipeId,r=>{
    // Micro-Step B: nessun pensionamento automatico delle altre attive —
    // una Scheda può avere 0..N Ricette attive contemporaneamente.
    const newLabVersions=r.labVersions.filter(lv=>lv.id!==v.id);
    return{
      ...r,
      validatedVariants:[...r.validatedVariants,nv],
      labVersions:newLabVersions,
      currentLabIdx:0,
    };
  });

  addHistory(nv.id,'attivata',nv.name);
  toast('"'+nv.name+'" è ora una Ricetta attiva.','ti-circle-check');
}

function onValidate(){
  const id=S.selectedId;const recipe=R(id);if(!recipe)return;
  const v=curLab(recipe);if(!v)return;
  const name=(v.name||recipe.name||'').trim();
  if(!name){toast('Questa bozza non ha un titolo.','ti-alert-circle');return;}
  // D3: stesso variant.id lungo tutto il lifecycle (lab -> validated). Un
  // nuovo id nasce SOLO nel vero branching (creaBozzaDaSorgente/duplicaVersioneLAB/ecc).
  const nv={
    id:v.id,name,
    status:'approved',
    active:false,
    validatedAt:new Date().toLocaleDateString('it-IT'),
    portionsCount:v.portionsCount,
    gramsPerPortion:v.gramsPerPortion,
    portionSize:v.portionSize||v.gramsPerPortion,
    portionUnit:v.portionUnit||'g',
    ingredients:v.ingredients.map(i=>({
      ...i,
      id:'vi'+uid()+uid(), // id più lungo per evitare conflitti
      estimatedYieldPct:i.estimatedYieldPct!==undefined&&i.estimatedYieldPct!==null?i.estimatedYieldPct:null,
      measuredYieldPct:i.measuredYieldPct!==undefined&&i.measuredYieldPct!==null?i.measuredYieldPct:null,
    })),
    steps:[...v.steps],
    mediaUrl:v.mediaUrl||null,videoUrl:v.videoUrl||null,
    originVariantId:v.originVariantId||null, // D3: sopravvive alla transizione di lifecycle
    l2Items:v.l2Items||[], // PSL: L2 segue la Ricetta, mai copiato in una nuova identita'
    intentionInitial:v.intentionInitial||null,intentionCurrent:v.intentionCurrent||null,
    criteriaInitial:v.criteriaInitial||null,criteriaCurrent:v.criteriaCurrent||null,
  };
  // Step 5: registra evento in cronologia
  addHistory(nv.id,'approvata',name);
  // Suggerisci famiglie e mostra picker
  S.pendingValidatedVariant=nv;
  S.pendingValidatedRecipeId=id;
  S.pendingValidatedFromBozzaId=v.id;
  S.pendingFamilies=suggestFamilies(recipe,name);
  S.pendingNewFamily='';
  S.showFamilyPicker=true;
  render();
}

async function confirmValidate(){
  var nv=S.pendingValidatedVariant;
  var id=S.pendingValidatedRecipeId;
  if(!nv||!id)return;
  var isManager=S.familyManagerMode;
  S.familyManagerMode=false;
  if(!isManager){
    // Fase 5: la nuova variante nasce con status:'approved' e active:false — nessun automatismo su produzione
    _saveLocked=true;
    if(_saveTimer[id])clearTimeout(_saveTimer[id]);
    var fromBozzaId=S.pendingValidatedFromBozzaId;
    S.recipes=S.recipes.map(function(r){
      if(r.id!==id)return r;
      var newLabVersions=fromBozzaId?r.labVersions.filter(function(lv){return lv.id!==fromBozzaId;}):r.labVersions;
      return Object.assign({},r,{validatedVariants:[...r.validatedVariants,nv],labVersions:newLabVersions,currentLabIdx:0});
    });
    S.pendingValidatedFromBozzaId=null;
    var updatedRecipe=S.recipes.find(function(r){return r.id===id;});
    if(updatedRecipe){
      await saveToSupabase(updatedRecipe);
    }
  }
  S.showFamilyPicker=false;
  S.pendingValidatedVariant=null;S.pendingValidatedRecipeId=null;
  if(!isManager){
    setTimeout(function(){_saveLocked=false;},3000);
  }
  await saveFamilies(nv.id,S.pendingFamilies,S.pendingNewFamily);
  if(isManager){
    toast("Famiglie aggiornate","ti-tags");
    render();
  } else {
    // Salva di nuovo alla fine per essere sicuri — dopo saveFamilies
    var finalRecipe=S.recipes.find(function(r){return r.id===id;});
    if(finalRecipe) await saveToSupabase(finalRecipe);
    // Punto 5: dopo validazione → diretto in RicettaMadreV2
    S.view='ricetta-madre-v2';
    S.mode='produzione';
    S.selectedVariantId=null;
    toast('"'+nv.name+'" è pronta.','ti-circle-check');
    render();
  }
}

// ── STEP 4: SCALING CON RESE ─────────────────────────────
// Il motore esistente resta invariato.
// Se le rese sono definite, il fattore viene calcolato a ritroso dal peso finito target.
// Se nessuna resa è definita → comportamento identico a prima.

// Calcola il peso finito totale attuale della variante (somma qty × effectiveYield)
function computeFinishedWeightProd(vv){
  return vv.ingredients.reduce((s,i)=>s+cnum(i.qty)*effectiveYield(i),0);
}

// Calcola il fattore di scala:
// - Con rese: partendo dal peso finito target (porzioni × gpp) → a ritroso sulle qty a crudo
// - Senza rese (tutti Y=1): equivale allo scaling proporzionale attuale
function computeScaleFactor(vv, targetPortions, targetGpp){
  const hasYield=vv.ingredients.some(i=>i.estimatedYieldPct!=null);
  if(!hasYield){
    // Nessuna resa definita: scaling proporzionale classico
    // Il fattore dipende da cosa è cambiato (porzioni o gpp) — gestito dai caller
    return null; // segnale: usa scaling classico
  }
  const pesoFinitoTarget=targetPortions*targetGpp;
  const pesoFinitoAttuale=computeFinishedWeightProd(vv);
  if(pesoFinitoAttuale===0)return 1;
  return pesoFinitoTarget/pesoFinitoAttuale;
}

function onVarPortions(recipeId,varId,val){
  upRec(recipeId,r=>{
    const vv=r.validatedVariants.find(v=>v.id===varId);if(!vv)return r;
    const newPortions=parseFloat(val)||1;
    const scala=computeScaleFactor(vv,newPortions,vv.gramsPerPortion||200);
    if(scala===null){
      // Scaling classico: proporzionale alle porzioni
      const ratio=newPortions/(vv.portionsCount||1);
      const newVV={...vv,portionsCount:newPortions,ingredients:vv.ingredients.map(i=>({...i,qty:Math.round(cnum(i.qty)*ratio*10)/10}))};
      return{...r,validatedVariants:r.validatedVariants.map(v=>v.id===varId?newVV:v)};
    }
    // Scaling con rese: ricalcola qty a crudo per ottenere il peso finito target
    const newVV={...vv,portionsCount:newPortions,ingredients:vv.ingredients.map(i=>({...i,qty:Math.round(cnum(i.qty)*scala*10)/10}))};
    return{...r,validatedVariants:r.validatedVariants.map(v=>v.id===varId?newVV:v)};
  });
  saveToSupabase(R(recipeId));
}
function onVarGpp(recipeId,varId,val){
  upRec(recipeId,r=>{
    const vv=r.validatedVariants.find(v=>v.id===varId);if(!vv)return r;
    const newGpp=parseFloat(val)||1;
    const scala=computeScaleFactor(vv,vv.portionsCount||1,newGpp);
    if(scala===null){
      // Scaling classico: proporzionale al g/porzione
      const ratio=newGpp/(vv.gramsPerPortion||1);
      const newVV={...vv,gramsPerPortion:newGpp,ingredients:vv.ingredients.map(i=>({...i,qty:Math.round(cnum(i.qty)*ratio*10)/10}))};
      return{...r,validatedVariants:r.validatedVariants.map(v=>v.id===varId?newVV:v)};
    }
    // Scaling con rese
    const newVV={...vv,gramsPerPortion:newGpp,ingredients:vv.ingredients.map(i=>({...i,qty:Math.round(cnum(i.qty)*scala*10)/10}))};
    return{...r,validatedVariants:r.validatedVariants.map(v=>v.id===varId?newVV:v)};
  });
  saveToSupabase(R(recipeId));
}

function onVarIngQty(recipeId,varId,ingId,val){

// ── STEP 2: EFFECTIVE YIELD ──────────────────────────────
// Unico punto di accesso alle rese nel motore.
// null/undefined → 1.0 (comportamento invariato, retrocompatibile)
// 0              → 0   (resa zero esplicita: ingrediente evapora/non contribuisce)
// qualsiasi N    → N/100
function effectiveYield(ing){
  if(ing.estimatedYieldPct===null||ing.estimatedYieldPct===undefined)return 1.0;
  return ing.estimatedYieldPct/100;
}
// ─────────────────────────────────────────────────────────

function recalcGramsPerPortion(vv){
  const totG=vv.ingredients.reduce((s,i)=>{
    // Converti tutto in grammi per il totale (approssimazione per unità volumetriche)
    if(i.unit==='g'||i.unit==='ml')return s+cnum(i.qty);
    if(i.unit==='kg'||i.unit==='l')return s+cnum(i.qty)*1000;
    if(i.unit==='cl')return s+cnum(i.qty)*10;
    if(i.unit==='tbsp')return s+cnum(i.qty)*15;
    if(i.unit==='tsp')return s+cnum(i.qty)*5;
    return s+cnum(i.qty); // n e altro: somma diretta
  },0);
  return Math.round(totG/(vv.portionsCount||1));
}

// Cambio unità ingrediente in Produzione — stessa logica di onIngUnit (LAB)
function onVarIngUnit(recipeId,varId,ingId,val){
  const recipe=R(recipeId);
  const vv=recipe&&recipe.validatedVariants.find(v=>v.id===varId);
  const ing=vv&&vv.ingredients.find(i=>i.id===ingId);
  if(!ing)return;
  // Caso speciale: n → g con peso medio
  if(ing.unit==='n'&&val==='g'){
    const name=ing.name.toLowerCase().trim();
    const pesoNoto=S.unitWeights[name];
    if(pesoNoto){
      upRec(recipeId,r=>({...r,validatedVariants:r.validatedVariants.map(v=>{
        if(v.id!==varId)return v;
        const newIngs=v.ingredients.map(i=>i.id===ingId?{...i,unit:'g',qty:Math.round(cnum(i.qty)*pesoNoto*10)/10}:i);
        const newVV={...v,ingredients:newIngs};
        return {...newVV,gramsPerPortion:recalcGramsPerPortion(newVV)};
      })}));
      saveToSupabase(R(recipeId));render();
    } else {
      S.pendingUnitConversion={recipeId,ingId,ingName:ing.name,qty:ing.qty,newUnit:'g',varId};
      render();
    }
    return;
  }
  // Conversione normale (g↔kg, ml↔l, tbsp/tsp→g, ecc.)
  const newQty=sameGroup(ing.unit,val)?convertQty(ing.qty,ing.unit,val):ing.qty;
  upRec(recipeId,r=>({...r,validatedVariants:r.validatedVariants.map(v=>{
    if(v.id!==varId)return v;
    const newIngs=v.ingredients.map(i=>i.id===ingId?{...i,unit:val,qty:newQty}:i);
    const newVV={...v,ingredients:newIngs};
    return {...newVV,gramsPerPortion:recalcGramsPerPortion(newVV)};
  })}));
  saveToSupabase(R(recipeId));
  render();
}

// ══════════════════════════════════════════════════════════
// PANNELLO ANALISI MICHELINAI — Step 5
// Contenitore generico per analisi strutturate.
// Prima funzione: suggerimento rese% per ingrediente.
// ══════════════════════════════════════════════════════════

async function analyzeYields(recipeId){
  const recipe=R(recipeId);
  const v=curLab(recipe);
  if(!v||!v.ingredients.length){toast('Aggiungi ingredienti prima di analizzare.','ti-alert-circle');return;}
  S.yieldAnalysisLoading=true;
  S.yieldAnalysis=null;
  render();
  const ingList=v.ingredients.map((i,idx)=>(idx+1)+'. '+i.name+': '+i.qty+i.unit+(i.estimatedYieldPct!=null?' (resa attuale: '+i.estimatedYieldPct+'%)':'')).join('\n');
  const proc=(v.steps||[]).join(' ');
  const prompt='Sei MichelinAI, esperto di cucina professionale italiana. Analizza questa ricetta e suggerisci la resa% per ogni ingrediente.\n\nRICETTA: '+recipe.name+' ('+recipe.category+')\nINGREDIENTI:\n'+ingList+(proc?'\nPROCEDIMENTO:\n'+proc:'')+'\n\nPer ogni ingrediente indica:\n- estimatedYieldPct: numero intero (100=invariato, 70=perde 30%, 200=raddoppia, 0=evapora completamente)\n- reason: spiegazione breve in italiano (max 10 parole)\n\nRispondi SOLO con JSON valido, niente altro:\n{"suggestions":[{"ingName":"nome esatto","estimatedYieldPct":70,"reason":"perde acqua in cottura"}]}';

  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,
        messages:[{role:'user',content:prompt}]})});
    const data=await res.json();
    const text=(data.content||[]).map(c=>c.text||'').join('').replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(text);
    // Abbina i suggerimenti agli ingredienti per id
    const suggestions=(parsed.suggestions||[]).map(s=>{
      const ing=v.ingredients.find(i=>i.name.toLowerCase().trim()===s.ingName.toLowerCase().trim())
                ||v.ingredients.find(i=>i.name.toLowerCase().includes(s.ingName.toLowerCase()));
      return ing?{ingId:ing.id,ingName:ing.name,currentYield:ing.estimatedYieldPct,
                  suggestedYield:s.estimatedYieldPct,reason:s.reason}:null;
    }).filter(Boolean);
    S.yieldAnalysis={recipeId,suggestions};
  }catch(e){
    toast('Errore analisi MichelinAI. Riprova.','ti-alert-circle');
  }
  S.yieldAnalysisLoading=false;
  render();
}

function applyYieldSuggestion(recipeId,ingId,val){
  upLab(recipeId,v=>({...v,ingredients:v.ingredients.map(i=>
    i.id===ingId?{...i,estimatedYieldPct:val}:i
  )}));
  // Rimuovi il suggerimento applicato
  if(S.yieldAnalysis){
    S.yieldAnalysis.suggestions=S.yieldAnalysis.suggestions.filter(s=>s.ingId!==ingId);
  }
  render();
}

function dismissYieldSuggestion(ingId){
  if(S.yieldAnalysis){
    S.yieldAnalysis.suggestions=S.yieldAnalysis.suggestions.filter(s=>s.ingId!==ingId);
  }
  render();
}

function applyAllYieldSuggestions(recipeId){
  if(!S.yieldAnalysis)return;
  S.yieldAnalysis.suggestions.forEach(s=>{
    upLab(recipeId,v=>({...v,ingredients:v.ingredients.map(i=>
      i.id===s.ingId?{...i,estimatedYieldPct:s.suggestedYield}:i
    )}));
  });
  S.yieldAnalysis=null;
  toast('Rese applicate a tutti gli ingredienti','ti-check');
  render();
}

// Step 1 — Primo Consulto: chiamata a MichelinAI (DL-012: KHUB fa i controlli formali,
// MichelinAI valuta coerenza tecnica, realizzabilità, conseguenze gastronomiche).
// Non ancora richiamata da nessun pulsante dell'interfaccia.
// Valori ammessi per l'output del Primo Consulto — unica fonte di verità,
// usata sia dal prompt sia dalla validazione della risposta.
const PRIMO_CONSULTO_CATEGORIES=['realizzabilita_tecnica','coerenza_preparazione','criticita','informazioni_mancanti','aspetti_da_approfondire','opportunita_miglioramento'];
const PRIMO_CONSULTO_SOURCES=['scheda_corrente','conoscenza_universale'];
const PRIMO_CONSULTO_CONFIDENCE=['fatto_verificato','osservazione_ricorrente','ipotesi','dati_insufficienti'];
const PRIMO_CONSULTO_MAX_OBS=4;

// Etichette leggibili per categoria/certezza del Primo Consulto — usate nel LAB (Step: riposizionamento)
const PC_CATEGORY_LABEL={
  realizzabilita_tecnica:'Realizzabilità tecnica',coerenza_preparazione:'Coerenza della preparazione',
  criticita:'Criticità',informazioni_mancanti:'Informazioni mancanti',
  aspetti_da_approfondire:'Da approfondire',opportunita_miglioramento:'Opportunità di miglioramento'
};
const PC_CONFIDENCE_LABEL={
  fatto_verificato:'Fatto verificato',osservazione_ricorrente:'Pattern osservato',
  ipotesi:'Ipotesi',dati_insufficienti:'Dati insufficienti'
};

// Pura, testabile offline: riceve l'oggetto già passato da JSON.parse (o qualunque
// cosa, anche malformata) e restituisce sempre uno status esplicito:
// - 'valid'   -> struttura corretta, observations è un array (anche vuoto: nessuna
//                osservazione con valore decisionale sufficiente è un esito legittimo)
// - 'invalid' -> la struttura non è affidabile: o manca del tutto il campo observations,
//                oppure conteneva elementi ma la validazione li ha scartati tutti.
//                Un array vuoto per errore di formato NON deve mai essere confuso
//                con un array vuoto perché "nessun problema trovato".
function validatePrimoConsultoOutput(parsed){
  const scartate=[];
  if(!parsed||typeof parsed!=='object'||!Array.isArray(parsed.observations)){
    return{status:'invalid',observations:[],scartate:['struttura non valida o campo observations assente']};
  }
  const rawObs=parsed.observations;
  const observations=rawObs.filter(o=>{
    if(!o||typeof o!=='object'){scartate.push('elemento non valido');return false;}
    const hasFields=typeof o.observation==='string'&&o.observation.trim()
      &&typeof o.reason==='string'&&o.reason.trim(); // motivazione obbligatoria
    const catOk=PRIMO_CONSULTO_CATEGORIES.includes(o.category);
    const srcOk=PRIMO_CONSULTO_SOURCES.includes(o.source);
    const confOk=PRIMO_CONSULTO_CONFIDENCE.includes(o.confidence);
    if(!hasFields||!catOk||!srcOk||!confOk){
      scartate.push('osservazione scartata: '+JSON.stringify(o).slice(0,120));
      return false;
    }
    return true;
  }).slice(0,PRIMO_CONSULTO_MAX_OBS);

  if(rawObs.length>0&&observations.length===0){
    if(scartate.length)console.warn('[Primo Consulto] output scartato interamente:',scartate);
    return{status:'invalid',observations:[],scartate};
  }

  if(scartate.length)console.warn('[Primo Consulto] elementi scartati in validazione:',scartate);
  return{status:'valid',observations,scartate};
}

// Sviluppo della Scheda — Interpretazione delle modifiche: valori ammessi
const INTERPRETAZIONE_FAMIGLIE=['costruzione','tecnica','validazione_sensoriale','stabilita','produzione','decisione_finale'];
const INTERPRETAZIONE_MODALITA=['costruttiva','diagnostica'];
const INTERPRETAZIONE_FONTI=['conoscenza_universale','scheda_corrente'];
const INTERPRETAZIONE_CERTEZZA=['fatto_verificato','osservazione_ricorrente','ipotesi','dati_insufficienti'];
const INTERPRETAZIONE_MAX_OSS=4;

// Pura, testabile offline: stesso status esplicito già usato per il Primo Consulto —
// 'valid' con array vuoto è un esito legittimo, 'invalid' quando c'era qualcosa ma
// nulla sopravvive alla validazione (mai confuso con "nessuna osservazione").
function validateInterpretazioneOutput(parsed){
  const scartate=[];
  if(!parsed||typeof parsed!=='object'||!Array.isArray(parsed.osservazioni)){
    return{status:'invalid',osservazioni:[],scartate:['struttura non valida o campo osservazioni assente']};
  }
  const rawObs=parsed.osservazioni;
  const osservazioni=rawObs.filter(o=>{
    if(!o||typeof o!=='object'){scartate.push('elemento non valido');return false;}
    const testiOk=typeof o.osservazione==='string'&&o.osservazione.trim()
      &&typeof o.motivo==='string'&&o.motivo.trim();
    const famigliaOk=INTERPRETAZIONE_FAMIGLIE.includes(o.famiglia);
    const modalitaOk=INTERPRETAZIONE_MODALITA.includes(o.modalita);
    const fonteOk=INTERPRETAZIONE_FONTI.includes(o.fonte);
    const certezzaOk=INTERPRETAZIONE_CERTEZZA.includes(o.certezza);
    if(!testiOk||!famigliaOk||!modalitaOk||!fonteOk||!certezzaOk){
      scartate.push('osservazione scartata: '+JSON.stringify(o).slice(0,120));
      return false;
    }
    return true;
  }).slice(0,INTERPRETAZIONE_MAX_OSS);

  if(rawObs.length>0&&osservazioni.length===0){
    if(scartate.length)console.warn('[Interpretazione modifiche] output scartato interamente:',scartate);
    return{status:'invalid',osservazioni:[],scartate};
  }
  if(scartate.length)console.warn('[Interpretazione modifiche] elementi scartati in validazione:',scartate);
  return{status:'valid',osservazioni,scartate};
}

// ══════════════════════════════════════════════════════════
// "Chiedi a MichelinAI" — Step 3C: contratto e validazione offline.
// Nessuna chiamata API, nessun context builder, nessun prompt reale:
// solo la forma esatta di input/output e la sua validazione pura.
// Riusa gli stessi enum già congelati per Fonte/Certezza (nessun
// enum nuovo — vedi INTERPRETAZIONE_FONTI/INTERPRETAZIONE_CERTEZZA sopra).
// ══════════════════════════════════════════════════════════
const CHIEDI_MICHELINAI_MAX_CRONOLOGIA=5; // solo domande, mai risposte — memoria linguistica della sessione, non conoscenza della Scheda

// Pura, testabile offline, non muta l'array originale. Mantiene solo le
// ultime CHIEDI_MICHELINAI_MAX_CRONOLOGIA domande, in ordine cronologico.
// Nessuna risposta, nessun timestamp, nessun riferimento alla Scheda.
function aggiungiDomandaACronologia(cronologiaAttuale,nuovaDomanda){
  const base=Array.isArray(cronologiaAttuale)?cronologiaAttuale:[];
  const aggiornata=[...base,nuovaDomanda];
  return aggiornata.slice(-CHIEDI_MICHELINAI_MAX_CRONOLOGIA);
}

// Pura, testabile offline: riceve l'oggetto già passato da JSON.parse (o
// qualunque cosa, anche malformata) e restituisce sempre uno status esplicito.
//
// Contratto (oggetto singolo, non un array di osservazioni — una domanda
// dello chef merita una risposta coerente, non un elenco puntato):
//   { pertinente: boolean, risposta: string, motivo: string,
//     fonti: string[], certezza: string }
//
// pertinente:true  -> la domanda riguarda il compito di MichelinAI su questa
//                      Scheda. Tutti i campi diventano obbligatori, ANCHE
//                      quando i dati mancano: "dati_insufficienti" è un
//                      valore legittimo di certezza, non una scusa per
//                      dire pertinente:false. pertinente:false significa
//                      ESCLUSIVAMENTE "questa richiesta non appartiene al
//                      compito di MichelinAI rispetto a questa Scheda" —
//                      mai "non ho abbastanza dati per rispondere bene".
// pertinente:false -> risposta resta obbligatoria (spiega perché non è
//                      pertinente); motivo/fonti/certezza possono essere
//                      assenti e, se presenti, vengono ignorati — mai usati
//                      semanticamente.
// fonti: string[]  -> può contenere una o entrambe le fonti ammesse
//                      (una risposta può derivare in parte dalla Scheda
//                      corrente e in parte da conoscenza generale). Nessun
//                      valore "mista": la cardinalità sostituisce l'enum.
//                      Duplicati vengono normalizzati (deduplicati), non
//                      trattati come errore — il valore resta comunque
//                      valido, solo ripetuto.
//
// Nessun output "parzialmente valido": è un oggetto singolo, o è valido
// nella sua interezza o va scartato tutto (stesso principio già usato
// per Primo Consulto e Interpretazione).
function validateChiediMichelinAIOutput(parsed){
  if(!parsed||typeof parsed!=='object'||Array.isArray(parsed)){
    return{status:'invalid',pertinente:null,risposta:'',motivo:'',fonti:[],certezza:'',scartate:['struttura non valida: atteso un oggetto']};
  }

  const pertinenteOk=typeof parsed.pertinente==='boolean'; // tipizzazione rigida: "true" stringa NON è ammesso
  const rispostaOk=typeof parsed.risposta==='string'&&parsed.risposta.trim();
  if(!pertinenteOk||!rispostaOk){
    return{status:'invalid',pertinente:null,risposta:'',motivo:'',fonti:[],certezza:'',scartate:['campo pertinente o risposta assente/non valido']};
  }

  // pertinente:false — solo "non è compito di MichelinAI qui", risposta obbligatoria, resto ignorato
  if(parsed.pertinente===false){
    return{status:'valid',pertinente:false,risposta:parsed.risposta.trim(),motivo:'',fonti:[],certezza:'',scartate:[]};
  }

  // pertinente:true — motivo, fonti, certezza tutti obbligatori, anche con dati_insufficienti
  const motivoOk=typeof parsed.motivo==='string'&&parsed.motivo.trim();
  const fontiRaw=Array.isArray(parsed.fonti)?parsed.fonti:null;
  const fontiValide=fontiRaw&&fontiRaw.length>0&&fontiRaw.every(f=>INTERPRETAZIONE_FONTI.includes(f));
  const certezzaOk=INTERPRETAZIONE_CERTEZZA.includes(parsed.certezza);

  if(!motivoOk||!fontiValide||!certezzaOk){
    return{status:'invalid',pertinente:null,risposta:'',motivo:'',fonti:[],certezza:'',scartate:['pertinente:true ma motivo/fonti/certezza mancanti o non validi']};
  }

  const fontiUniche=[...new Set(fontiRaw)]; // duplicati normalizzati, non un errore
  return{status:'valid',pertinente:true,risposta:parsed.risposta.trim(),motivo:parsed.motivo.trim(),fonti:fontiUniche,certezza:parsed.certezza,scartate:[]};
}

// ══════════════════════════════════════════════════════════
// "Chiedi a MichelinAI" — Step 3D: Context Builder.
// Funzione pura: trasforma lo stato reale della Scheda/bozza in un oggetto
// strutturato. Nessuna domanda, nessuna cronologia, nessun prompt, nessuna
// chiamata API, nessuna inferenza gastronomica — solo dati che esistono
// davvero, così come sono. Non tocca Primo Consulto/Interpretazione
// (duplicazione di formattazione esistente volutamente non refactorizzata:
// fuori dal perimetro di questo Step).
// ══════════════════════════════════════════════════════════

// Rappresenta un ingrediente così com'è nella Scheda: mai un valore
// inventato o di default per un campo assente. estimatedYieldPct/
// measuredYieldPct compaiono SOLO se presenti nel dato reale. isSubRecipe
// preserva l'informazione "questo componente è un mattoncino" senza
// espanderne ricorsivamente il contenuto (fuori perimetro di questo Step).
function formattaIngredienteContesto(i){
  const out={nome:i.name,quantita:i.qty,unita:i.unit,mattoncino:!!i.isSubRecipe};
  if(i.estimatedYieldPct!=null)out.resaStimata=i.estimatedYieldPct;
  if(i.measuredYieldPct!=null)out.resaMisurata=i.measuredYieldPct;
  if(i.isSubRecipe&&i.subRecipeId)out.mattoncinoRiferimento=i.subRecipeId;
  return out;
}

// Procedimento come lista di step non vuoti unita in un unico testo, oppure
// null se non esiste ancora — rappresentazione esplicita dell'assenza, MAI
// una stringa vuota ambigua né una frase inventata (la prosa per l'utente/
// il prompt è responsabilità dello Step 3E, non del Context Builder).
function formattaProcedimentoContesto(steps){
  const testo=(steps||[]).filter(s=>s&&s.trim()).join(' ');
  return testo||null;
}

function costruisciContestoSchedaLAB(recipeId){
  const recipe=R(recipeId);
  if(!recipe)return null;
  const v=curLab(recipe);
  if(!v)return null;

  const ingredienti=(v.ingredients||[]).map(formattaIngredienteContesto);
  const procedimento=formattaProcedimentoContesto(v.steps);

  // Peso totale: SOLO la semantica già deterministica e usata altrove in KHUB
  // (porzioni × grammi/porzione, es. header del LAB) — mai la somma delle
  // quantità ingredienti, che mescolerebbe unità incompatibili (g, ml, n...).
  const pesoTotale=(v.portionsCount!=null&&v.gramsPerPortion!=null)
    ?Math.round(v.portionsCount*v.gramsPerPortion):null;

  // Origine della bozza: tre stati distinti e sempre espliciti, mai un'omissione
  // silenziosa. "non_disponibile" non deve mai essere confuso con "nessuna".
  let origine;
  if(v.originVariantId===null){
    origine={stato:'nessuna'};
  }else{
    const trovata=findVariantById(v.originVariantId);
    if(!trovata){
      origine={stato:'non_disponibile'};
    }else{
      origine={
        stato:'disponibile',
        nome:trovata.variant.name||trovata.variant.label||null,
        ingredienti:(trovata.variant.ingredients||[]).map(formattaIngredienteContesto),
        procedimento:formattaProcedimentoContesto(trovata.variant.steps),
        confronto:contaVariabiliCambiate(trovata.variant.ingredients,v.ingredients),
      };
    }
  }

  return{
    nome:recipe.name,
    categoria:recipe.category,
    porzioni:v.portionsCount,
    grammiPerPorzione:v.gramsPerPortion, // compatibilità/modello attuale — non toccato, dismissione fuori scope
    portionSize:v.portionSize!=null?v.portionSize:v.gramsPerPortion, // Step 3E: pass-through, stesso fallback già usato altrove in KHUB
    portionUnit:v.portionUnit||'g', // Step 3E: pass-through, stesso fallback già usato altrove in KHUB
    pesoTotale,
    ingredienti,
    procedimento,
    origine,
  };
}

// ══════════════════════════════════════════════════════════
// M2 — SVILUPPO: Context Builder (R3B)
// Adapter puro e di sola lettura: prepara, dallo stato PSL già caricato
// (Ricetta/Bozza corrente, L2, L3, intention/criteria), il payload
// strutturato previsto dal contratto mode:'m2' congelato in R3A
// (api/chat.js: buildM2UserMessage).
//
// NON riusa costruisciContestoSchedaLAB(): quella funzione produce un
// formato testuale/italiano pensato per "Chiedi a MichelinAI"/
// "Interpretazione modifiche" (procedimento come stringa unica, chiavi
// italiane, confronto con l'origine) — una forma incompatibile con quella
// esatta richiesta dal contratto M2 (chiavi inglesi, steps come array,
// nessun campo "origine"). Evolverla per servire entrambi i consumatori
// avrebbe significato sovraccaricarla di due forme diverse — qui invece
// un piccolo adapter dedicato, che riusa lo stesso pattern di lookup
// (R()+curLab(), stessa null-safety) senza duplicare alcuna logica
// cognitiva: nessun secondo "universo" di context builder, solo un
// secondo formato di output per lo stesso stato.
//
// Nessuna persistenza, nessuna chiamata di rete, nessuna mutazione di
// stato: legge S/recipe/variant/L2/L3/intention/criteria così come sono
// e restituisce un nuovo oggetto con array copiati (mai gli stessi
// riferimenti mutabili). La reconciliation baseline/L2 (R3C) e la
// persistenza degli aggiornamenti M2 (R3E) NON sono responsabilità di
// questa funzione — qui si legge soltanto.
//
// M1 non ha una rappresentazione separata: le sue osservazioni sono già
// L2 con provenanceType:'m1' dentro v.l2Items, incluse qui senza alcuna
// distinzione strutturale (si distinguono, se serve, solo dal campo
// provenanceType di ciascun item — mai un campo/blocco "m1" a parte).
//
// "message" (il turno corrente dello chef) è previsto dal contratto ma il
// suo wiring reale da UI resta fuori scope in R3B: il chiamante lo passa
// esplicitamente (stringa vuota se assente), nessuna lettura di stato UI
// qui dentro.
function costruisciPayloadM2(recipeId, message){
  const recipe=R(recipeId);
  if(!recipe)return null;
  const v=curLab(recipe);
  if(!v)return null;

  return{
    mode:'m2',
    recipe:{id:recipe.id,name:recipe.name,category:recipe.category},
    variant:{
      id:v.id,
      ingredients:(v.ingredients||[]).map(i=>({name:i.name,qty:i.qty,unit:i.unit})),
      steps:[...(v.steps||[])],
      portionsCount:v.portionsCount,
      gramsPerPortion:v.gramsPerPortion,
      note:v.note||'',
    },
    l2:(v.l2Items||[]).slice(),
    l3:(recipe.l3Items||[]).slice(),
    intention:{initial:v.intentionInitial!=null?v.intentionInitial:null,current:v.intentionCurrent!=null?v.intentionCurrent:null},
    criteria:{initial:v.criteriaInitial!=null?v.criteriaInitial:null,current:v.criteriaCurrent!=null?v.criteriaCurrent:null},
    message:message||'',
  };
}

// Sviluppo della Scheda — Interpretazione delle modifiche: primo vero intervento
// di MichelinAI in questa modalità. Mai automatico, sempre su richiesta esplicita.
// Non persiste: resta visibile solo mentre si lavora sulla bozza.
async function interpretaModifiche(recipeId){
  const recipe=R(recipeId);
  if(!recipe)return;
  const v=curLab(recipe);
  if(!v)return;
  if(S.interpretazioneLoading)return; // doppio clic / seconda chiamata mentre la prima è attiva

  if(v.originVariantId===null){
    toast('Questa bozza non ha una Ricetta di partenza da interpretare.','ti-alert-circle');
    return;
  }

  if(!origine){
    toast('La Ricetta di partenza non è più disponibile.','ti-alert-circle');
    return;

  const risultato=contaVariabiliCambiate(origine.variant.ingredients,v.ingredients);

  }

  const fmtIng=ings=>(ings||[]).map((i,idx)=>(idx+1)+'. '+i.name+': '+i.qty+i.unit).join('\n');
  const fmtSteps=steps=>(steps||[]).filter(s=>s&&s.trim()).join(' ')||'non ancora scritto';
  const aggiunti=risultato.dettaglio.filter(d=>d.tipo==='aggiunto').map(d=>d.ingName);
  const rimossi=risultato.dettaglio.filter(d=>d.tipo==='rimosso').map(d=>d.ingName);
  const modificati=risultato.dettaglio.filter(d=>d.tipo==='modificato').map(d=>d.ingName+' ('+d.campi.join(', ')+')');

  const prompt='Sei MichelinAI, il collega tecnico che accompagna questa Scheda per tutta la sua vita.\n\n'
    +'In questo momento la osservi mentre lo chef sta sperimentando nel LAB.\n\n'
    +'Non stai bonificando una ricetta appena nata (quello è il Primo Consulto), ma stai aiutando lo chef a comprendere le conseguenze delle modifiche che ha appena effettuato durante una sperimentazione ancora aperta.\n\n'
    +'REGOLE FONDAMENTALI\n\n'
    +'Ruolo: sei un collega tecnico, non un giudice. Aiuti lo chef a ragionare meglio, non a prendere decisioni al suo posto. Il tuo compito non è avere sempre ragione, ma aiutare lo chef a comprendere meglio ciò che probabilmente accadrà.\n\n'
    +'Tono: sempre positivo, rispettoso e incoraggiante. Non scoraggiare mai la sperimentazione. Ogni prova rappresenta un passo avanti nella costruzione del patrimonio gastronomico dell\'azienda. Anche quando individui una criticità, mantieni sempre un atteggiamento costruttivo.\n\n'
    +'Giudizio tecnico: non giudicare mai la creatività, la capacità o le scelte dello chef. Giudica invece con chiarezza e onestà le conseguenze tecniche delle modifiche apportate alla ricetta. Quando la conoscenza gastronomica e scientifica è consolidata, esprimi le conseguenze in modo diretto. Se una modifica rischia di compromettere gusto, consistenza, struttura, lievitazione, cottura, stabilità, conservazione, lavorabilità o produzione, dillo chiaramente. Se le informazioni non sono sufficienti per formulare una previsione affidabile, dichiaralo apertamente.\n\n'

    +'Classificazione: per ogni osservazione dichiara famiglia (costruzione, tecnica, validazione_sensoriale, stabilita, produzione, decisione_finale), modalità (costruttiva o diagnostica), livello di certezza.\n\n'
    +'Certezza: usa sempre il livello corretto — fatto_verificato, osservazione_ricorrente, ipotesi, dati_insufficienti. Quando non hai basi sufficienti, dichiaralo chiaramente.\n\n'
    +'DATI\n\n'
    +'Scheda: '+recipe.name+' ('+recipe.category+')\n\n'
    +'Ricetta di partenza — ingredienti:\n'+fmtIng(origine.variant.ingredients)+'\nProcedimento: '+fmtSteps(origine.variant.steps)+'\n\n'
    +'Bozza attuale — ingredienti:\n'+fmtIng(v.ingredients)+'\nProcedimento: '+fmtSteps(v.steps)+'\n\n'
    +'Confronto deterministico (già calcolato da KHUB, non ricalcolarlo):\n'
    +'Aggiunti: '+(aggiunti.join(', ')||'nessuno')+'\n'
    +'Rimossi: '+(rimossi.join(', ')||'nessuno')+'\n'
    +'Modificati: '+(modificati.join(', ')||'nessuno')+'\n\n'
    +'OUTPUT\n\n'
    +'Rispondi esclusivamente con JSON valido:\n'
    +'{"osservazioni":[{"famiglia":"...","modalita":"...","osservazione":"...","motivo":"...","fonte":"conoscenza_universale|scheda_corrente","certezza":"fatto_verificato|osservazione_ricorrente|ipotesi|dati_insufficienti"}]}\n'
    +'Massimo '+INTERPRETAZIONE_MAX_OSS+' osservazioni.';

  S.interpretazioneLoading=true;
  render();

  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:900,
        messages:[{role:'user',content:prompt}]})});
    if(!res.ok)throw new Error('HTTP '+res.status);

    const data=await res.json();
    const text=(data.content||[]).map(c=>c.text||'').join('').replace(/```json|```/g,'').trim();
    if(!text)throw new Error('risposta vuota');

    const parsed=JSON.parse(text);
    const validato=validateInterpretazioneOutput(parsed);
    if(validato.status==='invalid'){
      throw new Error('output non affidabile: '+validato.scartate.join('; '));
    }

    // Ricetta o bozza non più la stessa dopo l'attesa: risultato scartato, mai mostrato altrove
    const recipeOra=R(recipeId);
    const labOra=recipeOra&&curLab(recipeOra);
    if(!recipeOra||!labOra||labOra.id!==variantId){
      toast('La bozza è cambiata nel frattempo: risultato scartato.','ti-alert-circle');
      S.interpretazioneLoading=false;
      render();
      return;
    }

    S.interpretazioneModifiche={recipeId,variantId,osservazioni:validato.osservazioni};
    if(validato.osservazioni.length===0){
      toast('Nessuna osservazione rilevante da aggiungere.','ti-circle-check');
    }
  }catch(e){
    console.error('[Interpretazione modifiche] errore:',e);
    toast('Errore durante l\'interpretazione. Riprova.','ti-alert-circle');
  }
  S.interpretazioneLoading=false;
  render();
}
